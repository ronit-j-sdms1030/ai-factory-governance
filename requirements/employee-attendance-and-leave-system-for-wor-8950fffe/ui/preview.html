x' }}>\n              {currentData.recentAttendance.map((record, index) => (\n                <div key={index} style={{\n                  display: 'flex',\n                  justifyContent: 'space-between',\n                  alignItems: 'center',\n                  padding: '12px 0',\n                  borderBottom: index !== currentData.recentAttendance.length - 1 ? '1px solid #f0f0f0' : 'none'\n                }}>\n                  <span style={{ fontSize: '16px', color: '#333' }}>\n                    {new Date(record.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}\n                  </span>\n                  <StatusBadge status={record.status} />\n                </div>\n              ))}\n            </div>\n          </div>\n        )}\n        \n        {/* Team Attendance Grid */}\n        {userRole === 'manager' && (\n          <div style={{\n            backgroundColor: 'white',\n            borderRadius: '12px',\n            padding: '24px',\n            boxShadow: '0 4px 12px rgba(0,0,0,0.05)',\n            gridColumn: '1 / -1'\n          }}>\n            <h2 style={{ \n              margin: '0 0 16px 0', \n              fontSize: '20px', \n              fontWeight: '600', \n              color: '#333' \n            }}>\n              Team Attendance Today\n            </h2>\n            \n            <div style={{ \n              display: 'grid', \n              gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', \n              gap: '16px' \n            }}>\n              {currentData.teamAttendance.map(member => (\n                <div key={member.id} style={{\n                  display: 'flex',\n                  justifyContent: 'space-between',\n                  alignItems: 'center',\n                  padding: '16px',\n                  backgroundColor: '#f9f9f9',\n                  borderRadius: '8px',\n                  border: '1px solid #eee'\n                }}>\n                  <span style={{ fontWeight: '500', color: '#333' }}>{member.name}</span>\n                  <StatusBadge status={member.status} />\n                </div>\n              ))}\n            </div>\n          </div>\n        )}\n        \n        {/* Pending Leaves */}\n        {userRole === 'manager' && (\n          <div style={{\n            backgroundColor: 'white',\n            borderRadius: '12px',\n            padding: '24px',\n            boxShadow: '0 4px 12px rgba(0,0,0,0.05)'\n          }}>\n            <h2 style={{ \n              margin: '0 0 16px 0', \n              fontSize: '20px', \n              fontWeight: '600', \n              color: '#333' \n            }}>\n              Pending Leave Approvals\n            </h2>\n            \n            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>\n              {currentData.pendingLeaves.map(leave => (\n                <div key={leave.id} style={{\n                  padding: '16px',\n                  backgroundColor: '#fff8e1',\n                  borderRadius: '8px',\n                  border: '1px solid #ffecb3'\n                }}>\n                  <div style={{ \n                    display: 'flex', \n                    justifyContent: 'space-between', \n                    marginBottom: '8px' \n                  }}>\n                    <span style={{ fontWeight: '500', color: '#333' }}>{leave.employee}</span>\n                    <span style={{ \n                      padding: '2px 8px', \n                      backgroundColor: '#ffecb3', \n                      borderRadius: '12px', \n                      fontSize: '0.8rem',\n                      fontWeight: '500'\n                    }}>\n                      {leave.days} {leave.days === 1 ? 'day' : 'days'}\n                    </span>\n                  </div>\n                  <p style={{ margin: '0 0 8px 0', color: '#666', fontSize: '14px' }}>\n                    {leave.type}\n                  </p>\n                  <div }>\n            <div style={{ \n              width: '12px', \n              height: '12px', \n              borderRadius: '50%', \n              backgroundColor: '#4caf50',\n              marginRight: '12px'\n            }}></div>\n            <div>\n              <p style={{ \n                margin: '0 0 4px 0', \n                fontWeight: '500',\n                color: '#2e7d32'\n              }}>\n                Online & Synced\n              </p>\n              <p style={{ \n                margin: 0, \n                fontSize: '14px', \n                color: '#666' \n              }}>\n                0 queued operations\n              </p>\n            </div>\n          </div>\n          \n          <div style={{ marginTop: '20px' }}>\n            <p style={{ \n              margin: '0 0 8px 0', \n              color: '#666', \n              fontSize: '14px' \n            }}>\n              Last sync: Just now\n            </p>\n            <button style={{\n              padding: '8px 16px',\n              backgroundColor: '#f5f7fa',\n              color: '#333',\n              border: '1px solid #ddd',\n              borderRadius: '4px',\n              fontSize: '14px',\n              cursor: 'pointer'\n            }}>\n              Force Sync\n            </button>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "ClockInterface", "source": "function ClockInterface() {\n  const [currentTime, setCurrentTime] = React.useState(new Date());\n  const [isClockingIn, setIsClockingIn] = React.useState(true);\n  const [isSubmitting, setIsSubmitting] = React.useState(false);\n  const [showSuccessToast, setShowSuccessToast] = React.useState(false);\n  const [facialVerificationEnabled, setFacialVerificationEnabled] = React.useState(true);\n  const [offlineMode, setOfflineMode] = React.useState(false);\n  const [locationOverride, setLocationOverride] = React.useState(false);\n  const [capturedImage, setCapturedImage] = React.useState(null);\n\n  // Update time every second\n  React.useEffect(() => {\n    const timer = setInterval(() => {\n      setCurrentTime(new Date());\n    }, 1000);\n    return () => clearInterval(timer);\n  }, []);\n\n  const handleClockInOut = () => {\n    setIsSubmitting(true);\n    \n    // Simulate API call with 3-second timeout\n    setTimeout(() => {\n      setIsSubmitting(false);\n      setShowSuccessToast(true);\n      \n      // Hide toast after 3 seconds\n      setTimeout(() => {\n        setShowSuccessToast(false);\n      }, 3000);\n    }, 3000);\n  };\n\n  const handleCapture = () => {\n    // In a real app, this would capture from camera\n    setCapturedImage(\"data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZGRkIi8+PHRleHQgeD0iNTAiIHk9IjEwMCIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzMzMyI+Q2FwdHVyZWQgSW1hZ2U8L3RleHQ+PC9zdmc+\");\n  };\n\n  const toggleOfflineMode = () => {\n    setOfflineMode(!offlineMode);\n  };\n\n  const toggleLocationOverride = () => {\n    setLocationOverride(!locationOverride);\n  };\n\n  return (\n    <div className=\"min-h-screen bg-gray-50\">\n      {/* Success Toast */}\n      {showSuccessToast && (\n        <div className=\"fixed top-4 right-4 z-50 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg transition-all duration-300\">\n          <div className=\"flex items-center\">\n            <svg className=\"w-5 h-5 mr-2\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n              <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M5 13l4 4L19 7\"></path>\n            </svg>\n            Successfully clocked {isClockingIn ? 'in' : 'out'}!\n          </div>\n        </div>\n      )}\n\n      {/* Header */}\n      <header className=\"bg-white shadow-sm\">\n        <div className=\"max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center\">\n          <div>\n            <h1 className=\"text-2xl font-bold text-gray-900\">WorkPulse</h1>\n            <p className=\"text-sm text-gray-500\">Attendance Management System</p>\n          </div>\n          <div className=\"text-right\">\n            <div className=\"text-lg font-semibold text-indigo-600\">\n              {currentTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second: '2-digit'})}\n            </div>\n            <div className=\"text-sm text-gray-500\">\n              {currentTime.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} (IST)\n            </div>\n          </div>\n        </div>\n      </header>\n\n      <main className=\"max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8\">\n        <div className=\"grid grid-cols-1 lg:grid-cols-3 gap-8\">\n          {/* Main Clock Section */}\n          <div className=\"lg:col-span-2\">\n            <div className=\"bg-white rounded-xl shadow-md p-6\">\n              <div className=\"text-center mb-8\">\n                <h2 className=\"text-2xl font-bold text-gray-800 mb-2\">Clock In/Out</h2>\n                <p className=\"text-gray-600\">Tap the button below to record your attendance</p>\n              </div>\n\n              <div className=\"flex flex-col items-center\">\n                {/* Clock Button */}\n                <button\n                  onClick={handleClockInOut}\n                  disabled={isSubmitting}\n                  className={`w-64 h-64 rounded-full text-white font-bold text-2xl shadow-lg transform transition-all duration-200 flex items-center justify-center ${\n                    isSubmitting \n                      ? 'bg-gray-400 cursor-not-allowed' \n                      : isClockingIn \n                        ? 'bg-green-500 hover:bg-green-600 hover:scale-105 active:scale-95' \n                        : 'bg-red-500 hover:bg-red-600 hover:scale-105 active:scale-95'\n                  }`}\n                >\n                  {isSubmitting ? (\n                    <div className=\"flex flex-col items-center\">\n                      <div className=\"animate-spin rounded-full h-12 w-12 border-b-2 border-white mb-2\"></div>\n                      <span>Processing...</span>\n                    </div>\n                  ) : (\n                    `Clock ${isClockingIn ? 'In' : 'Out'}`\n                  )}\n                </button>\n\n                <div className=\"mt-6 text-center\">\n                  <p className=\"text-gray-600\">\n                    Current Status: <span className=\"font-semibold text-green-600\">Ready to Clock In</span>\n                  </p>\n                </div>\n              </div>\n            </div>\n          </div>\n\n          {/* Sidebar */}\n          <div className=\"space-y-6\">\n            {/* Device Info */}\n            <div className=\"bg-white rounded-xl shadow-md p-6\">\n              <h3 className=\"text-lg font-semibold text-gray-800 mb-4\">Device Information</h3>\n              <div className=\"space-y-3\">\n                <div className=\"flex justify-between\">\n                  <span className=\"text-gray-600\">Device:</span>\n                  <span className=\"font-medium\">iPhone 14 Pro</span>\n                </div>\n                <div className=\"flex justify-between\">\n                  <span className=\"text-gray-600\">OS:</span>\n                  <span className=\"font-medium\">iOS 17.2</span>\n                </div>\n                <div className=\"flex justify-between\">\n                  <span className=\"text-gray-600\">IP Address:</span>\n                  <span className=\"font-medium\">192.168.1.42</span>\n                </div>\n                <div className=\"flex justify-between\">\n                  <span className=\"text-gray-600\">GPS:</span>\n                  <span className=\"font-medium\">12.9716\u00b0 N, 77.5946\u00b0 E</span>\n                </div>\n              </div>\n            </div>\n\n            {/* Offline & Location Controls */}\n            <div className=\"bg-white rounded-xl shadow-md p-6\">\n              <h3 className=\"text-lg font-semibold text-gray-800 mb-4\">Connection Settings</h3>\n              <div className=\"space-y-4\">\n                <div className=\"flex items-center justify-between\">\n                  <div>\n                    <div className=\"font-medium\">Offline Mode</div>\n                    <div className=\"text-sm text-gray-500\">Records saved locally</div>\n                  </div>\n                  <button\n                    onClick={toggleOfflineMode}\n                    className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${\n                      offlineMode ? 'bg-indigo-600' : 'bg-gray-300'\n                    }`}\n                  >\n                    <span\n                      className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${\n                        offlineMode ? 'translate-x-6' : 'translate-x-1'\n                      }`}\n                    />\n                  </button>\n                </div>\n\n                <div className=\"flex items-center justify-between\">\n                  <div>\n                    <div className=\"font-medium\">Location Override</div>\n                    <div className=\"text-sm text-gray-500\">For field workers</div>\n                  </div>\n                  <button\n                    onClick={toggleLocationOverride}\n                    className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${\n                      locationOverride ? 'bg-indigo-600' : 'bg-gray-300'\n                    }`}\n                  >\n                    <span\n                      className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${\n                        locationOverride ? 'translate-x-6' : 'translate-x-1'\n                      }`}\n                    />\n                  </button>\n                </div>\n              </div>\n            </div>\n\n            {/* Facial Verification */}\n            {facialVerificationEnabled && (\n              <div className=\"bg-white rounded-xl shadow-md p-6\">\n                <h3 className=\"text-lg font-semibold text-gray-800 mb-4\">Facial Verification</h3>\n                <div className=\"aspect-video bg-gray-100 rounded-lg mb-4 flex items-center justify-center\">\n                  {capturedImage ? (\n                    <img src={capturedImage} alt=\"Captured\" className=\"w-full h-full object-cover rounded-lg\" />\n                  ) : (\n                    <div className=\"text-gray-500 text-center\">\n                      <svg className=\"mx-auto h-12 w-12\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                        <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z\"></path>\n                      </svg>\n                      <p className=\"mt-2\">Camera Feed</p>\n                    </div>\n                  )}\n                </div>\n                <button\n                  onClick={handleCapture}\n                  className=\"w-full bg-indigo-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-indigo-700 transition-colors\"\n                >\n                  Capture Image\n                </button>\n              </div>\n            )}\n          </div>\n        </div>\n      </main>\n    </div>\n  );\n}"}, {"name": "AttendanceCalendar", "source": "function AttendanceCalendar() {\n  const [currentDate, setCurrentDate] = React.useState(new Date());\n  const [selectedFilters, setSelectedFilters] = React.useState({\n    present: true,\n    late: true,\n    absent: true,\n    on_leave: true\n  });\n  const [timezone, setTimezone] = React.useState('Asia/Kolkata');\n  const [showModal, setShowModal] = React.useState(false);\n  const [selectedDay, setSelectedDay] = React.useState(null);\n  const [attendanceData, setAttendanceData] = React.useState({});\n\n  // Mock data generation\n  React.useEffect(() => {\n    const mockData = {};\n    const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();\n    \n    for (let i = 1; i <= daysInMonth; i++) {\n      const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;\n      const statuses = ['present', 'late', 'absent', 'on_leave'];\n      const status = statuses[Math.floor(Math.random() * statuses.length)];\n      \n      mockData[dateStr] = {\n        status,\n        lateMinutes: status === 'late' ? Math.floor(Math.random() * 60) : 0,\n        clockIn: status !== 'absent' ? `0${Math.floor(Math.random() * 9)}:${String(Math.floor(Math.random() * 59)).padStart(2, '0')}` : null,\n        clockOut: status !== 'absent' && Math.random() > 0.2 ? `1${Math.floor(Math.random() * 8) + 7}:${String(Math.floor(Math.random() * 59)).padStart(2, '0')}` : null,\n        device: ['Web Browser', 'Mobile App', 'Kiosk Terminal'][Math.floor(Math.random() * 3)],\n        verified: Math.random() > 0.3,\n        syncStatus: ['synced', 'pending', 'conflict'][Math.floor(Math.random() * 3)]\n      };\n    }\n    \n    setAttendanceData(mockData);\n  }, [currentDate]);\n\n  const getStatusColor = (status) => {\n    switch(status) {\n      case 'present': return 'bg-green-500';\n      case 'late': return 'bg-orange-500';\n      case 'absent': return 'bg-red-500';\n      case 'on_leave': return 'bg-blue-500';\n      default: return 'bg-gray-300';\n    }\n  };\n\n  const navigateMonth = (direction) => {\n    const newDate = new Date(currentDate);\n    newDate.setMonth(currentDate.getMonth() + direction);\n    setCurrentDate(newDate);\n  };\n\n  const toggleFilter = (filter) => {\n    setSelectedFilters(prev => ({\n      ...prev,\n      [filter]: !prev[filter]\n    }));\n  };\n\n  const handleDayClick = (day) => {\n    const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;\n    if (attendanceData[dateStr]) {\n      setSelectedDay({ day, data: attendanceData[dateStr] });\n      setShowModal(true);\n    }\n  };\n\n  const renderCalendarDays = () => {\n    const year = currentDate.getFullYear();\n    const month = currentDate.getMonth();\n    const firstDayOfMonth = new Date(year, month, 1).getDay();\n    const daysInMonth = new Date(year, month + 1, 0).getDate();\n    const days = [];\n\n    // Previous month's trailing days\n    const prevMonthDays = new Date(year, month, 0).getDate();\n    for (let i = prevMonthDays - firstDayOfMonth + 1; i <= prevMonthDays; i++) {\n      days.push(\n        <div key={`prev-${i}`} className=\"p-2 text-center text-gray-400\">\n          {i}\n        </div>\n      );\n    }\n\n    // Current month's days\n    for (let i = 1; i <= daysInMonth; i++) {\n      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;\n      const dayData = attendanceData[dateStr];\n      const isFiltered = dayData && selectedFilters[dayData.status];\n      \n      days.push(\n        <div \n          key={`curr-${i}`} \n          className={`p-2 border rounded-lg cursor-pointer transition-all hover:shadow-md ${\n            dayData && isFiltered ? 'border-gray-300' : 'border-transparent'\n          }`}\n          onClick={() => handleDayClick(i)}\n        >\n          <div className=\"flex justify-between\">\n            <span>{i}</span>\n            {dayData && isFiltered && (\n              <span className={`${getStatusColor(dayData.status)} w-3 h-3 rounded-full`} />\n            )}\n          </div>\n          {dayData?.syncStatus !== 'synced' && (\n            <div className=\"mt-1 flex justify-center\">\n              <span className={`text-xs px-1 rounded ${dayData?.syncStatus === 'pending' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'}`}>\n                {dayData?.syncStatus === 'pending' ? 'Pending' : 'Conflict'}\n              </span>\n            </div>\n          )}\n        </div>\n      );\n    }\n\n    // Next month's leading days\n    const totalCells = 42; // 6 weeks * 7 days\n    const nextMonthDays = totalCells - days.length;\n    for (let i = 1; i <= nextMonthDays; i++) {\n      days.push(\n        <div key={`next-${i}`} className=\"p-2 text-center text-gray-400\">\n          {i}\n        </div>\n      );\n    }\n\n    return days;\n  };\n\n  const exportToCSV = () => {\n    alert('Exporting attendance data to CSV...');\n    // In a real app, this would generate and download a CSV file\n  };\n\n  return (\n    <div className=\"min-h-screen bg-gray-50 p-6\">\n      <div className=\"max-w-6xl mx-auto bg-white rounded-xl shadow-sm p-6\">\n        <div className=\"flex justify-between items-center mb-8\">\n          <h1 className=\"text-2xl font-bold text-gray-800\">Attendance Calendar</h1>\n          <button \n            onClick={exportToCSV}\n            className=\"flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg transition-colors\"\n          >\n            <svg xmlns=\"http://www.w3.org/2000/svg\" className=\"h-5 w-5\" viewBox=\"0 0 20 20\" fill=\"currentColor\">\n              <path fillRule=\"evenodd\" d=\"M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z\" clipRule=\"evenodd\" />\n            </svg>\n            Export CSV\n          </button>\n        </div>\n\n        <div className=\"flex flex-wrap gap-4 mb-6\">\n          <div className=\"flex items-center gap-2\">\n            <button \n              onClick={() => navigateMonth(-1)}\n              className=\"p-2 rounded-lg hover:bg-gray-100\"\n            >\n              <svg xmlns=\"http://www.w3.org/2000/svg\" className=\"h-5 w-5\" viewBox=\"0 0 20 20\" fill=\"currentColor\">\n                <path fillRule=\"evenodd\" d=\"M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z\" clipRule=\"evenodd\" />\n              </svg>\n            </button>\n            \n            <h2 className=\"text-xl font-semibold text-gray-700 min-w-[180px] text-center\">\n              {currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}\n            </h2>\n            \n            <button \n              onClick={() => navigateMonth(1)}\n              className=\"p-2 rounded-lg hover:bg-gray-100\"\n            >\n              <svg xmlns=\"http://www.w3.org/2000/svg\" className=\"h-5 w-5\" viewBox=\"0 0 20 20\" fill=\"currentColor\">\n                <path fillRule=\"evenodd\" d=\"M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z\" clipRule=\"evenodd\" />\n              </svg>\n            </button>\n          </div>\n\n          <div className=\"flex flex-wrap gap-2 ml-auto\">\n            <div className=\"flex items-center gap-2\">\n              <label className=\"text-sm font-medium text-gray-700\">Timezone:</label>\n              <select \n                value={timezone}\n                onChange={(e) => setTimezone(e.target.value)}\n                className=\"border border-gray-300 rounded-lg px-3 py-1 text-sm\"\n              >\n                <option value=\"Asia/Kolkata\">IST (UTC+5:30)</option>\n                <option value=\"America/New_York\">EST (UTC-5:00)</option>\n                <option value=\"Europe/London\">GMT (UTC+0:00)</option>\n                <option value=\"Australia/Sydney\">AEST (UTC+10:00)</option>\n              </select>\n            </div>\n          </div>\n        </div>\n\n        <div className=\"grid grid-cols-7 gap-1 mb-2\">\n          {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (\n            <div key={day} className=\"text-center font-medium text-gray-500 py-2\">\n              {day}\n            </div>\n          ))}\n        </div>\n\n        <div className=\"grid grid-cols-7 gap-1 mb-8\">\n          {renderCalendarDays()}\n        </div>\n\n        <div className=\"flex flex-wrap gap-4 mb-6\">\n          <div className=\"flex items-center gap-2\">\n            <h3 className=\"font-medium text-gray-700\">Filter by Status:</h3>\n            <div className=\"flex flex-wrap gap-3\">\n              <label className=\"flex items-center gap-1 cursor-pointer\">\n                <input \n                  type=\"checkbox\" \n                  checked={selectedFilters.present}\n                  onChange={() => toggleFilter('present')}\n                  className=\"rounded text-green-500 focus:ring-green-500\"\n                />\n                <span className=\"w-3 h-3 bg-green-500 rounded-full\"></span>\n                <span className=\"text-sm\">Present</span>\n              </label>\n              \n              <label className=\"flex items-center gap-1 cursor-pointer\">\n                <input \n                  type=\"checkbox\" \n                  checked={selectedFilters.late}\n                  onChange={() => toggleFilter('late')}\n                  className=\"rounded text-orange-500 focus:ring-orange-500\"\n                />\n                <span className=\"w-3 h-3 bg-orange-500 rounded-full\"></span>\n                <span className=\"text-sm\">Late</span>\n              </label>\n              \n              <label className=\"flex items-center gap-1 cursor-pointer\">\n                <input \n                  type=\"checkbox\" \n                  checked={selectedFilters.absent}\n                  onChange={() => toggleFilter('absent')}\n                  className=\"rounded text-red-500 focus:ring-red-500\"\n                />\n                <span className=\"w-3 h-3 bg-red-500 rounded-full\"></span>\n                <span className=\"text-sm\">Absent</span>\n              </label>\n              \n              <label className=\"flex items-center gap-1 cursor-pointer\">\n                <input \n                  type=\"checkbox\" \n                  checked={selectedFilters.on_leave}\n                  onChange={() => toggleFilter('on_leave')}\n                  className=\"rounded text-blue-500 focus:ring-blue-500\"\n                />\n                <span className=\"w-3 h-3 bg-blue-500 rounded-full\"></span>\n                <span className=\"text-sm\">On Leave</span>\n              </label>\n            </div>\n          </div>\n        </div>\n\n        <div className=\"flex flex-wrap gap-6 text-sm\">\n          <div className=\"flex items-center gap-2\">\n            <span className=\"w-3 h-3 bg-green-500 rounded-full\"></span>\n            <span>Present</span>\n          </div>\n          <div className=\"flex items-center gap-2\">\n            <span className=\"w-3 h-3 bg-orange-500 rounded-full\"></span>\n            <span>Late Arrival</span>\n          </div>\n          <div className=\"flex items-center gap-2\">\n            <span className=\"w-3 h-3 bg-red-500 rounded-full\"></span>\n            <span>Absent</span>\n          </div>\n          <div className=\"flex items-center gap-2\">\n            <span className=\"w-3 h-3 bg-blue-500 rounded-full\"></span>\n            <span>On Leave</span>\n          </div>\n          <div className=\"flex items-center gap-2\">\n            <span className=\"px-2 py-1 bg-yellow-100 text-yellow-800 rounded text-xs\">Pending</span>\n            <span>Offline Record Pending Sync</span>\n          </div>\n          <div className=\"flex items-center gap-2\">\n            <span className=\"px-2 py-1 bg-red-100 text-red-800 rounded text-xs\">Conflict</span>\n            <span>Sync Conflict Requires Review</span>\n          </div>\n        </div>\n      </div>\n\n      {/* Day Detail Modal */}\n      {showModal && selectedDay && (\n        <div className=\"fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50\">\n          <div className=\"bg-white rounded-xl shadow-lg w-full max-w-md p-6\">\n            <div className=\"flex justify-between items-center mb-4\">\n              <h3 className=\"text-xl font-bold text-gray-800\">\n                {currentDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}\n              </h3>\n              <button \n                onClick={() => setShowModal(false)}\n                className=\"text-gray-500 hover:text-gray-700\"\n              >\n                <svg xmlns=\"http://www.w3.org/2000/svg\" className=\"h-6 w-6\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\">\n                  <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M6 18L18 6M6 6l12 12\" />\n                </svg>\n              </button>\n            </div>\n\n            <div className=\"space-y-4\">\n              <div className=\"flex items-center justify-between p-3 bg-gray-50 rounded-lg\">\n                <span className=\"font-medium text-gray-700\">Status</span>\n                <span className={`px-3 py-1 rounded-full text-white text-sm ${\n                  selectedDay.data.status === 'present' ? 'bg-green-500' :\n                  selectedDay.data.status === 'late' ? 'bg-orange-500' :\n                  selectedDay.data.status === 'absent' ? 'bg-red-500' : 'bg-blue-500'\n                }`}>\n                  {selectedDay.data.status.replace('_', ' ').toUpperCase()}\n                </span>\n              </div>\n\n              {selectedDay.data.clockIn && (\n                <div className=\"flex items-center justify-between p-3 bg-gray-50 rounded-lg\">\n                  <span className=\"font-medium text-gray-700\">Clock In</span>\n                  <span>{selectedDay.data.clockIn}</span>\n                </div>\n              )}\n\n              {selectedDay.data.clockOut && (\n                <div className=\"flex items-center justify-between p-3 bg-gray-50 rounded-lg\">\n                  <span className=\"font-medium text-gray-700\">Clock Out</span>\n                  <span>{selectedDay.data.clockOut}</span>\n                </div>\n              )}\n\n              {selectedDay.data.lateMinutes > 0 && (\n                <div className=\"flex items-center justify-between p-3 bg-gray-50 rounded-lg\">\n                  <span className=\"font-medium text-gray-700\">Late By</span>\n                  <span>{selectedDay.data.lateMinutes} minutes</span>\n                </div>\n              )}\n\n              <div className=\"flex items-center justify-between p-3 bg-gray-50 rounded-lg\">\n                <span className=\"font-medium text-gray-700\">Device</span>\n                <span>{selectedDay.data.device}</span>\n              </div>\n\n              <div className=\"flex items-center justify-between p-3 bg-gray-50 rounded-lg\">\n                <span className=\"font-medium text-gray-700\">Verification</span>\n                <span className={selectedDay.data.verified ? \"text-green-600\" : \"text-red-600\"}>\n                  {selectedDay.data.verified ? \"Verified\" : \"Not Verified\"}\n                </span>\n              </div>\n\n              <div className=\"flex items-center justify-between p-3 bg-gray-50 rounded-lg\">\n                <span className=\"font-medium text-gray-700\">Sync Status</span>\n                <span className={`px-2 py-1 rounded text-xs ${\n                  selectedDay.data.syncStatus === 'synced' ? 'bg-green-100 text-green-800' :\n                  selectedDay.data.syncStatus === 'pending' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'\n                }`}>\n                  {selectedDay.data.syncStatus.charAt(0).toUpperCase() + selectedDay.data.syncStatus.slice(1)}\n                </span>\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}"}, {"name": "LeaveRequest", "source": "function LeaveRequest() {\n  // Mock data\n  const employee = {\n    id: \"EMP001\",\n    first_name: \"Alex\",\n    last_name: \"Johnson\",\n    department: \"Engineering\",\n    location: \"New York\"\n  };\n\n  const leaveTypes = [\n    { id: 1, name: \"Annual Leave\", code: \"AL\", balance: 15, maxDays: 20, isPaid: true },\n    { id: 2, name: \"Sick Leave\", code: \"SL\", balance: 8, maxDays: 10, isPaid: true },\n    { id: 3, name: \"Unpaid Leave\", code: \"UL\", balance: 0, maxDays: 30, isPaid: false }\n  ];\n\n  const holidays = [\n    { date: \"2024-06-19\", name: \"Juneteenth\" },\n    { date: \"2024-07-04\", name: \"Independence Day\" }\n  ];\n\n  const existingRequests = [\n    { startDate: \"2024-06-25\", endDate: \"2024-06-26\", type: \"AL\" }\n  ];\n\n  const approvalPath = [\n    { name: \"Sarah Williams\", role: \"Direct Manager\", status: \"pending\" },\n    { name: \"Michael Chen\", role: \"Department Head\", status: \"pending\" }\n  ];\n\n  // State\n  const [selectedType, setSelectedType] = React.useState(leaveTypes[0]);\n  const [startDate, setStartDate] = React.useState(\"\");\n  const [endDate, setEndDate] = React.useState(\"\");\n  const [reason, setReason] = React.useState(\"\");\n  const [daysRequested, setDaysRequested] = React.useState(0);\n  const [balanceAfter, setBalanceAfter] = React.useState(selectedType.balance);\n\n  // Calculate days requested when dates change\n  React.useEffect(() => {\n    if (startDate && endDate) {\n      const start = new Date(startDate);\n      const end = new Date(endDate);\n      const diffTime = Math.abs(end - start);\n      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;\n      setDaysRequested(diffDays);\n      setBalanceAfter(selectedType.balance - diffDays);\n    }\n  }, [startDate, endDate, selectedType]);\n\n  const handleSubmit = (e) => {\n    e.preventDefault();\n    alert(`Leave request submitted!\\n${daysRequested} days of ${selectedType.name} requested.`);\n  };\n\n  return (\n    <div className=\"min-h-screen bg-gray-50\">\n      {/* Header */}\n      <div className=\"bg-white shadow\">\n        <div className=\"max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8\">\n          <h1 className=\"text-2xl font-bold text-gray-900\">Request Leave</h1>\n          <p className=\"mt-1 text-sm text-gray-500\">\n            Submit a new leave request with real-time balance updates\n          </p>\n        </div>\n      </div>\n\n      <div className=\"max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8\">\n        <div className=\"grid grid-cols-1 lg:grid-cols-3 gap-8\">\n          {/* Main Form */}\n          <div className=\"lg:col-span-2 space-y-6\">\n            <div className=\"bg-white shadow rounded-lg p-6\">\n              <form onSubmit={handleSubmit} className=\"space-y-6\">\n                {/* Leave Type Selector */}\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-2\">\n                    Leave Type\n                  </label>\n                  <div className=\"grid grid-cols-1 md:grid-cols-3 gap-4\">\n                    {leaveTypes.map((type) => (\n                      <div \n                        key={type.id}\n                        onClick={() => setSelectedType(type)}\n                        className={`border rounded-lg p-4 cursor-pointer transition-all ${\n                          selectedType.id === type.id \n                            ? 'border-blue-500 bg-blue-50 ring-2 ring-blue-200' \n                            : 'border-gray-300 hover:border-gray-400'\n                        }`}\n                      >\n                        <div className=\"flex items-center justify-between\">\n                          <h3 className=\"font-medium text-gray-900\">{type.name}</h3>\n                          {type.isPaid && (\n                            <span className=\"inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800\">\n                              Paid\n                            </span>\n                          )}\n                        </div>\n                        <p className=\"mt-1 text-sm text-gray-500\">\n                          Balance: {type.balance} days\n                        </p>\n                        <div className=\"mt-2 text-xs text-gray-400\">\n                          Max: {type.maxDays} days/year\n                        </div>\n                      </div>\n                    ))}\n                  </div>\n                  \n                  <div className=\"mt-4 p-4 bg-blue-50 rounded-lg border border-blue-100\">\n                    <h4 className=\"text-sm font-medium text-blue-800\">{selectedType.name} Policy</h4>\n                    <ul className=\"mt-2 text-sm text-blue-700 list-disc pl-5 space-y-1\">\n                      <li>Maximum consecutive days: 10</li>\n                      <li>Requires 3 days notice for approval</li>\n                      <li>Accrues monthly based on tenure</li>\n                      {selectedType.requires_medical_certificate && (\n                        <li>Medical certificate required for >3 days</li>\n                      )}\n                    </ul>\n                  </div>\n                </div>\n\n                {/* Date Selection */}\n                <div className=\"grid grid-cols-1 md:grid-cols-2 gap-6\">\n                  <div>\n                    <label className=\"block text-sm font-medium text-gray-700 mb-2\">\n                      Start Date\n                    </label>\n                    <input\n                      type=\"date\"\n                      value={startDate}\n                      onChange={(e) => setStartDate(e.target.value)}\n                      className=\"w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500\"\n                    />\n                  </div>\n                  <div>\n                    <label className=\"block text-sm font-medium text-gray-700 mb-2\">\n                      End Date\n                    </label>\n                    <input\n                      type=\"date\"\n                      value={endDate}\n                      onChange={(e) => setEndDate(e.target.value)}\n                      className=\"w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500\"\n                    />\n                  </div>\n                </div>\n\n                {/* Blocked Dates Info */}\n                <div className=\"p-4 bg-yellow-50 rounded-lg border border-yellow-100\">\n                  <h4 className=\"text-sm font-medium text-yellow-800 flex items-center\">\n                    <svg className=\"w-4 h-4 mr-1.5\" fill=\"currentColor\" viewBox=\"0 0 20 20\">\n                      <path fillRule=\"evenodd\" d=\"M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.529 0-2.492-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z\" clipRule=\"evenodd\" />\n                    </svg>\n                    Important Dates\n                  </h4>\n                  <ul className=\"mt-2 text-sm text-yellow-700 list-disc pl-5 space-y-1\">\n                    <li>Holidays during selection will not count toward leave days</li>\n                    <li>You already have leave booked: Jun 25-26</li>\n                    <li>Minimum notice period: 3 business days</li>\n                  </ul>\n                </div>\n\n                {/* Reason Field */}\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-2\">\n                    Reason for Leave\n                  </label>\n                  <textarea\n                    value={reason}\n                    onChange={(e) => setReason(e.target.value)}\n                    rows={3}\n                    className=\"w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500\"\n                    placeholder=\"Please provide details about your leave request...\"\n                  />\n                </div>\n\n                {/* Balance Impact Calculator */}\n                <div className=\"bg-gray-50 p-4 rounded-lg border border-gray-200\">\n                  <h3 className=\"text-lg font-medium text-gray-900 mb-3\">Leave Balance Impact</h3>\n                  <div className=\"grid grid-cols-3 gap-4 text-center\">\n                    <div className=\"border-r border-gray-200\">\n                      <p className=\"text-sm text-gray-500\">Current Balance</p>\n                      <p className=\"text-xl font-bold text-gray-900\">{selectedType.balance} days</p>\n                    </div>\n                    <div className=\"border-r border-gray-200\">\n                      <p className=\"text-sm text-gray-500\">Days Requested</p>\n                      <p className=\"text-xl font-bold text-blue-600\">{daysRequested} days</p>\n                    </div>\n                    <div>\n                      <p className=\"text-sm text-gray-500\">Balance After</p>\n                      <p className={`text-xl font-bold ${\n                        balanceAfter >= 0 ? 'text-green-600' : 'text-red-600'\n                      }`}>\n                        {balanceAfter >= 0 ? balanceAfter : 'Insufficient'} days\n                      </p>\n                    </div>\n                  </div>\n                </div>\n\n                <div className=\"flex justify-end\">\n                  <button\n                    type=\"submit\"\n                    disabled={balanceAfter < 0 || !startDate || !endDate}\n                    className=\"inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed\"\n                  >\n                    Submit Leave Request\n                  </button>\n                </div>\n              </form>\n            </div>\n          </div>\n\n          {/* Sidebar */}\n          <div className=\"space-y-6\">\n            {/* Current Balances Summary */}\n            <div className=\"bg-white shadow rounded-lg p-6\">\n              <h2 className=\"text-lg font-medium text-gray-900 mb-4\">Your Leave Balances</h2>\n              <div className=\"space-y-4\">\n                {leaveTypes.map((type) => (\n                  <div key={type.id} className=\"flex justify-between items-center pb-3 border-b border-gray-100 last:border-0 last:pb-0\">\n                    <div>\n                      <p className=\"font-medium text-gray-900\">{type.name}</p>\n                      <p className=\"text-sm text-gray-500\">{type.code}</p>\n                    </div>\n                    <div className=\"text-right\">\n                      <p className=\"font-medium text-gray-900\">{type.balance} days</p>\n                      <p className=\"text-sm text-gray-500\">of {type.maxDays}</p>\n                    </div>\n                  </div>\n                ))}\n              </div>\n              \n              <div className=\"mt-6 pt-4 border-t border-gray-200\">\n                <div className=\"flex justify-between text-sm\">\n                  <span className=\"text-gray-500\">Last updated:</span>\n                  <span className=\"font-medium\">May 15, 2024</span>\n                </div>\n              </div>\n            </div>\n\n            {/* Approval Workflow Preview */}\n            <div className=\"bg-white shadow rounded-lg p-6\">\n              <h2 className=\"text-lg font-medium text-gray-900 mb-4\">Approval Workflow</h2>\n              <div className=\"flow-root\">\n                <ul className=\"space-y-4\">\n                  {approvalPath.map((approver, index) => (\n                    <li key={index} className=\"relative pl-8\">\n                      <div className=\"absolute left-0 top-1 flex items-center justify-center w-6 h-6 rounded-full bg-blue-100 border-2 border-blue-300\">\n                        <div className=\"w-2 h-2 rounded-full bg-blue-500\"></div>\n                      </div>\n                      <div className=\"flex justify-between\">\n                        <div>\n                          <p className=\"font-medium text-gray-900\">{approver.name}</p>\n                          <p className=\"text-sm text-gray-500\">{approver.role}</p>\n                        </div>\n                        <span className=\"inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800 capitalize\">\n                          {approver.status}\n                        </span>\n                      </div>\n                    </li>\n                  ))}\n                </ul>\n                \n                <div className=\"mt-6 p-3 bg-blue-50 rounded-md\">\n                  <p className=\"text-xs text-blue-700\">\n                    <svg className=\"w-4 h-4 inline-block mr-1\" fill=\"currentColor\" viewBox=\"0 0 20 20\">\n                      <path fillRule=\"evenodd\" d=\"M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z\" clipRule=\"evenodd\" />\n                    </svg>\n                    Estimated approval time: 2-3 business days\n                  </p>\n                </div>\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "TeamAttendance", "source": "function TeamAttendance() {\n  // Mock data\n  const teamMembers = [\n    { id: 1, name: \"Aarav Patel\", department: \"Engineering\", status: \"present\", avatar: \"AP\" },\n    { id: 2, name: \"Priya Sharma\", department: \"Marketing\", status: \"late\", avatar: \"PS\" },\n    { id: 3, name: \"Rohan Gupta\", department: \"Sales\", status: \"absent\", avatar: \"RG\" },\n    { id: 4, name: \"Sneha Reddy\", department: \"HR\", status: \"on_leave\", avatar: \"SR\" },\n    { id: 5, name: \"Vikram Singh\", department: \"Finance\", status: \"half_day\", avatar: \"VS\" },\n  ];\n\n  const leaveRequests = [\n    {\n      id: 101,\n      employee: \"Aarav Patel\",\n      startDate: \"2023-06-15\",\n      endDate: \"2023-06-16\",\n      leaveType: \"Casual Leave\",\n      reason: \"Personal appointment\",\n      balanceImpact: \"-2 days\",\n      status: \"pending\"\n    },\n    {\n      id: 102,\n      employee: \"Neha Kapoor\",\n      startDate: \"2023-06-20\",\n      endDate: \"2023-06-22\",\n      leaveType: \"Sick Leave\",\n      reason: \"Medical consultation\",\n      balanceImpact: \"-3 days\",\n      status: \"pending\"\n    }\n  ];\n\n  const attendanceData = [\n    { date: \"2023-06-01\", present: 42, late: 3, absent: 5 },\n    { date: \"2023-06-02\", present: 38, late: 5, absent: 7 },\n    { date: \"2023-06-05\", present: 40, late: 4, absent: 6 },\n    { date: \"2023-06-06\", present: 45, late: 2, absent: 3 },\n    { date: \"2023-06-07\", present: 39, late: 6, absent: 5 },\n    { date: \"2023-06-08\", present: 41, late: 3, absent: 6 },\n    { date: \"2023-06-09\", present: 43, late: 2, absent: 5 }\n  ];\n\n  // State\n  const [selectedRequest, setSelectedRequest] = React.useState(null);\n  const [comment, setComment] = React.useState(\"\");\n  const [searchTerm, setSearchTerm] = React.useState(\"\");\n  const [filteredMembers, setFilteredMembers] = React.useState(teamMembers);\n\n  // Handlers\n  const handleApprove = () => {\n    if (selectedRequest) {\n      console.log(`Approved leave request ${selectedRequest.id} with comment: ${comment}`);\n      // In a real app, this would update the backend\n      setSelectedRequest(null);\n      setComment(\"\");\n    }\n  };\n\n  const handleReject = () => {\n    if (selectedRequest) {\n      console.log(`Rejected leave request ${selectedRequest.id} with comment: ${comment}`);\n      // In a real app, this would update the backend\n      setSelectedRequest(null);\n      setComment(\"\");\n    }\n  };\n\n  const handleSearch = (e) => {\n    const term = e.target.value;\n    setSearchTerm(term);\n    if (term) {\n      const filtered = teamMembers.filter(member => \n        member.name.toLowerCase().includes(term.toLowerCase()) ||\n        member.department.toLowerCase().includes(term.toLowerCase())\n      );\n      setFilteredMembers(filtered);\n    } else {\n      setFilteredMembers(teamMembers);\n    }\n  };\n\n  // Status badge component\n  const StatusBadge = ({ status }) => {\n    const statusColors = {\n      present: \"bg-green-100 text-green-800\",\n      late: \"bg-yellow-100 text-yellow-800\",\n      absent: \"bg-red-100 text-red-800\",\n      on_leave: \"bg-blue-100 text-blue-800\",\n      half_day: \"bg-purple-100 text-purple-800\"\n    };\n\n    const statusText = {\n      present: \"Present\",\n      late: \"Late\",\n      absent: \"Absent\",\n      on_leave: \"On Leave\",\n      half_day: \"Half Day\"\n    };\n\n    return (\n      <span className={`px-2 py-1 rounded-full text-xs font-medium ${statusColors[status]}`}>\n        {statusText[status]}\n      </span>\n    );\n  };\n\n  // Attendance chart component\n  const AttendanceChart = () => {\n    const maxValue = Math.max(...attendanceData.map(d => d.present + d.late + d.absent));\n    \n    return (\n      <div className=\"bg-white p-4 rounded-lg shadow\">\n        <h3 className=\"text-lg font-semibold mb-4\">Weekly Attendance Trend</h3>\n        <div className=\"flex items-end justify-between h-40\">\n          {attendanceData.map((day, index) => (\n            <div key={index} className=\"flex flex-col items-center\">\n              <div className=\"flex flex-col-reverse items-center w-8\">\n                <div \n                  className=\"w-full bg-green-500 rounded-t\" \n                  style={{ height: `${(day.present / maxValue) * 100}%` }}\n                ></div>\n                <div \n                  className=\"w-full bg-yellow-500\" \n                  style={{ height: `${(day.late / maxValue) * 100}%` }}\n                ></div>\n                <div \n                  className=\"w-full bg-red-500 rounded-b\" \n                  style={{ height: `${(day.absent / maxValue) * 100}%` }}\n                ></div>\n              </div>\n              <span className=\"text-xs mt-2\">{new Date(day.date).getDate()}</span>\n            </div>\n          ))}\n        </div>\n        <div className=\"flex justify-center mt-4 space-x-4\">\n          <div className=\"flex items-center\">\n            <div className=\"w-3 h-3 bg-green-500 rounded mr-1\"></div>\n            <span className=\"text-xs\">Present</span>\n          </div>\n          <div className=\"flex items-center\">\n            <div className=\"w-3 h-3 bg-yellow-500 rounded mr-1\"></div>\n            <span className=\"text-xs\">Late</span>\n          </div>\n          <div className=\"flex items-center\">\n            <div className=\"w-3 h-3 bg-red-500 rounded mr-1\"></div>\n            <span className=\"text-xs\">Absent</span>\n          </div>\n        </div>\n      </div>\n    );\n  };\n\n  return (\n    <div className=\"min-h-screen bg-gray-50\">\n      {/* Header */}\n      <div className=\"bg-white shadow\">\n        <div className=\"max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8\">\n          <h1 className=\"text-2xl font-bold text-gray-900\">Team Attendance</h1>\n          <p className=\"mt-1 text-sm text-gray-500\">Manage your team's attendance and leave requests</p>\n        </div>\n      </div>\n\n      <div className=\"max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8\">\n        <div className=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n          {/* Main Content */}\n          <div className=\"lg:col-span-2 space-y-6\">\n            {/* Search and Filters */}\n            <div className=\"bg-white shadow rounded-lg p-4\">\n              <div className=\"flex flex-col md:flex-row md:items-center md:justify-between\">\n                <div>\n                  <label htmlFor=\"search\" className=\"block text-sm font-medium text-gray-700 mb-1\">\n                    Search Team Members\n                  </label>\n                  <input\n                    type=\"text\"\n                    id=\"search\"\n                    placeholder=\"Search by name or department...\"\n                    className=\"w-full md:w-80 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500\"\n                    value={searchTerm}\n                    onChange={handleSearch}\n                  />\n                </div>\n                <div className=\"mt-4 md:mt-0\">\n                  <button className=\"px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500\">\n                    Bulk Actions\n                  </button>\n                </div>\n              </div>\n            </div>\n\n            {/* Attendance Grid */}\n            <div className=\"bg-white shadow rounded-lg overflow-hidden\">\n              <div className=\"px-4 py-5 sm:px-6 border-b border-gray-200\">\n                <h3 className=\"text-lg leading-6 font-medium text-gray-900\">Today's Attendance</h3>\n              </div>\n              <div className=\"overflow-x-auto\">\n                <table className=\"min-w-full divide-y divide-gray-200\">\n                  <thead className=\"bg-gray-50\">\n                    <tr>\n                      <th scope=\"col\" className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">\n                        Employee\n                      </th>\n                      <th scope=\"col\" className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">\n                        Department\n                      </th>\n                      <th scope=\"col\" className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">\n                        Status\n                      </th>\n                      <th scope=\"col\" className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">\n                        Clock In\n                      </th>\n                      <th scope=\"col\" className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">\n                        Clock Out\n                      </th>\n                    </tr>\n                  </thead>\n                  <tbody className=\"bg-white divide-y divide-gray-200\">\n                    {filteredMembers.map((member) => (\n                      <tr key={member.id}>\n                        <td className=\"px-6 py-4 whitespace-nowrap\">\n                          <div className=\"flex items-center\">\n                            <div className=\"flex-shrink-0 h-10 w-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-medium\">\n                              {member.avatar}\n                            </div>\n                            <div className=\"ml-4\">\n                              <div className=\"text-sm font-medium text-gray-900\">{member.name}</div>\n                            </div>\n                          </div>\n                        </td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                          {member.department}\n                        </td>\n                        <td className=\"px-6 py-4 whitespace-nowrap\">\n                          <StatusBadge status={member.status} />\n                        </td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                          {member.status === \"present\" || member.status === \"late\" ? \"09:15 AM\" : \"-\"}\n                        </td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                          {member.status === \"present\" || member.status === \"late\" ? \"06:30 PM\" : \"-\"}\n                        </td>\n                      </tr>\n                    ))}\n                  </tbody>\n                </table>\n              </div>\n            </div>\n\n            {/* Attendance Chart */}\n            <AttendanceChart />\n          </div>\n\n          {/* Sidebar */}\n          <div className=\"space-y-6\">\n            {/* Pending Leave Requests */}\n            <div className=\"bg-white shadow rounded-lg overflow-hidden\">\n              <div className=\"px-4 py-5 sm:px-6 border-b border-gray-200\">\n                <h3 className=\"text-lg leading-6 font-medium text-gray-900\">Pending Leave Requests</h3>\n              </div>\n              <div className=\"divide-y divide-gray-200\">\n                {leaveRequests.map((request) => (\n                  <div \n                    key={request.id} \n                    className={`p-4 cursor-pointer hover:bg-gray-50 ${selectedRequest?.id === request.id ? 'bg-blue-50' : ''}`}\n                    onClick={() => setSelectedRequest(request)}\n                  >\n                    <div className=\"flex justify-between\">\n                      <h4 className=\"text-sm font-medium text-gray-900\">{request.employee}</h4>\n                      <span className=\"inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800\">\n                        Pending\n                      </span>\n                    </div>\n                    <p className=\"text-sm text-gray-500 mt-1\">{request.leaveType}</p>\n                    <p className=\"text-xs text-gray-400 mt-1\">{request.startDate} to {request.endDate}</p>\n                  </div>\n                ))}\n              </div>\n            </div>\n\n            {/* Leave Request Details */}\n            {selectedRequest && (\n              <div className=\"bg-white shadow rounded-lg overflow-hidden\">\n                <div className=\"px-4 py-5 sm:px-6 border-b border-gray-200\">\n                  <h3 className=\"text-lg leading-6 font-medium text-gray-900\">Leave Request Details</h3>\n                </div>\n                <div className=\"p-4 space-y-4\">\n                  <div>\n                    <h4 className=\"text-sm font-medium text-gray-900\">Employee</h4>\n                    <p className=\"text-sm text-gray-500\">{selectedRequest.employee}</p>\n                  </div>\n                  <div>\n                    <h4 className=\"text-sm font-medium text-gray-900\">Dates</h4>\n                    <p className=\"text-sm text-gray-500\">{selectedRequest.startDate} to {selectedRequest.endDate}</p>\n                  </div>\n                  <div>\n                    <h4 className=\"text-sm font-medium text-gray-900\">Leave Type</h4>\n                    <p className=\"text-sm text-gray-500\">{selectedRequest.leaveType}</p>\n                  </div>\n                  <div>\n                    <h4 className=\"text-sm font-medium text-gray-900\">Reason</h4>\n                    <p className=\"text-sm text-gray-500\">{selectedRequest.reason}</p>\n                  </div>\n                  <div>\n                    <h4 className=\"text-sm font-medium text-gray-900\">Balance Impact</h4>\n                    <p className=\"text-sm text-gray-500\">{selectedRequest.balanceImpact}</p>\n                  </div>\n                  <div>\n                    <label htmlFor=\"comment\" className=\"block text-sm font-medium text-gray-700\">\n                      Comment\n                    </label>\n                    <textarea\n                      id=\"comment\"\n                      rows={3}\n                      className=\"mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm\"\n                      value={comment}\n                      onChange={(e) => setComment(e.target.value)}\n                      placeholder=\"Add a comment for the employee...\"\n                    ></textarea>\n                  </div>\n                  <div className=\"flex space-x-3\">\n                    <button\n                      onClick={handleApprove}\n                      className=\"flex-1 bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500\"\n                    >\n                      Approve\n                    </button>\n                    <button\n                      onClick={handleReject}\n                      className=\"flex-1 bg-red-600 text-white py-2 px-4 rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500\"\n                    >\n                      Reject\n                    </button>\n                  </div>\n                </div>\n              </div>\n            )}\n\n            {/* Conflict Resolution */}\n            <div className=\"bg-white shadow rounded-lg overflow-hidden\">\n              <div className=\"px-4 py-5 sm:px-6 border-b border-gray-200\">\n                <h3 className=\"text-lg leading-6 font-medium text-gray-900\">Conflict Resolution</h3>\n              </div>\n              <div className=\"p-4\">\n                <p className=\"text-sm text-gray-500 mb-4\">\n                  Resolve discrepancies between online and offline attendance records.\n                </p>\n                <div className=\"space-y-3\">\n                  <div className=\"border border-gray-200 rounded-md p-3\">\n                    <div className=\"flex justify-between\">\n                      <span className=\"text-sm font-medium\">Rajiv Mehta</span>\n                      <span className=\"inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800\">\n                        Conflict\n                      </span>\n                    </div>\n                    <p className=\"text-xs text-gray-500 mt-1\">June 5, 2023 - Clock-in discrepancy</p>\n                  </div>\n                  <button className=\"w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500\">\n                    Resolve Conflicts\n                  </button>\n                </div>\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "ShiftRoster", "source": "function ShiftRoster() {\n  // Mock data\n  const shifts = [\n    { id: 1, name: 'Morning Shift', start_time_utc: '08:00', end_time_utc: '16:00', timezone: 'IST', is_overnight: false },\n    { id: 2, name: 'Night Shift', start_time_utc: '20:00', end_time_utc: '04:00', timezone: 'IST', is_overnight: true },\n    { id: 3, name: 'Evening Shift', start_time_utc: '16:00', end_time_utc: '00:00', timezone: 'IST', is_overnight: false }\n  ];\n\n  const employees = [\n    { id: 101, first_name: 'Amit', last_name: 'Sharma', department: 'Engineering' },\n    { id: 102, first_name: 'Priya', last_name: 'Patel', department: 'Marketing' },\n    { id: 103, first_name: 'Raj', last_name: 'Kumar', department: 'Operations' },\n    { id: 104, first_name: 'Sneha', last_name: 'Iyer', department: 'HR' }\n  ];\n\n  const shiftPatterns = [\n    { id: 1, name: 'Standard Day', description: '9 AM to 5 PM' },\n    { id: 2, name: 'Night Rotation', description: 'Alternating nights' },\n    { id: 3, name: 'Weekend Only', description: 'Saturday and Sunday' }\n  ];\n\n  const [selectedDate, setSelectedDate] = React.useState(new Date().toISOString().split('T')[0]);\n  const [selectedTimezone, setSelectedTimezone] = React.useState('IST');\n  const [draggedEmployee, setDraggedEmployee] = React.useState(null);\n  const [assignments, setAssignments] = React.useState({});\n  const [showImportModal, setShowImportModal] = React.useState(false);\n  const [history, setHistory] = React.useState([\n    { id: 1, employee: 'Amit Sharma', shift: 'Morning Shift', date: '2023-05-15', assignedBy: 'Admin User' },\n    { id: 2, employee: 'Priya Patel', shift: 'Night Shift', date: '2023-05-14', assignedBy: 'Admin User' }\n  ]);\n\n  const handleDragStart = (e, employee) => {\n    setDraggedEmployee(employee);\n    e.dataTransfer.effectAllowed = 'move';\n  };\n\n  const handleDragOver = (e) => {\n    e.preventDefault();\n    e.dataTransfer.dropEffect = 'move';\n  };\n\n  const handleDrop = (e, shiftId) => {\n    e.preventDefault();\n    if (draggedEmployee) {\n      const newAssignment = {\n        employee: `${draggedEmployee.first_name} ${draggedEmployee.last_name}`,\n        shift: shifts.find(s => s.id === shiftId).name,\n        date: selectedDate,\n        assignedBy: 'Current User'\n      };\n      \n      setHistory([newAssignment, ...history]);\n      setDraggedEmployee(null);\n    }\n  };\n\n  const handleImportClick = () => {\n    setShowImportModal(true);\n  };\n\n  const handleFileUpload = (e) => {\n    // In a real app, this would process the CSV\n    alert('CSV file processed successfully!');\n    setShowImportModal(false);\n  };\n\n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Sidebar */}\n      <div className=\"w-64 bg-indigo-800 text-white p-6 flex flex-col\">\n        <h1 className=\"text-2xl font-bold mb-8\">WorkPulse</h1>\n        <nav className=\"flex-1\">\n          <ul className=\"space-y-2\">\n            <li><a href=\"/dashboard\" className=\"block py-2 hover:bg-indigo-700 rounded px-4\">Dashboard</a></li>\n            <li><a href=\"/attendance\" className=\"block py-2 hover:bg-indigo-700 rounded px-4\">Attendance</a></li>\n            <li><a href=\"/leave/request\" className=\"block py-2 hover:bg-indigo-700 rounded px-4\">Leave Requests</a></li>\n            <li><a href=\"/team\" className=\"block py-2 hover:bg-indigo-700 rounded px-4\">Team Attendance</a></li>\n            <li><a href=\"/shifts\" className=\"block py-2 bg-indigo-900 rounded px-4\">Shift Roster</a></li>\n            <li><a href=\"/policies\" className=\"block py-2 hover:bg-indigo-700 rounded px-4\">Policies</a></li>\n            <li><a href=\"/payroll\" className=\"block py-2 hover:bg-indigo-700 rounded px-4\">Payroll Export</a></li>\n          </ul>\n        </nav>\n        <div className=\"mt-auto\">\n          <a href=\"/profile\" className=\"block py-2 hover:bg-indigo-700 rounded px-4\">Profile Settings</a>\n        </div>\n      </div>\n\n      {/* Main Content */}\n      <div className=\"flex-1 overflow-auto p-8\">\n        <div className=\"mb-8\">\n          <h1 className=\"text-3xl font-bold text-gray-800\">Shift Roster Management</h1>\n          <p className=\"text-gray-600\">Manage employee shifts and assignments</p>\n        </div>\n\n        {/* Controls */}\n        <div className=\"bg-white rounded-lg shadow p-6 mb-8\">\n          <div className=\"flex justify-between items-center mb-6\">\n            <div>\n              <label className=\"mr-2 text-gray-700\">Select Date:</label>\n              <input \n                type=\"date\" \n                value={selectedDate}\n                onChange={(e) => setSelectedDate(e.target.value)}\n                className=\"border rounded px-3 py-2\"\n              />\n            </div>\n            \n            <div>\n              <label className=\"mr-2 text-gray-700\">Timezone:</label>\n              <select \n                value={selectedTimezone}\n                onChange={(e) => setSelectedTimezone(e.target.value)}\n                className=\"border rounded px-3 py-2\"\n              >\n                <option value=\"IST\">India Standard Time (IST)</option>\n                <option value=\"EST\">Eastern Standard Time (EST)</option>\n                <option value=\"UTC\">Coordinated Universal Time (UTC)</option>\n              </select>\n            </div>\n            \n            <div className=\"flex space-x-3\">\n              <button \n                onClick={handleImportClick}\n                className=\"bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md flex items-center\"\n              >\n                <svg className=\"w-5 h-5 mr-2\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10\" />\n                </svg>\n                Import CSV\n              </button>\n              \n              <button className=\"bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md flex items-center\">\n                <svg className=\"w-5 h-5 mr-2\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4\" />\n                </svg>\n                Export CSV\n              </button>\n            </div>\n          </div>\n\n          {/* Calendar View */}\n          <div className=\"border rounded-lg p-4 mb-6\">\n            <div className=\"grid grid-cols-7 gap-2 mb-2\">\n              {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (\n                <div key={day} className=\"text-center font-medium text-gray-600 py-2\">{day}</div>\n              ))}\n            </div>\n            <div className=\"grid grid-cols-7 gap-2\">\n              {[...Array(35)].map((_, i) => {\n                const day = i - new Date(selectedDate).getDay() + 1;\n                const isCurrentMonth = day > 0 && day <= new Date(selectedDate).getDate();\n                return (\n                  <div \n                    key={i} \n                    className={`min-h-24 border rounded p-2 ${isCurrentMonth ? 'bg-white' : 'bg-gray-100'}`}\n                  >\n                    <div className=\"text-right text-sm font-medium mb-1\">\n                      {isCurrentMonth ? day : ''}\n                    </div>\n                    {isCurrentMonth && day === new Date().getDate() && (\n                      <div className=\"text-xs bg-blue-100 text-blue-800 rounded px-1 py-0.5\">\n                        Today\n                      </div>\n                    )}\n                  </div>\n                );\n              })}\n            </div>\n          </div>\n        </div>\n\n        {/* Drag & Drop Assignment Area */}\n        <div className=\"grid grid-cols-1 lg:grid-cols-3 gap-8\">\n          {/* Employee List */}\n          <div className=\"bg-white rounded-lg shadow p-6\">\n            <h2 className=\"text-xl font-semibold mb-4 text-gray-800\">Available Employees</h2>\n            <div className=\"space-y-3\">\n              {employees.map(employee => (\n                <div \n                  key={employee.id}\n                  draggable\n                  onDragStart={(e) => handleDragStart(e, employee)}\n                  className=\"border rounded p-3 cursor-move bg-gray-50 hover:bg-indigo-50 flex items-center\"\n                >\n                  <div className=\"w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-white text-sm font-medium mr-3\">\n                    {employee.first_name.charAt(0)}{employee.last_name.charAt(0)}\n                  </div>\n                  <div>\n                    <div className=\"font-medium\">{employee.first_name} {employee.last_name}</div>\n                    <div className=\"text-sm text-gray-500\">{employee.department}</div>\n                  </div>\n                </div>\n              ))}\n            </div>\n          </div>\n\n          {/* Shift Assignments */}\n          <div className=\"lg:col-span-2 bg-white rounded-lg shadow p-6\">\n            <h2 className=\"text-xl font-semibold mb-4 text-gray-800\">Shift Assignments</h2>\n            <div className=\"grid grid-cols-1 md:grid-cols-3 gap-4\">\n              {shifts.map(shift => (\n                <div \n                  key={shift.id}\n                  onDragOver={handleDragOver}\n                  onDrop={(e) => handleDrop(e, shift.id)}\n                  className={`border-2 border-dashed rounded-lg p-4 ${\n                    shift.is_overnight ? 'border-red-300 bg-red-50' : 'border-indigo-300 bg-indigo-50'\n                  }`}\n                >\n                  <div className=\"flex justify-between items-start mb-2\">\n                    <h3 className=\"font-semibold\">{shift.name}</h3>\n                    {shift.is_overnight && (\n                      <span className=\"bg-red-500 text-white text-xs px-2 py-1 rounded\">Overnight</span>\n                    )}\n                  </div>\n                  <div className=\"text-sm text-gray-600 mb-2\">\n                    {shift.start_time_utc} - {shift.end_time_utc} {shift.timezone}\n                  </div>\n                  <div className=\"text-xs text-gray-500\">\n                    Drag employees here to assign\n                  </div>\n                </div>\n              ))}\n            </div>\n\n            {/* Shift Patterns */}\n            <div className=\"mt-8\">\n              <h3 className=\"text-lg font-medium mb-3 text-gray-800\">Shift Patterns</h3>\n              <div className=\"grid grid-cols-1 md:grid-cols-3 gap-3\">\n                {shiftPatterns.map(pattern => (\n                  <div key={pattern.id} className=\"border rounded p-3 bg-gray-50\">\n                    <div className=\"font-medium\">{pattern.name}</div>\n                    <div className=\"text-sm text-gray-600\">{pattern.description}</div>\n                  </div>\n                ))}\n              </div>\n            </div>\n          </div>\n        </div>\n\n        {/* Assignment History */}\n        <div className=\"mt-8 bg-white rounded-lg shadow p-6\">\n          <h2 className=\"text-xl font-semibold mb-4 text-gray-800\">Assignment History</h2>\n          <div className=\"overflow-x-auto\">\n            <table className=\"min-w-full divide-y divide-gray-200\">\n              <thead className=\"bg-gray-50\">\n                <tr>\n                  <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Employee</th>\n                  <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Shift</th>\n                  <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Date</th>\n                  <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Assigned By</th>\n                </tr>\n              </thead>\n              <tbody className=\"bg-white divide-y divide-gray-200\">\n                {history.map(record => (\n                  <tr key={record.id}>\n                    <td className=\"px-6 py-4 whitespace-nowrap\">{record.employee}</td>\n                    <td className=\"px-6 py-4 whitespace-nowrap\">{record.shift}</td>\n                    <td className=\"px-6 py-4 whitespace-nowrap\">{record.date}</td>\n                    <td className=\"px-6 py-4 whitespace-nowrap\">{record.assignedBy}</td>\n                  </tr>\n                ))}\n              </tbody>\n            </table>\n          </div>\n        </div>\n      </div>\n\n      {/* Import Modal */}\n      {showImportModal && (\n        <div className=\"fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50\">\n          <div className=\"bg-white rounded-lg shadow-xl w-1/3\">\n            <div className=\"p-6\">\n              <h3 className=\"text-lg font-medium mb-4\">Import Shift Assignments</h3>\n              <p className=\"text-gray-600 mb-4\">Upload a CSV file with employee shift assignments</p>\n              <div className=\"border-2 border-dashed border-gray-300 rounded-lg p-8 text-center mb-4\">\n                <svg className=\"mx-auto h-12 w-12 text-gray-400\" stroke=\"currentColor\" fill=\"none\" viewBox=\"0 0 48 48\" aria-hidden=\"true\">\n                  <path d=\"M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l11.172-11.172\" strokeWidth=\"2\" strokeLinecap=\"round\" strokeLinejoin=\"round\" />\n                </svg>\n                <p className=\"mt-2 text-sm text-gray-600\">\n                  <span className=\"font-medium text-indigo-600\">Click to upload</span> or drag and drop\n                </p>\n                <p className=\"text-xs text-gray-500\">CSV file up to 10MB</p>\n              </div>\n              <div className=\"flex justify-end space-x-3\">\n                <button \n                  onClick={() => setShowImportModal(false)}\n                  className=\"px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50\"\n                >\n                  Cancel\n                </button>\n                <button \n                  onClick={handleFileUpload}\n                  className=\"px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700\"\n                >\n                  Upload File\n                </button>\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}"}, {"name": "PolicyManagement", "source": "function PolicyManagement() {\n  const [activeTab, setActiveTab] = React.useState('policies');\n  const [selectedPolicy, setSelectedPolicy] = React.useState(null);\n  const [showComparison, setShowComparison] = React.useState(false);\n  const [comparisonVersions, setComparisonVersions] = React.useState([null, null]);\n  \n  // Mock data\n  const policies = [\n    { id: 1, name: 'Standard Office Policy', version: '2.1', effectiveFrom: '2024-01-01', effectiveTo: null, location: 'Bangalore HQ' },\n    { id: 2, name: 'Remote Work Policy', version: '1.3', effectiveFrom: '2023-06-01', effectiveTo: null, location: 'All Remote Locations' },\n    { id: 3, name: 'Field Operations Policy', version: '3.0', effectiveFrom: '2024-03-01', effectiveTo: null, location: 'Field Teams' }\n  ];\n  \n  const policyHistory = [\n    { id: 1, version: '2.1', effectiveFrom: '2024-01-01', createdBy: 'Amit Sharma' },\n    { id: 4, version: '2.0', effectiveFrom: '2023-09-01', createdBy: 'Priya Patel' },\n    { id: 5, version: '1.5', effectiveFrom: '2023-03-01', createdBy: 'Rajesh Kumar' }\n  ];\n  \n  const holidays = [\n    { id: 1, name: 'Republic Day', date: '2024-01-26', recurring: true, location: 'India' },\n    { id: 2, name: 'Independence Day', date: '2024-08-15', recurring: true, location: 'India' },\n    { id: 3, name: 'Diwali', date: '2024-10-31', recurring: true, location: 'India' }\n  ];\n  \n  const locations = [\n    { id: 1, name: 'Bangalore HQ' },\n    { id: 2, name: 'Mumbai Branch' },\n    { id: 3, name: 'Delhi Office' },\n    { id: 4, name: 'Chennai Center' }\n  ];\n\n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Sidebar */}\n      <div className=\"w-64 bg-indigo-800 text-white p-6 flex flex-col\">\n        <h1 className=\"text-2xl font-bold mb-8\">WorkPulse</h1>\n        <nav className=\"flex-1\">\n          <ul className=\"space-y-2\">\n            {['Dashboard', 'Clock In/Out', 'Attendance', 'Leave', 'Team', 'Shifts', 'Policies', 'Payroll', 'Profile'].map((item) => (\n              <li key={i
