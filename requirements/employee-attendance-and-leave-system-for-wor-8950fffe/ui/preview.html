ewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" strokeLinecap=\"round\" strokeLinejoin=\"round\">\n            <line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"></line>\n          </svg>\n          Clock Out\n        </button>\n      </div>\n\n      {/* Additional Controls */}\n      <div style={{\n        display: 'flex',\n        gap: '12px',\n        marginBottom: '25px'\n      }}>\n        <button\n          onClick={toggleCamera}\n          style={{\n            flex: 1,\n            padding: '12px',\n            backgroundColor: cameraActive ? '#fbbf24' : '#e2e8f0',\n            color: cameraActive ? '#78350f' : '#334155',\n            border: 'none',\n            borderRadius: '8px',\n            fontSize: '14px',\n            fontWeight: '600',\n            cursor: 'pointer',\n            display: 'flex',\n            alignItems: 'center',\n            justifyContent: 'center',\n            gap: '8px'\n          }}\n        >\n          <svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" strokeLinecap=\"round\" strokeLinejoin=\"round\">\n            <path d=\"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z\"/>\n            <circle cx=\"12\" cy=\"13\" r=\"4\"/>\n          </svg>\n          {cameraActive ? 'Disable Camera' : 'Enable Camera'}\n        </button>\n        \n        <button\n          onClick={toggleOfflineMode}\n          style={{\n            flex: 1,\n            padding: '12px',\n            backgroundColor: offlineMode ? '#10b981' : '#94a3b8',\n            color: 'white',\n            border: 'none',\n            borderRadius: '8px',\n            fontSize: '14px',\n            fontWeight: '600',\n            cursor: 'pointer',\n            display: 'flex',\n            alignItems: 'center',\n            justifyContent: 'center',\n            gap: '8px'\n          }}\n        >\n          <svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" strokeLinecap=\"round\" strokeLinejoin=\"round\">\n            <circle cx=\"12\" cy=\"12\" r=\"10\"/>\n            <path d=\"M12 8v4M12 16h.01\"/>\n          </svg>\n          {offlineMode ? 'Go Online' : 'Offline Mode'}\n        </button>\n      </div>\n\n      {/* Device Info */}\n      <div style={{\n        padding: '15px',\n        backgroundColor: 'white',\n        borderRadius: '12px',\n        boxShadow: '0 4px 6px rgba(0, 0, 0, 0.05)',\n        fontSize: '14px',\n        color: '#64748b'\n      }}>\n        <div style={{ fontWeight: '600', marginBottom: '8px', color: '#1e293b' }}>Device Information</div>\n        <div style={{ marginBottom: '4px' }}>Platform: {deviceInfo.platform}</div>\n        <div>Vender: {deviceInfo.vendor}</div>\n      </div>\n\n      {/* Submission Spinner */}\n      {isSubmitting && (\n        <div style={{\n          position: 'fixed',\n          top: 0,\n          left: 0,\n          right: 0,\n          bottom: 0,\n          backgroundColor: 'rgba(0, 0, 0, 0.5)',\n          display: 'flex',\n          alignItems: 'center',\n          justifyContent: 'center',\n          zIndex: 1000\n        }}>\n          <div style={{\n            padding: '30px',\n            backgroundColor: 'white',\n            borderRadius: '12px',\n            display: 'flex',\n            flexDirection: 'column',\n            alignItems: 'center',\n            gap: '15px'\n          }}>\n            <div className=\"spinner\" style={{\n              width: '40px',\n              height: '40px',\n              border: '4px solid #e2e8f0',\n              borderTop: '4px solid #3b82f6',\n              borderRadius: '50%',\n              animation: 'spin 1s linear infinite'\n            }}></div>\n            <div style={{ fontSize: '16px', fontWeight: '600', color: '#1e293b' }}>\n              Processing...\n            </div>\n          </div>\n        </div>\n      )}\n\n      {/* Confirmation Toast */}\n      {showConfirmation && (\n        <div style={{\n          position: 'fixed',\n          bottom: '20px',\n          left: '50%',\n          transform: 'translateX(-50%)',\n          backgroundColor: '#10b981',\n          color: 'white',\n          padding: '15px 25px',\n          borderRadius: '8px',\n          boxShadow: '0 4px 12px rgba(0, 0, 0, 0.15)',\n          zIndex: 1000,\n          display: 'flex',\n          alignItems: 'center',\n          gap: '10px'\n        }}>\n          <svg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" strokeWidth=\"2\" strokeLinecap=\"round\" strokeLinejoin=\"round\">\n            <polyline points=\"20 6 9 17 4 12\"></polyline>\n          </svg>\n          {confirmationMessage}\n        </div>\n      )}\n\n      <style jsx>{`\n        @keyframes spin {\n          0% { transform: rotate(0deg); }\n          100% { transform: rotate(360deg); }\n        }\n      `}</style>\n    </div>\n  );\n}"}, {"name": "AttendanceHistory", "component": "AttendanceHistory", "source": "function AttendanceHistory() {\n  const [selectedDate, setSelectedDate] = React.useState(null);\n  const [filterMonth, setFilterMonth] = React.useState(new Date().toISOString().slice(0, 7));\n  const [filterStatus, setFilterStatus] = React.useState('all');\n  const [timezoneView, setTimezoneView] = React.useState('Asia/Kolkata');\n  const [showModal, setShowModal] = React.useState(false);\n  const [modalData, setModalData] = React.useState(null);\n\n  // Mock attendance data\n  const attendanceData = [\n    { id: 1, date: '2023-06-01', status: 'present', lateMinutes: 0, clockIn: '09:05', clockOut: '18:10', device: 'iPhone 12', verified: true, syncStatus: 'synced' },\n    { id: 2, date: '2023-06-02', status: 'late', lateMinutes: 25, clockIn: '09:30', clockOut: '18:05', device: 'Windows Laptop', verified: false, syncStatus: 'synced' },\n    { id: 3, date: '2023-06-03', status: 'absent', lateMinutes: 0, clockIn: null, clockOut: null, device: null, verified: false, syncStatus: 'pending' },\n    { id: 4, date: '2023-06-04', status: 'on_leave', lateMinutes: 0, clockIn: null, clockOut: null, device: null, verified: false, syncStatus: 'synced' },\n    { id: 5, date: '2023-06-05', status: 'present', lateMinutes: 0, clockIn: '08:55', clockOut: '17:58', device: 'Android Phone', verified: true, syncStatus: 'synced' },\n    { id: 6, date: '2023-06-06', status: 'late', lateMinutes: 12, clockIn: '09:17', clockOut: '18:02', device: 'iPad Pro', verified: true, syncStatus: 'conflict' },\n    { id: 7, date: '2023-06-07', status: 'present', lateMinutes: 0, clockIn: '09:02', clockOut: '18:05', device: 'MacBook Pro', verified: true, syncStatus: 'synced' },\n    { id: 8, date: '2023-06-08', status: 'present', lateMinutes: 0, clockIn: '08:58', clockOut: '17:55', device: 'Surface Book', verified: false, syncStatus: 'synced' },\n    { id: 9, date: '2023-06-09', status: 'absent', lateMinutes: 0, clockIn: null, clockOut: null, device: null, verified: false, syncStatus: 'pending' },\n    { id: 10, date: '2023-06-10', status: 'on_leave', lateMinutes: 0, clockIn: null, clockOut: null, device: null, verified: false, syncStatus: 'synced' },\n    { id: 11, date: '2023-06-13', status: 'present', lateMinutes: 0, clockIn: '09:01', clockOut: '18:03', device: 'iPhone 13', verified: true, syncStatus: 'synced' },\n    { id: 12, date: '2023-06-14', status: 'late', lateMinutes: 8, clockIn: '09:08', clockOut: '18:12', device: 'Pixel 6', verified: true, syncStatus: 'synced' },\n    { id: 13, date: '2023-06-15', status: 'present', lateMinutes: 0, clockIn: '08:59', clockOut: '17:57', device: 'Dell XPS', verified: false, syncStatus: 'synced' },\n    { id: 14, date: '2023-06-16', status: 'present', lateMinutes: 0, clockIn: '09:03', clockOut: '18:01', device: 'Mac Studio', verified: true, syncStatus: 'synced' },\n    { id: 15, date: '2023-06-17', status: 'on_leave', lateMinutes: 0, clockIn: null, clockOut: null, device: null, verified: false, syncStatus: 'synced' },\n  ];\n\n  const getStatusColor = (status) => {\n    switch(status) {\n      case 'present': return '#4CAF50'; // Green\n      case 'late': return '#FF9800';    // Orange\n      case 'absent': return '#F44336';   // Red\n      case 'on_leave': return '#2196F3'; // Blue\n      default: return '#9E9E9E';\n    }\n  };\n\n  const getSyncStatusIcon = (status) => {\n    switch(status) {\n      case 'synced': return '\u2713';\n      case 'pending': return '\u21bb';\n      case 'conflict': return '\u26a0';\n      default: return '';\n    }\n  };\n\n  const handleDateClick = (date) => {\n    const record = attendanceData.find(item => item.date === date);\n    if (record) {\n      setModalData(record);\n      setShowModal(true);\n    }\n  };\n\n  const exportToCSV = () => {\n    alert('Exporting attendance data to CSV...');\n  };\n\n  const filteredData = attendanceData.filter(record => {\n    const matchesMonth = record.date.startsWith(filterMonth);\n    const matchesStatus = filterStatus === 'all' || record.status === filterStatus;\n    return matchesMonth && matchesStatus;\n  });\n\n  // Generate calendar days for the selected month\n  const generateCalendarDays = () => {\n    const year = parseInt(filterMonth.split('-')[0]);\n    const month = parseInt(filterMonth.split('-')[1]) - 1;\n    const firstDay = new Date(year, month, 1);\n    const lastDay = new Date(year, month + 1, 0);\n    const daysInMonth = lastDay.getDate();\n    const startingDayOfWeek = firstDay.getDay();\n\n    const days = [];\n    \n    // Add empty cells for days before the first day of the month\n    for (let i = 0; i < startingDayOfWeek; i++) {\n      days.push(null);\n    }\n    \n    // Add days of the month\n    for (let day = 1; day <= daysInMonth; day++) {\n      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;\n      days.push(dateStr);\n    }\n    \n    return days;\n  };\n\n  const calendarDays = generateCalendarDays();\n\n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Main Content */}\n      <div className=\"flex-1 flex flex-col overflow-hidden\">\n        <header className=\"bg-white shadow-sm z-10\">\n          <div className=\"flex items-center justify-between px-6 py-4\">\n            <h1 className=\"text-xl font-semibold text-gray-800\">Attendance History</h1>\n            <div className=\"flex space-x-4\">\n              <select \n                value={filterMonth}\n                onChange={(e) => setFilterMonth(e.target.value)}\n                className=\"border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500\"\n              >\n                <option value=\"2023-05\">May 2023</option>\n                <option value=\"2023-06\">June 2023</option>\n                <option value=\"2023-07\">July 2023</option>\n              </select>\n              \n              <select \n                value={filterStatus}\n                onChange={(e) => setFilterStatus(e.target.value)}\n                className=\"border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500\"\n              >\n                <option value=\"all\">All Statuses</option>\n                <option value=\"present\">Present</option>\n                <option value=\"late\">Late</option>\n                <option value=\"absent\">Absent</option>\n                <option value=\"on_leave\">On Leave</option>\n              </select>\n              \n              <select \n                value={timezoneView}\n                onChange={(e) => setTimezoneView(e.target.value)}\n                className=\"border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500\"\n              >\n                <option value=\"Asia/Kolkata\">IST (UTC+5:30)</option>\n                <option value=\"America/New_York\">EST (UTC-5:00)</option>\n                <option value=\"Europe/London\">GMT (UTC+0:00)</option>\n                <option value=\"Asia/Tokyo\">JST (UTC+9:00)</option>\n              </select>\n              \n              <button \n                onClick={exportToCSV}\n                className=\"bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition duration-200 flex items-center\"\n              >\n                <svg className=\"w-4 h-4 mr-2\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4\"></path>\n                </svg>\n                Export CSV\n              </button>\n            </div>\n          </div>\n        </header>\n\n        <main className=\"flex-1 overflow-y-auto p-6\">\n          <div className=\"bg-white rounded-lg shadow-sm p-6 mb-6\">\n            <div className=\"grid grid-cols-7 gap-1 mb-2\">\n              {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (\n                <div key={day} className=\"text-center font-medium text-gray-500 py-2\">{day}</div>\n              ))}\n            </div>\n            \n            <div className=\"grid grid-cols-7 gap-1\">\n              {calendarDays.map((date, index) => {\n                if (!date) {\n                  return <div key={index} className=\"h-24 border border-gray-100 rounded\"></div>;\n                }\n                \n                const record = filteredData.find(item => item.date === date);\n                const today = new Date().toISOString().split('T')[0];\n                const isToday = date === today;\n                \n                return (\n                  <div \n                    key={date} \n                    onClick={() => handleDateClick(date)}\n                    className={`h-24 border border-gray-100 rounded cursor-pointer hover:shadow-md transition-shadow duration-200 flex flex-col p-2 ${\n                      isToday ? 'ring-2 ring-blue-500' : ''\n                    }`}\n                  >\n                    <div className=\"flex justify-between\">\n                      <span className={`text-sm ${isToday ? 'font-bold text-blue-600' : 'text-gray-700'}`}>\n                        {new Date(date).getDate()}\n                      </span>\n                      {record && record.syncStatus !== 'synced' && (\n                        <span className=\"text-xs text-orange-500 font-bold\">\n                          {getSyncStatusIcon(record.syncStatus)}\n                        </span>\n                      )}\n                    </div>\n                    \n                    {record ? (\n                      <div className=\"mt-1 flex-1 flex flex-col\">\n                        <div \n                          className=\"text-xs font-medium px-2 py-1 rounded truncate\"\n                          style={{ backgroundColor: `${getStatusColor(record.status)}20`, color: getStatusColor(record.status) }}\n                        >\n                          {record.status.replace('_', ' ')}\n                        </div>\n                        {record.lateMinutes > 0 && (\n                          <div className=\"text-xs text-orange-600 mt-1\">+{record.lateMinutes} min</div>\n                        )}\n                      </div>\n                    ) : (\n                      <div className=\"text-xs text-gray-400 mt-1\">No record</div>\n                    )}\n                  </div>\n                );\n              })}\n            </div>\n          </div>\n          \n          <div className=\"bg-white rounded-lg shadow-sm p-6\">\n            <h2 className=\"text-lg font-semibold text-gray-800 mb-4\">Legend</h2>\n            <div className=\"flex flex-wrap gap-4\">\n              <div className=\"flex items-center\">\n                <div className=\"w-4 h-4 rounded-sm mr-2\" style={{ backgroundColor: '#4CAF50' }}></div>\n                <span className=\"text-sm text-gray-600\">Present</span>\n              </div>\n              <div className=\"flex items-center\">\n                <div className=\"w-4 h-4 rounded-sm mr-2\" style={{ backgroundColor: '#FF9800' }}></div>\n                <span className=\"text-sm text-gray-600\">Late</span>\n              </div>\n              <div className=\"flex items-center\">\n                <div className=\"w-4 h-4 rounded-sm mr-2\" style={{ backgroundColor: '#F44336' }}></div>\n                <span className=\"text-sm text-gray-600\">Absent</span>\n              </div>\n              <div className=\"flex items-center\">\n                <div className=\"w-4 h-4 rounded-sm mr-2\" style={{ backgroundColor: '#2196F3' }}></div>\n                <span className=\"text-sm text-gray-600\">On Leave</span>\n              </div>\n              <div className=\"flex items-center\">\n                <div className=\"w-4 h-4 rounded-sm mr-2 bg-gray-100 border border-gray-300\"></div>\n                <span className=\"text-sm text-gray-600\">No Record</span>\n              </div>\n            </div>\n            \n            <h3 className=\"text-md font-medium text-gray-800 mt-6 mb-3\">Offline Records</h3>\n            <div className=\"flex flex-wrap gap-4\">\n              <div className=\"flex items-center\">\n                <span className=\"text-orange-500 font-bold mr-1\">\u21bb</span>\n                <span className=\"text-sm text-gray-600\">Pending Sync</span>\n              </div>\n              <div className=\"flex items-center\">\n                <span className=\"text-orange-500 font-bold mr-1\">\u26a0</span>\n                <span className=\"text-sm text-gray-600\">Conflict</span>\n              </div>\n            </div>\n          </div>\n        </main>\n      </div>\n\n      {/* Day Detail Modal */}\n      {showModal && modalData && (\n        <div className=\"fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50\">\n          <div className=\"bg-white rounded-lg shadow-xl w-full max-w-md\">\n            <div className=\"px-6 py-4 border-b border-gray-200 flex justify-between items-center\">\n              <h3 className=\"text-lg font-semibold text-gray-800\">Attendance Details</h3>\n              <button \n                onClick={() => setShowModal(false)}\n                className=\"text-gray-500 hover:text-gray-700\"\n              >\n                <svg className=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M6 18L18 6M6 6l12 12\"></path>\n                </svg>\n              </button>\n            </div>\n            <div className=\"p-6\">\n              <div className=\"mb-4\">\n                <h4 className=\"text-md font-medium text-gray-700\">Date</h4>\n                <p className=\"text-gray-900\">{new Date(modalData.date).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>\n              </div>\n              \n              <div className=\"mb-4\">\n                <h4 className=\"text-md font-medium text-gray-700\">Status</h4>\n                <div \n                  className=\"inline-block px-3 py-1 rounded-full text-sm font-medium\"\n                  style={{ backgroundColor: `${getStatusColor(modalData.status)}20`, color: getStatusColor(modalData.status) }}\n                >\n                  {modalData.status.replace('_', ' ')}\n                </div>\n              </div>\n              \n              {modalData.clockIn && (\n                <>\n                  <div className=\"grid grid-cols-2 gap-4 mb-4\">\n                    <div>\n                      <h4 className=\"text-md font-medium text-gray-700\">Clock In</h4>\n                      <p className=\"text-gray-900\">{modalData.clockIn}</p>\n                    </div>\n                    <div>\n                      <h4 className=\"text-md font-medium text-gray-700\">Clock Out</h4>\n                      <p className=\"text-gray-900\">{modalData.clockOut}</p>\n                    </div>\n                  </div>\n                  \n                  <div className=\"mb-4\">\n                    <h4 className=\"text-md font-medium text-gray-700\">Device Information</h4>\n                    <p className=\"text-gray-900\">{modalData.device}</p>\n                  </div>\n                  \n                  <div className=\"mb-4\">\n                    <h4 className=\"text-md font-medium text-gray-700\">Verification</h4>\n                    <p className=\"text-gray-900\">\n                      {modalData.verified ? (\n                        <span className=\"flex items-center text-green-600\">\n                          <svg className=\"w-4 h-4 mr-1\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\">\n                            <path fillRule=\"evenodd\" d=\"M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z\" clipRule=\"evenodd\"></path>\n                          </svg>\n                          Facial Verification Successful\n                        </span>\n                      ) : (\n                        <span className=\"flex items-center text-red-600\">\n                          <svg className=\"w-4 h-4 mr-1\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\">\n                            <path fillRule=\"evenodd\" d=\"M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z\" clipRule=\"evenodd\"></path>\n                          </svg>\n                          Not Verified\n                        </span>\n                      )}\n                    </p>\n                  </div>\n                </>\n              )}\n              \n              <div className=\"mb-4\">\n                <h4 className=\"text-md font-medium text-gray-700\">Sync Status</h4>\n                <p className=\"text-gray-900\">\n                  {modalData.syncStatus === 'synced' ? (\n                    <span className=\"text-green-600\">\u2713 Synced</span>\n                  ) : modalData.syncStatus === 'pending' ? (\n                    <span className=\"text-orange-500\">\u21bb Pending Sync</span>\n                  ) : (\n                    <span className=\"text-orange-500\">\u26a0 Conflict Detected</span>\n                  )}\n                </p>\n              </div>\n            </div>\n            <div className=\"px-6 py-4 bg-gray-50 rounded-b-lg flex justify-end\">\n              <button\n                onClick={() => setShowModal(false)}\n                className=\"px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition duration-200\"\n              >\n                Close\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}"}, {"name": "LeaveRequest", "component": "LeaveRequest", "source": "function LeaveRequest() {\n  // Mock data\n  const [leaveTypes] = React.useState([\n    { id: 1, name: 'Annual Leave', code: 'AL', maxDays: 20, balance: 8 },\n    { id: 2, name: 'Sick Leave', code: 'SL', maxDays: 10, balance: 5 },\n    { id: 3, name: 'Maternity Leave', code: 'ML', maxDays: 180, balance: 180 },\n    { id: 4, name: 'Unpaid Leave', code: 'UL', maxDays: 365, balance: 365 }\n  ]);\n\n  const [selectedLeaveType, setSelectedLeaveType] = React.useState(leaveTypes[0]);\n  const [startDate, setStartDate] = React.useState('');\n  const [endDate, setEndDate] = React.useState('');\n  const [reason, setReason] = React.useState('');\n  const [blockedDates] = React.useState(['2023-06-15', '2023-07-20', '2023-08-05']);\n  const [isSubmitting, setIsSubmitting] = React.useState(false);\n\n  const handleLeaveTypeChange = (e) => {\n    const typeId = parseInt(e.target.value);\n    const type = leaveTypes.find(t => t.id === typeId);\n    setSelectedLeaveType(type);\n  };\n\n  const handleSubmit = () => {\n    setIsSubmitting(true);\n    // Simulate API call\n    setTimeout(() => {\n      alert(`Leave request submitted!\\nType: ${selectedLeaveType.name}\\nStart: ${startDate}\\nEnd: ${endDate}`);\n      setIsSubmitting(false);\n    }, 1500);\n  };\n\n  const isDateBlocked = (date) => {\n    return blockedDates.includes(date) || new Date(date) < new Date();\n  };\n\n  const ApprovalWorkflowVisualization = () => (\n    <div className=\"mt-6 p-4 bg-gray-50 rounded-lg\">\n      <h3 className=\"font-semibold text-gray-700 mb-3\">Approval Workflow</h3>\n      <div className=\"flex items-center justify-between\">\n        <div className=\"flex flex-col items-center\">\n          <div className=\"w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold\">1</div>\n          <p className=\"text-xs mt-1 text-gray-600\">Team Lead</p>\n        </div>\n        <div className=\"h-0.5 w-16 bg-gray-300\"></div>\n        <div className=\"flex flex-col items-center\">\n          <div className=\"w-8 h-8 rounded-full bg-gray-300 flex items-center justify-center text-gray-500 font-bold\">2</div>\n          <p className=\"text-xs mt-1 text-gray-600\">Manager</p>\n        </div>\n        <div className=\"h-0.5 w-16 bg-gray-300\"></div>\n        <div className=\"flex flex-col items-center\">\n          <div className=\"w-8 h-8 rounded-full bg-gray-300 flex items-center justify-center text-gray-500 font-bold\">3</div>\n          <p className=\"text-xs mt-1 text-gray-600\">HR</p>\n        </div>\n      </div>\n    </div>\n  );\n\n  return (\n    <div className=\"max-w-4xl mx-auto p-6\">\n      <div className=\"bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden\">\n        {/* Header */}\n        <div className=\"bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-5\">\n          <h1 className=\"text-2xl font-bold text-white\">Request Leave</h1>\n          <p className=\"text-blue-100 mt-1\">Submit your leave request for approval</p>\n        </div>\n\n        <div className=\"p-6\">\n          {/* Leave Type Selection */}\n          <div className=\"mb-6\">\n            <label className=\"block text-sm font-medium text-gray-700 mb-2\">Leave Type</label>\n            <div className=\"relative\">\n              <select\n                value={selectedLeaveType.id}\n                onChange={handleLeaveTypeChange}\n                className=\"w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none\"\n              >\n                {leaveTypes.map(type => (\n                  <option key={type.id} value={type.id}>\n                    {type.name}\n                  </option>\n                ))}\n              </select>\n              <div className=\"pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700\">\n                <svg className=\"fill-current h-4 w-4\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 20 20\">\n                  <path d=\"M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z\" />\n                </svg>\n              </div>\n            </div>\n          </div>\n\n          {/* Real-time Balance Display */}\n          <div className=\"mb-6 p-4 bg-blue-50 rounded-lg border border-blue-100\">\n            <div className=\"flex justify-between items-center\">\n              <div>\n                <h3 className=\"font-medium text-gray-800\">Current Balance</h3>\n                <p className=\"text-sm text-gray-600\">{selectedLeaveType.name}</p>\n              </div>\n              <div className=\"text-right\">\n                <p className=\"text-2xl font-bold text-blue-700\">{selectedLeaveType.balance} days</p>\n                <p className=\"text-sm text-gray-600\">of {selectedLeaveType.maxDays} allocated</p>\n              </div>\n            </div>\n            <div className=\"mt-3 w-full bg-gray-200 rounded-full h-2\">\n              <div \n                className=\"bg-blue-600 h-2 rounded-full\" \n                style={{ width: `${(selectedLeaveType.balance / selectedLeaveType.maxDays) * 100}%` }}\n              ></div>\n            </div>\n          </div>\n\n          {/* Date Selection */}\n          <div className=\"grid grid-cols-1 md:grid-cols-2 gap-6 mb-6\">\n            <div>\n              <label className=\"block text-sm font-medium text-gray-700 mb-2\">Start Date</label>\n              <input\n                type=\"date\"\n                value={startDate}\n                onChange={(e) => setStartDate(e.target.value)}\n                min={new Date().toISOString().split('T')[0]}\n                className={`w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 ${\n                  isDateBlocked(startDate) ? 'border-red-300 bg-red-50' : 'border-gray-300'\n                }`}\n              />\n              {isDateBlocked(startDate) && (\n                <p className=\"mt-1 text-sm text-red-600\">Selected date is unavailable</p>\n              )}\n            </div>\n            <div>\n              <label className=\"block text-sm font-medium text-gray-700 mb-2\">End Date</label>\n              <input\n                type=\"date\"\n                value={endDate}\n                onChange={(e) => setEndDate(e.target.value)}\n                min={startDate || new Date().toISOString().split('T')[0]}\n                className={`w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 ${\n                  isDateBlocked(endDate) ? 'border-red-300 bg-red-50' : 'border-gray-300'\n                }`}\n              />\n              {isDateBlocked(endDate) && (\n                <p className=\"mt-1 text-sm text-red-600\">Selected date is unavailable</p>\n              )}\n            </div>\n          </div>\n\n          {/* Reason */}\n          <div className=\"mb-6\">\n            <label className=\"block text-sm font-medium text-gray-700 mb-2\">Reason for Leave</label>\n            <textarea\n              value={reason}\n              onChange={(e) => setReason(e.target.value)}\n              rows={4}\n              className=\"w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500\"\n              placeholder=\"Please provide details about your leave request...\"\n            />\n          </div>\n\n          {/* Approval Workflow */}\n          <ApprovalWorkflowVisualization />\n\n          {/* Submit Button */}\n          <div className=\"mt-8\">\n            <button\n              onClick={handleSubmit}\n              disabled={isSubmitting || !startDate || !endDate || isDateBlocked(startDate) || isDateBlocked(endDate)}\n              className={`w-full py-3 px-4 rounded-lg font-medium text-white ${\n                isSubmitting \n                  ? 'bg-gray-400 cursor-not-allowed' \n                  : 'bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500'\n              } transition-colors duration-200`}\n            >\n              {isSubmitting ? 'Submitting Request...' : 'Submit Leave Request'}\n            </button>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "LeaveApprovals", "component": "LeaveApprovals", "source": "function LeaveApprovals() {\n  // Mock data\n  const pendingRequests = [\n    {\n      id: 1,\n      employee: { id: 101, name: \"Aarav Patel\", department: \"Engineering\" },\n      startDate: \"2023-06-15\",\n      endDate: \"2023-06-16\",\n      leaveType: \"Annual Leave\",\n      days: 2,\n      balanceImpact: -2,\n      reason: \"Personal travel\",\n      status: \"pending\"\n    },\n    {\n      id: 2,\n      employee: { id: 102, name: \"Priya Sharma\", department: \"Marketing\" },\n      startDate: \"2023-06-20\",\n      endDate: \"2023-06-22\",\n      leaveType: \"Sick Leave\",\n      days: 3,\n      balanceImpact: -3,\n      reason: \"Medical appointment\",\n      status: \"pending\"\n    },\n    {\n      id: 3,\n      employee: { id: 103, name: \"Rohan Gupta\", department: \"Sales\" },\n      startDate: \"2023-06-25\",\n      endDate: \"2023-06-25\",\n      leaveType: \"Half Day\",\n      days: 0.5,\n      balanceImpact: -0.5,\n      reason: \"Dental checkup\",\n      status: \"pending\"\n    }\n  ];\n\n  const teamCalendarEvents = [\n    { date: \"2023-06-15\", employee: \"Aarav Patel\", type: \"leave\" },\n    { date: \"2023-06-16\", employee: \"Aarav Patel\", type: \"leave\" },\n    { date: \"2023-06-20\", employee: \"Priya Sharma\", type: \"leave\" },\n    { date: \"2023-06-21\", employee: \"Priya Sharma\", type: \"leave\" },\n    { date: \"2023-06-22\", employee: \"Priya Sharma\", type: \"leave\" },\n    { date: \"2023-06-25\", employee: \"Rohan Gupta\", type: \"leave\" }\n  ];\n\n  const [selectedRequest, setSelectedRequest] = React.useState(null);\n  const [comment, setComment] = React.useState(\"\");\n  const [requests, setRequests] = React.useState(pendingRequests);\n  const [calendarView, setCalendarView] = React.useState(\"month\");\n  const [conflicts, setConflicts] = React.useState([\n    { id: 1, employee: \"Neha Verma\", date: \"2023-06-10\", type: \"attendance\", status: \"unresolved\" }\n  ]);\n\n  const handleApprove = () => {\n    if (!selectedRequest) return;\n    \n    // Update request status\n    const updatedRequests = requests.map(req => \n      req.id === selectedRequest.id ? {...req, status: \"approved\"} : req\n    );\n    setRequests(updatedRequests);\n    \n    // Add notification\n    alert(`Leave request for ${selectedRequest.employee.name} approved`);\n    setSelectedRequest(null);\n    setComment(\"\");\n  };\n\n  const handleReject = () => {\n    if (!selectedRequest) return;\n    \n    // Update request status\n    const updatedRequests = requests.map(req => \n      req.id === selectedRequest.id ? {...req, status: \"rejected\"} : req\n    );\n    setRequests(updatedRequests);\n    \n    // Add notification\n    alert(`Leave request for ${selectedRequest.employee.name} rejected`);\n    setSelectedRequest(null);\n    setComment(\"\");\n  };\n\n  const resolveConflict = (conflictId) => {\n    const updatedConflicts = conflicts.map(c => \n      c.id === conflictId ? {...c, status: \"resolved\"} : c\n    );\n    setConflicts(updatedConflicts);\n    alert(\"Conflict resolved successfully\");\n  };\n\n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Main Content */}\n      <div className=\"flex-1 flex flex-col overflow-hidden\">\n        {/* Header */}\n        <header className=\"bg-white shadow-sm z-10\">\n          <div className=\"flex items-center justify-between px-6 py-4\">\n            <h1 className=\"text-xl font-semibold text-gray-800\">Leave Approvals</h1>\n            <div className=\"flex items-center space-x-4\">\n              <button className=\"p-2 rounded-full hover:bg-gray-100\">\n                <svg className=\"w-5 h-5 text-gray-600\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                  <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9\" />\n                </svg>\n              </button>\n              <div className=\"flex items-center\">\n                <div className=\"mr-3 text-right\">\n                  <p className=\"text-sm font-medium text-gray-800\">Manager Name</p>\n                  <p className=\"text-xs text-gray-500\">HR Department</p>\n                </div>\n                <div className=\"w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-semibold\">\n                  MN\n                </div>\n              </div>\n            </div>\n          </div>\n        </header>\n\n        <div className=\"flex-1 flex overflow-hidden\">\n          {/* Pending Requests Section */}\n          <div className=\"flex-1 overflow-auto p-6\">\n            <div className=\"bg-white rounded-lg shadow mb-6\">\n              <div className=\"px-6 py-4 border-b border-gray-200\">\n                <h2 className=\"text-lg font-medium text-gray-800\">Pending Leave Requests</h2>\n              </div>\n              \n              {/* Pending Requests Table */}\n              <div className=\"overflow-x-auto\">\n                <table className=\"min-w-full divide-y divide-gray-200\">\n                  <thead className=\"bg-gray-50\">\n                    <tr>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Employee</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Dates</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Type</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Days</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Balance Impact</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Reason</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Actions</th>\n                    </tr>\n                  </thead>\n                  <tbody className=\"bg-white divide-y divide-gray-200\">\n                    {requests.filter(r => r.status === \"pending\").map((request) => (\n                      <tr \n                        key={request.id} \n                        className={`hover:bg-gray-50 cursor-pointer ${selectedRequest?.id === request.id ? 'bg-blue-50' : ''}`}\n                        onClick={() => setSelectedRequest(request)}\n                      >\n                        <td className=\"px-6 py-4 whitespace-nowrap\">\n                          <div className=\"flex items-center\">\n                            <div className=\"flex-shrink-0 h-10 w-10 bg-indigo-100 rounded-full flex items-center justify-center\">\n                              <span className=\"text-indigo-800 font-medium\">{request.employee.name.charAt(0)}</span>\n                            </div>\n                            <div className=\"ml-4\">\n                              <div className=\"text-sm font-medium text-gray-900\">{request.employee.name}</div>\n                              <div className=\"text-sm text-gray-500\">{request.employee.department}</div>\n                            </div>\n                          </div>\n                        </td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                          {request.startDate} to {request.endDate}\n                        </td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                          {request.leaveType}\n                        </td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                          {request.days}\n                        </td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                          <span className={request.balanceImpact < 0 ? \"text-red-600\" : \"text-green-600\"}>\n                            {request.balanceImpact}\n                          </span>\n                        </td>\n                        <td className=\"px-6 py-4 text-sm text-gray-500 max-w-xs truncate\">\n                          {request.reason}\n                        </td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium\">\n                          <button \n                            onClick={(e) => {\n                              e.stopPropagation();\n                              setSelectedRequest(request);\n                            }}\n                            className=\"text-indigo-600 hover:text-indigo-900 mr-3\"\n                          >\n                            Review\n                          </button>\n                        </td>\n                      </tr>\n                    ))}\n                  </tbody>\n                </table>\n              </div>\n            </div>\n\n            {/* Approval Section */}\n            {selectedRequest && (\n              <div className=\"bg-white rounded-lg shadow mb-6\">\n                <div className=\"px-6 py-4 border-b border-gray-200\">\n                  <h2 className=\"text-lg font-medium text-gray-800\">Approve Request</h2>\n                  <p className=\"text-sm text-gray-600 mt-1\">\n                    Reviewing request for {selectedRequest.employee.name}\n                  </p>\n                </div>\n                <div className=\"p-6\">\n                  <div className=\"grid grid-cols-1 md:grid-cols-2 gap-6 mb-6\">\n                    <div>\n                      <h3 className=\"text-sm font-medium text-gray-700 mb-2\">Leave Details</h3>\n                      <dl className=\"grid grid-cols-2 gap-2 text-sm\">\n                        <dt className=\"text-gray-500\">Type:</dt>\n                        <dd className=\"text-gray-900\">{selectedRequest.leaveType}</dd>\n                        \n                        <dt className=\"text-gray-500\">Dates:</dt>\n                        <dd className=\"text-gray-900\">{selectedRequest.startDate} to {selectedRequest.endDate}</dd>\n                        \n                        <dt className=\"text-gray-500\">Days:</dt>\n                        <dd className=\"text-gray-900\">{selectedRequest.days}</dd>\n                        \n                        <dt className=\"text-gray-500\">Reason:</dt>\n                        <dd className=\"text-gray-900\">{selectedRequest.reason}</dd>\n                      </dl>\n                    </div>\n                    \n                    <div>\n                      <h3 className=\"text-sm font-medium text-gray-700 mb-2\">Employee Info</h3>\n                      <dl className=\"grid grid-cols-2 gap-2 text-sm\">\n                        <dt className=\"text-gray-500\">Name:</dt>\n                        <dd className=\"text-gray-900\">{selectedRequest.employee.name}</dd>\n                        \n                        <dt className=\"text-gray-500\">Department:</dt>\n                        <dd className=\"text-gray-900\">{selectedRequest.employee.department}</dd>\n                        \n                        <dt className=\"text-gray-500\">Current Balance:</dt>\n                        <dd className=\"text-gray-900\">12 days</dd>\n                      </dl>\n                    </div>\n                  </div>\n                  \n                  <div className=\"mb-6\">\n                    <label htmlFor=\"comment\" className=\"block text-sm font-medium text-gray-700 mb-2\">\n                      Comments (Optional)\n                    </label>\n                    <textarea\n                      id=\"comment\"\n                      rows={3}\n                      className=\"shadow-sm focus:ring-blue-500 focus:border-blue-500 mt-1 block w-full sm:text-sm border border-gray-300 rounded-md p-3\"\n                      placeholder=\"Add any comments for the employee...\"\n                      value={comment}\n                      onChange={(e) => setComment(e.target.value)}\n                    ></textarea>\n                  </div>\n                  \n                  <div className=\"flex justify-end space-x-3\">\n                    <button\n                      type=\"button\"\n                      className=\"inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500\"\n                      onClick={() => {\n                        setSelectedRequest(null);\n                        setComment(\"\");\n                      }}\n                    >\n                      Cancel\n                    </button>\n                    <button\n                      type=\"button\"\n                      className=\"inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500\"\n                      onClick={handleReject}\n                    >\n                      Reject\n                    </button>\n                    <button\n                      type=\"button\"\n                      className=\"inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500\"\n                      onClick={handleApprove}\n                    >\n                      Approve\n                    </button>\n                  </div>\n                </div>\n              </div>\n            )}\n\n            {/* Conflict Resolution */}\n            <div className=\"bg-white rounded-lg shadow\">\n              <div className=\"px-6 py-4 border-b border-gray-200\">\n                <h2 className=\"text-lg font-medium text-gray-800\">Conflict Resolution</h2>\n                <p className=\"text-sm text-gray-600 mt-1\">Resolve attendance discrepancies</p>\n              </div>\n              <div className=\"p-6\">\n                <div className=\"overflow-x-auto\">\n                  <table className=\"min-w-full divide-y divide-gray-200\">\n                    <thead className=\"bg-gray-50\">\n                      <tr>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Employee</th>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Date</th>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Type</th>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Status</th>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Actions</th>\n                      </tr>\n                    </thead>\n                    <tbody className=\"bg-white divide-y divide-gray-200\">\n                      {conflicts.map((conflict) => (\n                        <tr key={conflict.id}>\n                          <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">\n                            {conflict.employee}\n                          </td>\n                          <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                            {conflict.date}\n                          </td>\n                          <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                            {conflict.type}\n                          </td>\n                          <td className=\"px-6 py-4 whitespace-nowrap\">\n                            <span className={`px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${\n                              conflict.status === \"resolved\" \n                                ? \"bg-green-100 text-green-800\" \n                                : \"bg-yellow-100 text-yellow-800\"\n                            }`}>\n                              {conflict.status}\n                            </span>\n                          </td>\n                          <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium\">\n                            {conflict.status === \"unresolved\" ? (\n                              <button\n                                onClick={() => resolveConflict(conflict.id)}\n                                className=\"text-blue-600 hover:text-blue-900\"\n                              >\n                                Resolve\n                              </button>\n                            ) : (\n                              <span className=\"text-gray-500\">Resolved</span>\n                            )}\n                          </td>\n                        </tr>\n                      ))}\n                    </tbody>\n                  </table>\n                </div>\n              </div>\n            </div>\n          </div>\n\n          {/* Team Calendar Sidebar */}\n          <div className=\"w-96 bg-white border-l border-gray-200 flex flex-col\">\n            <div className=\"p-4 border-b border-gray-200\">\n              <h2 className=\"text-lg font-medium text-gray-800\">Team Calendar</h2>\n              <div className=\"mt-2 flex space-x-2\">\n                <button \n                  className={`px-3 py-1 text-sm rounded-md ${\n                    calendarView === \"month\" \n                      ? \"bg-blue-500 text-white\" \n                      : \"bg-gray-200 text-gray-700 hover:bg-gray-300\"\n                  }`}\n                  onClick={() => setCalendarView(\"month\")}\n                >\n                  Month\n                </button>\n                <button \n                  className={`px-3 py-1 text-sm rounded-md ${\n                    calendarView === \"week\" \n                      ? \"bg-blue-500 text-white\" \n                      : \"bg-gray-200 text-gray-700 hover:bg-gray-300\"\n                  }`}\n                  onClick={() => setCalendarView(\"week\")}\n                >\n                  Week\n                </button>\n              </div>\n            </div>\n            \n            <div className=\"flex-1 overflow-auto p-4\">\n              <div className=\"bg-gray-50 rounded-lg p-4 mb-4\">\n                <div className=\"flex justify-between items-center mb-3\">\n                  <h3 className=\"font-medium text-gray-800\">June 2023</h3>\n                  <div className=\"flex space-x-1\">\n                    <button className=\"p-1 rounded hover:bg-gray-200\">\n                      <svg className=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                        <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M15 19l-7-7 7-7\" />\n                      </svg>\n                    </button>\n                    <button className=\"p-1 rounded hover:bg-gray-200\">\n                      <svg className=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\n                        <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M9 5l7 7-7 7\" />\n                      </svg>\n                    </button>\n                  </div>\n                </div>\n                \n                <div className=\"grid grid-cols-7 gap-1 mb-2\">\n                  {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((day, index) => (\n                    <div key={index} className=\"text-center text-xs font-medium text-gray-500 py-1\">\n                      {day}\n                    </div>\n                  ))}\n                </div>\n                \n                <div className=\"grid grid-cols-7 gap-1\">\n                  {Array.from({ length: 30 }, (_, i) => i + 1).map((day) => {\n                    const dateStr = `2023-06-${day < 10 ? '0' + day : day}`;\n                    const events = teamCalendarEvents.filter(e => e.date === dateStr);\n                    \n                    return (\n                      <div \n                        key={day} \n                        className={`h-10 rounded flex flex-col items-center justify-center text-xs relative ${\n                          day === 15 || day === 16 || day === 20 || day === 21 || day === 22 || day === 25\n                            ? \"bg-blue-100 border border-blue-300\"\n                            : \"hover:bg-gray-100\"\n                        }`}\n                      >\n                        <span className={day === 15 || day === 16 || day === 20 || day === 21 || day === 22 || day === 25 ? \"font-bold text-blue-800\" : \"\"}>\n                          {day}\n                        </span>\n                        {events.length > 0 && (\n                          <div className=\"absolute bottom-0.5 flex space-x-0.5\">\n                            {events.slice(0, 3).map((event, idx) => (\n                              <div \n                                key={idx} \n                                className=\"w-1.5 h-1.5 rounded-full bg-blue-500\"\n                                title={event.employee}\n                              ></div>\n                            ))}\n                            {events.length > 3 && (\n                              <div className=\"text-xs text-gray-500\">+{events.length - 3}</div>\n                            )}\n                          </div>\n                        )}\n                      </div>\n                    );\n                  })}\n                </div>\n              </div>\n              \n              <div className=\"bg-gray-50 rounded-lg p-4\">\n                <h3 className=\"font-medium text-gray-800 mb-3\">Legend</h3>\n                <div className=\"space-y-2\">\n                  <div className=\"flex items-center\">\n                    <div className=\"w-3 h-3 bg-blue-500 rounded-full mr-2\"></div>\n                    <span className=\"text-sm text-gray-600\">Leave</span>\n                  </div>\n                  <div className=\"flex items-center\">\n                    <div className=\"w-3 h-3 bg-green-500 rounded-full mr-2\"></div>\n                    <span className=\"text-sm text-gray-600\">Approved</span>\n                  </div>\n                  <div className=\"flex items-center\">\n                    <div className=\"w-3 h-3 bg-yellow-500 rounded-full mr-2\"></div>\n                    <span className=\"text-sm text-gray-600\">Pending</span>\n                  </div>\n                </div>\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "ShiftRoster", "component": "ShiftRoster", "source": "const ShiftRoster = () => {\n  // Mock data\n  const [selectedDate, setSelectedDate] = React.useState(new Date(2023, 5, 15));\n  const [timezone, setTimezone] = React.useState('UTC');\n  const [draggedShift, setDraggedShift] = React.useState(null);\n  const [assignments, setAssignments] = React.useState([\n    { id: 1, employeeId: 101, shiftId: 1, date: '2023-06-15' },\n    { id: 2, employeeId: 102, shiftId: 2, date: '2023-06-15' },\n    { id: 3, employeeId: 103, shiftId: 3, date: '2023-06-15' },\n  ]);\n  \n  const shifts = [\n    { id: 1, name: 'Morning Shift', startTime: '08:00', endTime: '16:00', isOvernight: false },\n    { id: 2, name: 'Evening Shift', startTime: '16:00', endTime: '00:00', isOvernight: true },\n    { id: 3, name: 'Night Shift', startTime: '00:00', endTime: '08:00', isOvernight: true },\n  ];\n  \n  const employees = [\n    { id: 101, name: 'Alex Johnson', department: 'Engineering' },\n    { id: 102, name: 'Maria Garcia', department: 'Marketing' },\n    { id: 103, name: 'James Wilson', department: 'Sales' },\n  ];\n\n  const timezones = [\n    'UTC',\n    'America/New_York',\n    'Europe/London',\n    'Asia/Tokyo',\n    'Australia/Sydney'\n  ];\n\n  const handleDragStart = (shift) => {\n    setDraggedShift(shift);\n  };\n\n  const handleDrop = (employeeId, date) => {\n    if (draggedShift) {\n      const newAssignment = {\n        id: assignments.length + 1,\n        employeeId,\n        shiftId: draggedShift.id,\n        date: date.toISOString().split('T')[0]\n      };\n      setAssignments([...assignments, newAssignment]);\n      setDraggedShift(null);\n    }\n  };\n\n  const handleExportCSV = () => {\n    alert('Exporting shift roster to CSV...');\n  };\n\n  const handleImportCSV = () => {\n    alert('Importing shift roster from CSV...');\n  };\n\n  // Calendar navigation\n  const navigateMonth = (direction) => {\n    const newDate = new Date(selectedDate);\n    newDate.setMonth(newDate.getMonth() + direction);\n    setSelectedDate(newDate);\n  };\n\n  // Generate calendar days\n  const generateCalendarDays = () => {\n    const year = selectedDate.getFullYear();\n    const month = selectedDate.getMonth();\n    const firstDay = new Date(year, month, 1);\n    const lastDay = new Date(year, month + 1, 0);\n    const startDay = firstDay.getDay();\n    const daysInMonth = lastDay.getDate();\n    \n    const days = [];\n    \n    // Previous month's days\n    const prevMonthLastDay = new Date(year, month, 0).getDate();\n    for (let i = startDay - 1; i >= 0; i--) {\n      days.push({\n        date: new Date(year, month - 1, prevMonthLastDay - i),\n        isCurrentMonth: false\n      });\n    }\n    \n    // Current month's days\n    for (let i = 1; i <= daysInMonth; i++) {\n      days.push({\n        date: new Date(year, month, i),\n        isCurrentMonth: true\n      });\n    }\n    \n    // Next month's days\n    const totalCells = 42; // 6 weeks\n    const remaining = totalCells - days.length;\n    for (let i = 1; i <= remaining; i++) {\n      days.push({\n        date: new Date(year, month + 1, i),\n        isCurrentMonth: false\n      });\n    }\n    \n    return days;\n  };\n\n  const calendarDays = generateCalendarDays();\n  const monthNames = [\"January\", \"February\", \"March\", \"April\", \"May\", \"June\",\n    \"July\", \"August\", \"September\", \"October\", \"November\", \"December\"];\n\n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Sidebar */}\n      <div className=\"w-64 bg-white shadow-md p-6 flex flex-col\">\n        <h2 className=\"text-xl font-bold text-gray-800 mb-6\">Shift Management</h2>\n        \n        <div className=\"mb-8\">\n          <h3 className=\"font-semibold text-gray-700 mb-3\">Timezone</h3>\n          <select \n            className=\"w-full p-2 border rounded-md\"\n            value={timezone}\n            onChange={(e) => setTimezone(e.target.value)}\n          >\n            {timezones.map(tz => (\n              <option key={tz} value={tz}>{tz}</option>\n            ))}\n          </select>\n        </div>\n        \n        <div className=\"mb-8\">\n          <h3 className=\"font-semibold text-gray-700 mb-3\">Available Shifts</h3>\n          <div className=\"space-y-2\">\n            {shifts.map(shift => (\n              <div \n                key={shift.id}\n                draggable\n                onDragStart={() => handleDragStart(shift)}\n                className={`p-3 rounded-lg cursor-move border ${\n                  shift.isOvernight ? 'bg-purple-100 border-purple-300' : 'bg-blue-100 border-blue-300'\n                }`}\n              >\n                <div className=\"font-medium\">{shift.name}</div>\n                <div className=\"text-sm text-gray-600\">\n                  {shift.startTime} - {shift.endTime}\n                  {shift.isOvernight && (\n                    <span className=\"ml-2 px-2 py-1 bg-purple-500 text-white text-xs rounded-full\">\n                      Overnight\n                    </span>\n                  )}\n                </div>\n              </div>\n            ))}\n          </div>\n        </div>\n        \n        <div className=\"mt-auto space-y-3\">\n          <button \n            onClick={handleExportCSV}\n            className=\"w-full py-2 px-4 bg-green-600 text-white rounded-md hover:bg-green-700 transition\"\n          >\n            Export CSV\n          </button>\n          <button \n            onClick={handleImportCSV}\n            className=\"w-full py-2 px-4 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition\"\n          >\n            Import CSV\n          </button>\n        </div>\n      </div>\n\n      {/* Main Content */}\n      <div className=\"flex-1 p-6 overflow-auto\">\n        <div className=\"mb-6\">\n          <h1 className=\"text-2xl font-bold text-gray-800\">Shift Roster</h1>\n          <p className=\"text-gray-600\">Manage employee shift assignments</p>\n        </div>\n        \n        {/* Calendar Header */}\n        <div className=\"bg-white rounded-lg shadow p-4 mb-6 flex items-center justify-between\">\n          <button \n            onClick={() => navigateMonth(-1)}\n            className=\"p-2 rounded-full hover:bg-gray-100\"\n          >\n            &larr;\n          </button>\n          <h2 className=\"text-xl font-semibold\">\n            {monthNames[selectedDate.getMonth()]} {selectedDate.getFullYear()}\n          </h2>\n          <button \n            onClick={() => navigateMonth(1)}\n            className=\"p-2 rounded-full hover:bg-gray-100\"\n          >\n            &rarr;\n          </button>\n        </div>\n        \n        {/* Calendar Grid */}\n        <div className=\"bg-white rounded-lg shadow overflow-hidden\">\n          {/* Weekday Headers */}\n          <div className=\"grid grid-cols-8 border-b\">\n            <div className=\"p-3\"></div>\n            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (\n              <div key={day} className=\"p-3 text-center font-medium text-gray-700\">\n                {day}\n              </div>\n            ))}\n          </div>\n          \n          {/* Employee Rows */}\n          <div className=\"divide-y\">\n            {employees.map(employee => (\n              <div key={employee.id} className=\"grid grid-cols-8\">\n                <div className=\"p-3 font-medium flex items-center\">\n                  <div>\n                    <div>{employee.name}</div>\n                    <div className=\"text-sm text-gray-500\">{employee.department}</div>\n                  </div>\n                </div>\n                \n                {calendarDays.map((day, index) => {\n                  const assignment = assignments.find(\n                    a => a.employeeId === employee.id && \n                         a.date === day.date.toISOString().split('T')[0]\n                  );\n                  \n                  const shift = assignment ? shifts.find(s => s.id === assignment.shiftId) : null;\n                  \n                  return (\n                    <div \n                      key={index}\n                      onDragOver={(e) => e.preventDefault()}\n                      onDrop={() => handleDrop(employee.id, day.date)}\n                      className={`p-2 min-h-[80px] border-l ${\n                        day.isCurrentMonth \n                          ? 'bg-white' \n                          : 'bg-gray-50 text-gray-400'\n                      } ${assignment ? 'cursor-pointer' : ''}`}\n                    >\n                      <div className=\"text-xs mb-1\">\n                        {day.date.getDate()}\n                      </div>\n                      \n                      {shift && (\n                        <div \n                          className={`p-2 rounded text-xs ${\n                            shift.isOvernight \n                              ? 'bg-purple-500 text-white' \n                              : 'bg-blue-500 text-white'\n                          }`}\n                        >\n                          <div className=\"font-medium truncate\">{shift.name}</div>\n                          <div>{shift.startTime}-{shift.endTime}</div>\n                        </div>\n                      )}\n                    </div>\n                  );\n                })}\n              </div>\n            ))}\n          </div>\n        </div>\n        \n        {/* Legend */}\n        <div className=\"mt-6 flex items-center space-x-6 text-sm\">\n          <div className=\"flex items-center\">\n            <div className=\"w-4 h-4 bg-blue-500 rounded mr-2\"></div>\n            <span>Regular Shift</span>\n          </div>\n          <div className=\"flex items-center\">\n            <div className=\"w-4 h-4 bg-purple-500 rounded mr-2\"></div>\n            <span>Overnight Shift</span>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n};"}, {"name": "PolicyManagement", "component": "PolicyManagement", "source": "const PolicyManagement = () => {\n  // Mock data\n  const [policies, setPolicies] = React.useState([\n    { id: 1, version: '1.0', name: 'Standard Office Policy', effectiveFrom: '2023-01-01', effectiveTo: '2023-12-31', isActive: true },\n    { id: 2, version: '1.1', name: 'Updated Remote Policy', effectiveFrom: '2024-01-01', effectiveTo: null, isActive: true },\n    { id: 3, version: '2.0', name: 'Global Policy Update', effectiveFrom: '2024-06-01', effectiveTo: null, isActive: false }\n  ]);\n\n  const [selectedPolicy, setSelectedPolicy] = React.useState(policies[1]);\n  \n  const [policyForm, setPolicyForm] = React.useState({\n    gracePeriodMinutes: 15,\n    overtimeThresholdHours: 8,\n    halfDayThresholdHours: 4,\n    leaveAccrualRate: 1.5\n  });\n\n  const [holidays, setHolidays] = React.useState([\n    { id: 1, name: 'New Year\\'s Day', date: '2024-01-01', location: 'All Offices', recurring: true },\n    { id: 2, name: 'Independence Day', date: '2024-07-04', location: 'US Offices', recurring: true },\n    { id: 3, name: 'Christmas Day', date: '2024-12-25', location: 'All Offices', recurring: true }\n  ]);\n\n  const [recurringPatterns, setRecurringPatterns] = React.useState([\n    { id: 1, pattern: 'First Monday of Month', description: 'Monthly team meetings' },\n    { id: 2, pattern: 'Last Friday of Month', description: 'Month-end cleanup' }\n  ]);\n\n  const [historyEvents] = React.useState([\n    { id: 1, date: '2024-05-15', user: 'HR Admin', action: 'Updated overtime threshold to 8 hours' },\n    { id: 2, date: '2024-03-22', user: 'System', action: 'Auto-applied grace period change' },\n    { id: 3, date: '2024-01-01', user: 'HR Director', action: 'Activated new remote work policy' }\n  ]);\n\n  // Handlers\n  const handlePolicySelect = (policy) => {\n    setSelectedPolicy(policy);\n    // In a real app, we would fetch policy details here\n  };\n\n  const handleFormChange = (field, value) => {\n    setPolicyForm(prev => ({ ...prev, [field]: value }));\n  };\n\n  const handleSavePolicy = () => {\n    alert(`Policy ${selectedPolicy.version} updated successfully!`);\n  };\n\n  const handleRecalculate = () => {\n    alert('Recalculating attendance records for past periods...');\n  };\n\n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Main Content */}\n      <div className=\"flex-1 p-6 overflow-auto\">\n        <div className=\"mb-6\">\n          <h1 className=\"text-2xl font-bold text-gray-800\">Attendance Policy Management</h1>\n          <p className=\"text-gray-600\">Configure company-wide attendance policies and location-specific settings</p>\n        </div>\n\n        <div className=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n          {/* Left Column - Policy Versions and Form */}\n          <div className=\"lg:col-span-2 space-y-6\">\n            {/* Policy Version List */}\n            <div className=\"bg-white rounded-lg shadow p-6\">\n              <div className=\"flex justify-between items-center mb-4\">\n                <h2 className=\"text-lg font-semibold text-gray-800\">Policy Versions</h2>\n                <button className=\"px-3 py-1 bg-blue-500 text-white rounded-md text-sm hover:bg-blue-600 transition\">\n                  Create New Version\n                </button>\n              </div>\n              <div className=\"space-y-3\">\n                {policies.map(policy => (\n                  <div \n                    key={policy.id}\n                    className={`p-4 border rounded-lg cursor-pointer transition ${\n                      selectedPolicy.id === policy.id \n                        ? 'border-blue-500 bg-blue-50' \n                        : 'border-gray-200 hover:border-gray-300'\n                    }`}\n                    onClick={() => handlePolicySelect(policy)}\n                  >\n                    <div className=\"flex justify-between\">\n                      <h3 className=\"font-medium\">{policy.name}</h3>\n                      <span className={`px-2 py-1 rounded text-xs ${\n                        policy.isActive \n                          ? 'bg-green-100 text-green-800' \n                          : 'bg-gray-100 text-gray-800'\n                      }`}>\n                        {policy.isActive ? 'Active' : 'Inactive'}\n                      </span>\n                    </div>\n                    <div className=\"text-sm text-gray-600 mt-1\">\n                      Version {policy.version} \u2022 Effective: {policy.effectiveFrom} \n                      {policy.effectiveTo && ` to ${policy.effectiveTo}`}\n                    </div>\n                  </div>\n                ))}\n              </div>\n            </div>\n\n            {/* Policy Form */}\n            <div className=\"bg-white rounded-lg shadow p-6\">\n              <h2 className=\"text-lg font-semibold text-gray-800 mb-4\">Policy Configuration</h2>\n              <div className=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">\n                    Grace Period (minutes)\n                  </label>\n                  <input\n                    type=\"number\"\n                    value={policyForm.gracePeriodMinutes}\n                    onChange={(e) => handleFormChange('gracePeriodMinutes', parseInt(e.target.value))}\n                    className=\"w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500\"\n                  />\n                </div>\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">\n                    Overtime Threshold (hours)\n                  </label>\n                  <input\n                    type=\"number\"\n                    value={policyForm.overtimeThresholdHours}\n                    onChange={(e) => handleFormChange('overtimeThresholdHours', parseFloat(e.target.value))}\n                    className=\"w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500\"\n                  />\n                </div>\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">\n                    Half-Day Threshold (hours)\n                  </label>\n                  <input\n                    type=\"number\"\n                    value={policyForm.halfDayThresholdHours}\n                    onChange={(e) => handleFormChange('halfDayThresholdHours', parseFloat(e.target.value))}\n                    className=\"w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500\"\n                  />\n                </div>\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">\n                    Leave Accrual Rate (days/month)\n                  </label>\n                  <input\n                    type=\"number\"\n                    step=\"0.1\"\n                    value={policyForm.leaveAccrualRate}\n                    onChange={(e) => handleFormChange('leaveAccrualRate', parseFloat(e.target.value))}\n                    className=\"w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500\"\n                  />\n                </div>\n              </div>\n              <div className=\"mt-6 flex justify-end\">\n                <button\n                  onClick={handleSavePolicy}\n                  className=\"px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition\"\n                >\n                  Save Policy Changes\n                </button>\n              </div>\n            </div>\n          </div>\n\n          {/* Right Column - Holidays, Recurring Patterns, History */}\n          <div className=\"space-y-6\">\n            {/* Location-Specific Holiday Calendar */}\n            <div className=\"bg-white rounded-lg shadow p-6\">\n              <h2 className=\"text-lg font-semibold text-gray-800 mb-4\">Holiday Calendar</h2>\n              <div className=\"space-y-3\">\n                {holidays.map(holiday => (\n                  <div key={holiday.id} className=\"p-3 border border-gray-200 rounded-md\">\n                    <div className=\"flex justify-between\">\n                      <span className=\"font-medium\">{holiday.name}</span>\n                      <span className={`px-2 py-1 rounded text-xs ${\n                        holiday.recurring \n                          ? 'bg-purple-100 text-purple-800' \n                          : 'bg-gray-100 text-gray-800'\n                      }`}>\n                        {holiday.recurring ? 'Recurring' : 'One-time'}\n                      </span>\n                    </div>\n                    <div className=\"text-sm text-gray-600 mt-1\">\n                      {holiday.date} \u2022 {holiday.location}\n                    </div>\n                  </div>\n                ))}\n              </div>\n              <button className=\"mt-4 w-full py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition\">\n                + Add Holiday\n              </button>\n            </div>\n\n            {/* Recurring Pattern Setup */}\n            <div className=\"bg-white rounded-lg shadow p-6\">\n              <h2 className=\"text-lg font-semibold text-gray-800 mb-4\">Recurring Patterns</h2>\n              <div className=\"space-y-3\">\n                {recurringPatterns.map(pattern => (\n                  <div key={pattern.id} className=\"p-3 border border-gray-200 rounded-md\">\n                    <div className=\"font-medium\">{pattern.pattern}</div>\n                    <div className=\"text-sm text-gray-600\">{pattern.description}</div>\n                  </div>\n                ))}\n              </div>\n              <button className=\"mt-4 w-full py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition\">\n                + Add Recurring Pattern\n              </button>\n            </div>\n\n            {/* Policy History Timeline */}\n            <div className=\"bg-white rounded-lg shadow p-6\">\n              <h2 className=\"text-lg font-semibold text-gray-800 mb-4\">Policy History</h2>\n              <div className=\"space-y-4\">\n                {historyEvents.map(event => (\n                  <div key={event.id} className=\"relative pl-6 pb-4 border-l-2 border-blue-200\">\n                    <div className=\"absolute -left-2 top-0 w-4 h-4 rounded-full bg-blue-500\"></div>\n                    <div className=\"text-sm font-medium\">{event.action}</div>\n                    <div className=\"text-xs text-gray-500 mt-1\">\n                      {event.date} by {event.user}\n                    </div>\n                  </div>\n                ))}\n              </div>\n            </div>\n\n            {/* Recalculation Button */}\n            <div className=\"bg-white rounded-lg shadow p-6\">\n              <h2 className=\"text-lg font-semibold text-gray-800 mb-4\">Policy Recalculation</h2>\n              <p className=\"text-gray-600 text-sm mb-4\">\n                Apply policy changes to historical attendance records\n              </p>\n              <button\n                onClick={handleRecalculate}\n                className=\"w-full py-2 bg-orange-500 text-white rounded-md hover:bg-orange-600 transition\"\n              >\n                Recalculate Past Periods\n              </button>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n};"}, {"name": "PayrollExport", "component": "PayrollExport", "source": "const PayrollExport = () => {\n  // Mock data\n  const [selectedMonth, setSelectedMonth] = React.useState('2023-10');\n  const [isLocked, setIsLocked] = React.useState(false);\n  const [apiKey, setApiKey] = React.useState('sk_live_51J4X2KL0A2...');\n  const [policyVersion, setPolicyVersion] = React.useState('v2.3');\n  \n  const mockPayrollData = [\n    { employee_id: 'EMP00123', days_present: 22, late_count: 1, overtime_hours: 8.5, leave_days: 3 },\n    { employee_id: 'EMP00234', days_present: 20, late_count: 3, overtime_hours: 12.0, leave_days: 5 },\n    { employee_id: 'EMP00345', days_present: 23, late_count: 0, overtime_hours: 4.2, leave_days: 2 },\n    { employee_id: 'EMP00456', days_present: 18, late_count: 5, overtime_hours: 6.8, leave_days: 7 },\n    { employee_id: 'EMP00567', days_present: 21, late_count: 2, overtime_hours: 9.3, leave_days: 4 },\n  ];\n  \n  const handleLockToggle = () => {\n    setIsLocked(!isLocked);\n  };\n  \n  const handleGenerateCSV = () => {\n    alert('CSV generated successfully!');\n  };\n  \n  const handleDownload = () => {\n    alert('Payroll data downloaded as CSV');\n  };\n  \n  const handleRegenerateKey = () => {\n    setApiKey('sk_live_' + Math.random().toString(36).substr(2, 15) + '...');\n  };\n  \n  const monthOptions = [\n    '2023-09', '2023-10', '2023-11', '2023-12'\n  ];\n  \n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Sidebar */}\n      <div className=\"w-64 bg-white shadow-md p-6 flex flex-col\">\n        <h1 className=\"text-xl font-bold text-gray-800 mb-8\">WorkPulse</h1>\n        <nav className=\"flex-1\">\n          <a href=\"/dashboard\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Dashboard</a>\n          <a href=\"/attendance/clock\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Clock In/Out</a>\n          <a href=\"/attendance/history\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Attendance History</a>\n          <a href=\"/leave/request\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Leave Request</a>\n          <a href=\"/leave/approvals\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Leave Approvals</a>\n          <a href=\"/shifts/roster\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Shift Roster</a>\n          <a href=\"/admin/policies\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Policy Management</a>\n          <a href=\"/payroll/export\" className=\"block py-2 text-blue-600 font-medium\">Payroll Export</a>\n          <a href=\"/admin/audit\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Audit Trail</a>\n          <a href=\"/profile/facial\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Facial Enrollment</a>\n          <a href=\"/offline/sync\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Offline Sync</a>\n          <a href=\"/employees\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Employee Directory</a>\n          <a href=\"/notifications\" className=\"block py-2 text-gray-600 hover:text-blue-600\">Notifications</a>\n
