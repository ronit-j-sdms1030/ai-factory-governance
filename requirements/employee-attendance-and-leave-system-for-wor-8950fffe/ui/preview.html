tem}>\n                <a \n                  href=\"#\" \n                  className={`block py-3 px-4 rounded-lg transition ${\n                    item === 'Policies' ? 'bg-indigo-700 font-medium' : 'hover:bg-indigo-700'\n                  }`}\n                >\n                  {item}\n                </a>\n              </li>\n            ))}\n          </ul>\n        </nav>\n        <div className=\"pt-4 border-t border-indigo-700\">\n          <button className=\"w-full py-2 px-4 bg-red-600 hover:bg-red-700 rounded-lg transition text-left\">\n            Sign Out\n          </button>\n        </div>\n      </div>\n\n      {/* Main Content */}\n      <div className=\"flex-1 flex flex-col overflow-hidden\">\n        {/* Header */}\n        <header className=\"bg-white shadow-sm p-4\">\n          <div className=\"flex justify-between items-center\">\n            <h2 className=\"text-xl font-semibold text-gray-800\">Policy Management</h2>\n            <div className=\"flex items-center space-x-4\">\n              <button className=\"bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg transition\">\n                Create New Policy\n              </button>\n              <div className=\"w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center\">\n                <span className=\"font-medium text-gray-700\">AS</span>\n              </div>\n            </div>\n          </div>\n        </header>\n\n        {/* Tabs */}\n        <div className=\"border-b border-gray-200 bg-white\">\n          <div className=\"flex px-6\">\n            {['policies', 'holidays', 'history', 'comparison'].map((tab) => (\n              <button\n                key={tab}\n                className={`py-4 px-6 font-medium text-sm ${\n                  activeTab === tab\n                    ? 'text-indigo-600 border-b-2 border-indigo-600'\n                    : 'text-gray-500 hover:text-gray-700'\n                }`}\n                onClick={() => setActiveTab(tab)}\n              >\n                {tab.charAt(0).toUpperCase() + tab.slice(1)}\n              </button>\n            ))}\n          </div>\n        </div>\n\n        {/* Tab Content */}\n        <div className=\"flex-1 overflow-auto p-6\">\n          {/* Policies Tab */}\n          {activeTab === 'policies' && (\n            <div className=\"space-y-6\">\n              <div className=\"bg-white rounded-xl shadow-sm p-6\">\n                <h3 className=\"text-lg font-medium text-gray-900 mb-4\">Active Policies</h3>\n                <div className=\"overflow-x-auto\">\n                  <table className=\"min-w-full divide-y divide-gray-200\">\n                    <thead className=\"bg-gray-50\">\n                      <tr>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Policy Name</th>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Version</th>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Effective From</th>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Location</th>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Actions</th>\n                      </tr>\n                    </thead>\n                    <tbody className=\"bg-white divide-y divide-gray-200\">\n                      {policies.map((policy) => (\n                        <tr key={policy.id} className=\"hover:bg-gray-50\">\n                          <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">{policy.name}</td>\n                          <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{policy.version}</td>\n                          <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{policy.effectiveFrom}</td>\n                          <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{policy.location}</td>\n                          <td className=\"px-6 py-4 whitespace-nowrap text-sm\">\n                            <button \n                              className=\"text-indigo-600 hover:text-indigo-900 mr-3\"\n                              onClick={() => setSelectedPolicy(policy)}\n                            >\n                              Edit\n                            </button>\n                            <button className=\"text-indigo-600 hover:text-indigo-900\">\n                              Clone\n                            </button>\n                          </td>\n                        </tr>\n                      ))}\n                    </tbody>\n                  </table>\n                </div>\n              </div>\n\n              <div className=\"grid grid-cols-1 lg:grid-cols-2 gap-6\">\n                <div className=\"bg-white rounded-xl shadow-sm p-6\">\n                  <h3 className=\"text-lg font-medium text-gray-900 mb-4\">Policy Configuration</h3>\n                  <div className=\"space-y-4\">\n                    <div>\n                      <label className=\"block text-sm font-medium text-gray-700 mb-1\">Grace Period (minutes)</label>\n                      <input \n                        type=\"number\" \n                        className=\"w-full rounded-lg border-gray-300 border py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent\"\n                        defaultValue=\"15\"\n                      />\n                    </div>\n                    <div>\n                      <label className=\"block text-sm font-medium text-gray-700 mb-1\">Overtime Threshold (hours)</label>\n                      <input \n                        type=\"number\" \n                        className=\"w-full rounded-lg border-gray-300 border py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent\"\n                        defaultValue=\"8\"\n                      />\n                    </div>\n                    <div>\n                      <label className=\"block text-sm font-medium text-gray-700 mb-1\">Half-Day Threshold (hours)</label>\n                      <input \n                        type=\"number\" \n                        className=\"w-full rounded-lg border-gray-300 border py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent\"\n                        defaultValue=\"4\"\n                      />\n                    </div>\n                    <div>\n                      <label className=\"block text-sm font-medium text-gray-700 mb-1\">Leave Accrual Method</label>\n                      <select className=\"w-full rounded-lg border-gray-300 border py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent\">\n                        <option>Monthly</option>\n                        <option>Quarterly</option>\n                        <option>Annually</option>\n                        <option>None</option>\n                      </select>\n                    </div>\n                  </div>\n                </div>\n\n                <div className=\"bg-white rounded-xl shadow-sm p-6\">\n                  <h3 className=\"text-lg font-medium text-gray-900 mb-4\">Bulk Location Assignment</h3>\n                  <div className=\"space-y-4\">\n                    <div>\n                      <label className=\"block text-sm font-medium text-gray-700 mb-1\">Select Locations</label>\n                      <div className=\"border border-gray-300 rounded-lg p-3 max-h-40 overflow-y-auto\">\n                        {locations.map(location => (\n                          <div key={location.id} className=\"flex items-center mb-2\">\n                            <input \n                              type=\"checkbox\" \n                              id={`loc-${location.id}`} \n                              className=\"h-4 w-4 text-indigo-600 rounded focus:ring-indigo-500\"\n                            />\n                            <label htmlFor={`loc-${location.id}`} className=\"ml-2 text-sm text-gray-700\">\n                              {location.name}\n                            </label>\n                          </div>\n                        ))}\n                      </div>\n                    </div>\n                    <button className=\"w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg transition\">\n                      Apply Policy to Selected Locations\n                    </button>\n                  </div>\n                </div>\n              </div>\n            </div>\n          )}\n\n          {/* Holidays Tab */}\n          {activeTab === 'holidays' && (\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <div className=\"flex justify-between items-center mb-6\">\n                <h3 className=\"text-lg font-medium text-gray-900\">Holiday Calendar</h3>\n                <button className=\"bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg transition\">\n                  Add Holiday\n                </button>\n              </div>\n              \n              <div className=\"mb-6\">\n                <h4 className=\"font-medium text-gray-800 mb-3\">Recurring Holiday Patterns</h4>\n                <div className=\"grid grid-cols-1 md:grid-cols-3 gap-4\">\n                  <div className=\"border border-gray-200 rounded-lg p-4\">\n                    <div className=\"flex items-center mb-2\">\n                      <input type=\"checkbox\" className=\"h-4 w-4 text-indigo-600 rounded\" defaultChecked />\n                      <span className=\"ml-2 font-medium\">Weekly Off Pattern</span>\n                    </div>\n                    <p className=\"text-sm text-gray-600\">Every Sunday</p>\n                  </div>\n                  <div className=\"border border-gray-200 rounded-lg p-4\">\n                    <div className=\"flex items-center mb-2\">\n                      <input type=\"checkbox\" className=\"h-4 w-4 text-indigo-600 rounded\" />\n                      <span className=\"ml-2 font-medium\">Bi-weekly Off Pattern</span>\n                    </div>\n                    <p className=\"text-sm text-gray-600\">Alternate Sundays</p>\n                  </div>\n                  <div className=\"border border-gray-200 rounded-lg p-4\">\n                    <div className=\"flex items-center mb-2\">\n                      <input type=\"checkbox\" className=\"h-4 w-4 text-indigo-600 rounded\" defaultChecked />\n                      <span className=\"ml-2 font-medium\">Monthly Off Pattern</span>\n                    </div>\n                    <p className=\"text-sm text-gray-600\">First Sunday of month</p>\n                  </div>\n                </div>\n              </div>\n              \n              <div className=\"overflow-x-auto\">\n                <table className=\"min-w-full divide-y divide-gray-200\">\n                  <thead className=\"bg-gray-50\">\n                    <tr>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Holiday Name</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Date</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Recurring</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Location</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Actions</th>\n                    </tr>\n                  </thead>\n                  <tbody className=\"bg-white divide-y divide-gray-200\">\n                    {holidays.map((holiday) => (\n                      <tr key={holiday.id} className=\"hover:bg-gray-50\">\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">{holiday.name}</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{holiday.date}</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                          {holiday.recurring ? (\n                            <span className=\"inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800\">\n                              Yes\n                            </span>\n                          ) : (\n                            <span className=\"inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800\">\n                              No\n                            </span>\n                          )}\n                        </td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{holiday.location}</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm\">\n                          <button className=\"text-indigo-600 hover:text-indigo-900 mr-3\">\n                            Edit\n                          </button>\n                          <button className=\"text-red-600 hover:text-red-900\">\n                            Delete\n                          </button>\n                        </td>\n                      </tr>\n                    ))}\n                  </tbody>\n                </table>\n              </div>\n            </div>\n          )}\n\n          {/* History Tab */}\n          {activeTab === 'history' && (\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <h3 className=\"text-lg font-medium text-gray-900 mb-6\">Policy Version History</h3>\n              <div className=\"space-y-4\">\n                {policyHistory.map((version) => (\n                  <div key={version.id} className=\"border border-gray-200 rounded-lg p-4 hover:bg-gray-50\">\n                    <div className=\"flex justify-between items-start\">\n                      <div>\n                        <h4 className=\"font-medium text-gray-900\">Version {version.version}</h4>\n                        <p className=\"text-sm text-gray-600 mt-1\">\n                          Effective from {version.effectiveFrom} \u2022 Created by {version.createdBy}\n                        </p>\n                      </div>\n                      <div className=\"flex space-x-2\">\n                        <button \n                          className=\"text-indigo-600 hover:text-indigo-900\"\n                          onClick={() => {\n                            setComparisonVersions([selectedPolicy?.id || policies[0].id, version.id]);\n                            setShowComparison(true);\n                            setActiveTab('comparison');\n                          }}\n                        >\n                          Compare\n                        </button>\n                        <button className=\"text-indigo-600 hover:text-indigo-900\">\n                          View Details\n                        </button>\n                      </div>\n                    </div>\n                  </div>\n                ))}\n              </div>\n              \n              <div className=\"mt-8\">\n                <h4 className=\"font-medium text-gray-800 mb-4\">Retroactive Recalculation</h4>\n                <div className=\"border border-gray-200 rounded-lg p-4\">\n                  <div className=\"grid grid-cols-1 md:grid-cols-3 gap-4 mb-4\">\n                    <div>\n                      <label className=\"block text-sm font-medium text-gray-700 mb-1\">Start Date</label>\n                      <input \n                        type=\"date\" \n                        className=\"w-full rounded-lg border-gray-300 border py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent\"\n                      />\n                    </div>\n                    <div>\n                      <label className=\"block text-sm font-medium text-gray-700 mb-1\">End Date</label>\n                      <input \n                        type=\"date\" \n                        className=\"w-full rounded-lg border-gray-300 border py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent\"\n                      />\n                    </div>\n                    <div>\n                      <label className=\"block text-sm font-medium text-gray-700 mb-1\">Affected Policy</label>\n                      <select className=\"w-full rounded-lg border-gray-300 border py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent\">\n                        <option>Select Policy</option>\n                        {policies.map(policy => (\n                          <option key={policy.id} value={policy.id}>{policy.name} v{policy.version}</option>\n                        ))}\n                      </select>\n                    </div>\n                  </div>\n                  <button className=\"bg-amber-600 hover:bg-amber-700 text-white py-2 px-4 rounded-lg transition\">\n                    Run Retroactive Calculation\n                  </button>\n                  <p className=\"mt-2 text-sm text-gray-600\">\n                    This will recalculate attendance records for the selected period using the new policy settings.\n                  </p>\n                </div>\n              </div>\n            </div>\n          )}\n\n          {/* Comparison Tab */}\n          {activeTab === 'comparison' && (\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <div className=\"flex justify-between items-center mb-6\">\n                <h3 className=\"text-lg font-medium text-gray-900\">Policy Comparison</h3>\n                <button \n                  className=\"text-indigo-600 hover:text-indigo-900\"\n                  onClick={() => setShowComparison(false)}\n                >\n                  Back to History\n                </button>\n              </div>\n              \n              <div className=\"grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6\">\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">Select First Version</label>\n                  <select \n                    className=\"w-full rounded-lg border-gray-300 border py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent\"\n                    value={comparisonVersions[0] || ''}\n                    onChange={(e) => setComparisonVersions([e.target.value, comparisonVersions[1]])}\n                  >\n                    <option value=\"\">Select Version</option>\n                    {policyHistory.map(version => (\n                      <option key={version.id} value={version.id}>Version {version.version} ({version.effectiveFrom})</option>\n                    ))}\n                  </select>\n                </div>\n                \n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">Select Second Version</label>\n                  <select \n                    className=\"w-full rounded-lg border-gray-300 border py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent\"\n                    value={comparisonVersions[1] || ''}\n                    onChange={(e) => setComparisonVersions([comparisonVersions[0], e.target.value])}\n                  >\n                    <option value=\"\">Select Version</option>\n                    {policyHistory.map(version => (\n                      <option key={version.id} value={version.id}>Version {version.version} ({version.effectiveFrom})</option>\n                    ))}\n                  </select>\n                </div>\n              </div>\n              \n              {comparisonVersions[0] && comparisonVersions[1] && (\n                <div className=\"border border-gray-200 rounded-lg overflow-hidden\">\n                  <table className=\"min-w-full\">\n                    <thead className=\"bg-gray-50\">\n                      <tr>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Setting</th>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Version {policyHistory.find(v => v.id == comparisonVersions[0])?.version}</th>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Version {policyHistory.find(v => v.id == comparisonVersions[1])?.version}</th>\n                        <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Difference</th>\n                      </tr>\n                    </thead>\n                    <tbody className=\"bg-white divide-y divide-gray-200\">\n                      <tr>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">Grace Period</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">15 minutes</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">10 minutes</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-amber-600\">Changed (-5 minutes)</td>\n                      </tr>\n                      <tr className=\"bg-gray-50\">\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">Overtime Threshold</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">8 hours</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">8 hours</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">No change</td>\n                      </tr>\n                      <tr>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">Half-Day Threshold</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">4 hours</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">3.5 hours</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-amber-600\">Changed (-0.5 hours)</td>\n                      </tr>\n                    </tbody>\n                  </table>\n                </div>\n              )}\n            </div>\n          )}\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "PayrollExport", "source": "function PayrollExport() {\n  // Mock data\n  const months = [\n    { id: '2024-01', name: 'January 2024', locked: true },\n    { id: '2024-02', name: 'February 2024', locked: true },\n    { id: '2024-03', name: 'March 2024', locked: false },\n    { id: '2024-04', name: 'April 2024', locked: false },\n  ];\n  \n  const exportHistory = [\n    { id: 1, period: 'March 2024', exportedBy: 'HR Manager', exportedAt: '2024-04-01 15:30', fileName: 'payroll_march_2024.csv' },\n    { id: 2, period: 'February 2024', exportedBy: 'System', exportedAt: '2024-03-01 03:00', fileName: 'payroll_february_2024.csv' },\n    { id: 3, period: 'January 2024', exportedBy: 'HR Manager', exportedAt: '2024-02-01 16:45', fileName: 'payroll_january_2024.csv' },\n  ];\n\n  const validationSummary = {\n    totalEmployees: 1247,\n    validRecords: 1238,\n    discrepancies: 9,\n    discrepancyList: [\n      { employeeId: 'EMP00124', name: 'Robert Chen', issue: 'Missing clock-out' },\n      { employeeId: 'EMP00356', name: 'Sarah Johnson', issue: 'Unverified overtime' },\n      { employeeId: 'EMP00789', name: 'Michael Torres', issue: 'Late arrival discrepancy' },\n    ]\n  };\n\n  const policyVersion = 'POL-V3-2024';\n\n  const [selectedMonth, setSelectedMonth] = React.useState('2024-03');\n  const [apiKey, setApiKey] = React.useState('wkpf_api_key_7d9b1c3f_a4e6');\n  const [showApiKey, setShowApiKey] = React.useState(false);\n\n  const handleLockToggle = (monthId) => {\n    console.log(`Toggling lock for ${monthId}`);\n    // In a real app, this would make an API call\n  };\n\n  const handleGenerateCSV = () => {\n    console.log(`Generating CSV for ${selectedMonth}`);\n    // In a real app, this would trigger CSV generation\n  };\n\n  const handleDownload = () => {\n    console.log('Downloading payroll file');\n    // In a real app, this would trigger file download\n  };\n\n  const handleRegenerateKey = () => {\n    console.log('Regenerating API key');\n    setApiKey('wkpf_api_key_' + Math.random().toString(36).substr(2, 8));\n  };\n\n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Sidebar */}\n      <div className=\"w-64 bg-indigo-800 text-white p-4\">\n        <div className=\"mb-8\">\n          <h1 className=\"text-xl font-bold\">WorkPulse</h1>\n          <p className=\"text-indigo-200 text-sm\">Payroll Management</p>\n        </div>\n        <nav>\n          <ul className=\"space-y-2\">\n            {['Dashboard', 'Clock Interface', 'Attendance', 'Leave Requests', 'Team View', 'Shift Rosters', 'Policies', 'Payroll Export', 'Facial Enrollment', 'Profile', 'Admin Audit'].map((item) => (\n              <li key={item}>\n                <a \n                  href=\"#\" \n                  className={`block py-2 px-4 rounded ${item === 'Payroll Export' ? 'bg-indigo-700 text-white' : 'hover:bg-indigo-700'}`}\n                >\n                  {item}\n                </a>\n              </li>\n            ))}\n          </ul>\n        </nav>\n      </div>\n\n      {/* Main Content */}\n      <div className=\"flex-1 flex flex-col overflow-hidden\">\n        {/* Header */}\n        <header className=\"bg-white shadow-sm p-4\">\n          <h2 className=\"text-2xl font-semibold text-gray-800\">Payroll Export</h2>\n          <p className=\"text-gray-600\">Secure export interface with period locking</p>\n        </header>\n\n        <main className=\"flex-1 overflow-y-auto p-6\">\n          <div className=\"grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6\">\n            {/* Month Picker & Locking Controls */}\n            <div className=\"lg:col-span-2 bg-white rounded-lg shadow p-6\">\n              <h3 className=\"text-lg font-medium text-gray-900 mb-4\">Period Selection & Locking</h3>\n              \n              <div className=\"grid grid-cols-3 gap-4 mb-6\">\n                {months.map((month) => (\n                  <div \n                    key={month.id}\n                    className={`border rounded-lg p-4 cursor-pointer transition-all ${\n                      selectedMonth === month.id \n                        ? 'border-indigo-500 bg-indigo-50' \n                        : 'border-gray-200 hover:border-indigo-300'\n                    }`}\n                    onClick={() => setSelectedMonth(month.id)}\n                  >\n                    <div className=\"flex justify-between items-start\">\n                      <h4 className=\"font-medium text-gray-900\">{month.name}</h4>\n                      <span \n                        className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${\n                          month.locked \n                            ? 'bg-red-100 text-red-800' \n                            : 'bg-green-100 text-green-800'\n                        }`}\n                      >\n                        {month.locked ? 'Locked' : 'Open'}\n                      </span>\n                    </div>\n                    <div className=\"mt-3 flex space-x-2\">\n                      <button\n                        onClick={(e) => {\n                          e.stopPropagation();\n                          handleLockToggle(month.id);\n                        }}\n                        className={`text-xs px-3 py-1 rounded ${\n                          month.locked\n                            ? 'bg-yellow-100 text-yellow-800 hover:bg-yellow-200'\n                            : 'bg-blue-100 text-blue-800 hover:bg-blue-200'\n                        }`}\n                      >\n                        {month.locked ? 'Unlock Period' : 'Lock Period'}\n                      </button>\n                    </div>\n                  </div>\n                ))}\n              </div>\n\n              <div className=\"flex space-x-3\">\n                <button\n                  onClick={handleGenerateCSV}\n                  className=\"px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500\"\n                >\n                  Generate CSV\n                </button>\n                <button\n                  onClick={handleDownload}\n                  className=\"px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500\"\n                >\n                  Download File\n                </button>\n              </div>\n            </div>\n\n            {/* Data Validation Summary */}\n            <div className=\"bg-white rounded-lg shadow p-6\">\n              <h3 className=\"text-lg font-medium text-gray-900 mb-4\">Validation Summary</h3>\n              \n              <div className=\"space-y-4\">\n                <div className=\"flex justify-between items-center pb-2 border-b\">\n                  <span className=\"text-gray-600\">Total Employees</span>\n                  <span className=\"font-medium\">{validationSummary.totalEmployees}</span>\n                </div>\n                \n                <div className=\"flex justify-between items-center pb-2 border-b\">\n                  <span className=\"text-gray-600\">Valid Records</span>\n                  <span className=\"font-medium text-green-600\">{validationSummary.validRecords}</span>\n                </div>\n                \n                <div className=\"flex justify-between items-center pb-2 border-b\">\n                  <span className=\"text-gray-600\">Discrepancies</span>\n                  <span className=\"font-medium text-red-600\">{validationSummary.discrepancies}</span>\n                </div>\n                \n                <div>\n                  <h4 className=\"text-sm font-medium text-gray-900 mb-2\">Top Issues</h4>\n                  <ul className=\"space-y-2\">\n                    {validationSummary.discrepancyList.map((issue, index) => (\n                      <li key={index} className=\"flex justify-between text-sm\">\n                        <span className=\"text-gray-600 truncate max-w-[120px]\">{issue.name}</span>\n                        <span className=\"text-red-600\">{issue.issue}</span>\n                      </li>\n                    ))}\n                  </ul>\n                </div>\n              </div>\n            </div>\n          </div>\n\n          <div className=\"grid grid-cols-1 lg:grid-cols-2 gap-6\">\n            {/* API Key Management */}\n            <div className=\"bg-white rounded-lg shadow p-6\">\n              <h3 className=\"text-lg font-medium text-gray-900 mb-4\">API Key Management</h3>\n              \n              <div className=\"mb-4\">\n                <label className=\"block text-sm font-medium text-gray-700 mb-1\">Current API Key</label>\n                <div className=\"flex\">\n                  <input\n                    type={showApiKey ? \"text\" : \"password\"}\n                    value={apiKey}\n                    readOnly\n                    className=\"flex-1 min-w-0 block w-full px-3 py-2 rounded-l-md border border-r-0 border-gray-300 focus:ring-indigo-500 focus:border-indigo-500\"\n                  />\n                  <button\n                    onClick={() => setShowApiKey(!showApiKey)}\n                    className=\"inline-flex items-center px-3 rounded-r-md border border-l-0 border-gray-300 bg-gray-50 text-gray-500 sm:text-sm\"\n                  >\n                    {showApiKey ? 'Hide' : 'Show'}\n                  </button>\n                </div>\n              </div>\n              \n              <button\n                onClick={handleRegenerateKey}\n                className=\"px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500\"\n              >\n                Regenerate Key\n              </button>\n              \n              <div className=\"mt-4 p-3 bg-blue-50 rounded-md\">\n                <p className=\"text-sm text-blue-700\">\n                  <strong>Note:</strong> This key provides access to payroll export endpoints. Store securely and regenerate if compromised.\n                </p>\n              </div>\n            </div>\n\n            {/* Policy Version & Export History */}\n            <div className=\"bg-white rounded-lg shadow p-6\">\n              <h3 className=\"text-lg font-medium text-gray-900 mb-4\">Policy Information</h3>\n              \n              <div className=\"mb-6 p-4 bg-indigo-50 rounded-lg\">\n                <div className=\"flex justify-between items-center\">\n                  <span className=\"text-gray-700\">Active Policy Version</span>\n                  <span className=\"font-mono bg-indigo-100 text-indigo-800 px-2 py-1 rounded\">\n                    {policyVersion}\n                  </span>\n                </div>\n                <p className=\"mt-2 text-sm text-gray-600\">\n                  Applied to all calculations for current export period\n                </p>\n              </div>\n              \n              <h4 className=\"text-md font-medium text-gray-900 mb-3\">Recent Exports</h4>\n              <div className=\"overflow-hidden\">\n                <table className=\"min-w-full divide-y divide-gray-200\">\n                  <thead className=\"bg-gray-50\">\n                    <tr>\n                      <th scope=\"col\" className=\"px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Period</th>\n                      <th scope=\"col\" className=\"px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Date</th>\n                      <th scope=\"col\" className=\"px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">File</th>\n                    </tr>\n                  </thead>\n                  <tbody className=\"bg-white divide-y divide-gray-200\">\n                    {exportHistory.map((record) => (\n                      <tr key={record.id}>\n                        <td className=\"px-3 py-2 whitespace-nowrap text-sm text-gray-500\">{record.period}</td>\n                        <td className=\"px-3 py-2 whitespace-nowrap text-sm text-gray-500\">{record.exportedAt.split(' ')[0]}</td>\n                        <td className=\"px-3 py-2 whitespace-nowrap text-sm text-indigo-600 hover:text-indigo-900\">\n                          <a href=\"#\">{record.fileName}</a>\n                        </td>\n                      </tr>\n                    ))}\n                  </tbody>\n                </table>\n              </div>\n            </div>\n          </div>\n        </main>\n      </div>\n    </div>\n  );\n}"}, {"name": "FacialEnrollment", "source": "function FacialEnrollment() {\n  // Mock data\n  const employee = {\n    id: \"EMP00123\",\n    first_name: \"Alex\",\n    last_name: \"Morgan\",\n    department: \"Engineering\",\n    location: \"New York, USA\"\n  };\n\n  const consentAgreement = {\n    jurisdiction: \"New York, USA\",\n    content: \"I consent to the collection and processing of my facial biometric data for time and attendance purposes in compliance with the Biometric Information Privacy Act (BIPA). This data will be encrypted and stored securely, with no sharing to third parties.\",\n    expiry_date: \"2025-06-15\",\n    consent_type: \"BIPA Compliant\"\n  };\n\n  const [currentAttempt, setCurrentAttempt] = React.useState(1);\n  const [capturedImages, setCapturedImages] = React.useState([]);\n  const [selectedTemplate, setSelectedTemplate] = React.useState(null);\n  const [enrollmentStatus, setEnrollmentStatus] = React.useState(\"Pending\");\n  const [showDeleteConfirm, setShowDeleteConfirm] = React.useState(false);\n  \n  const complianceFlags = [\n    { regulation: \"BIPA\", status: \"Compliant\" },\n    { regulation: \"GDPR\", status: \"Not Applicable\" }\n  ];\n\n  const captureInstructions = [\n    \"Position your face in the center of the frame\",\n    \"Ensure even lighting with no glare or shadows\",\n    \"Maintain a neutral expression with both eyes open\"\n  ];\n\n  // Handlers\n  const handleCapture = () => {\n    if (currentAttempt <= 3) {\n      // Simulate capturing an image\n      const newImage = {\n        id: currentAttempt,\n        timestamp: new Date().toLocaleTimeString(),\n        quality: Math.floor(Math.random() * 20) + 80 // 80-99 quality score\n      };\n      \n      setCapturedImages([...capturedImages, newImage]);\n      \n      if (currentAttempt < 3) {\n        setCurrentAttempt(currentAttempt + 1);\n      } else {\n        // After 3 attempts, auto-select best template\n        const best = [...capturedImages, newImage].reduce((max, img) => \n          img.quality > max.quality ? img : max, { quality: 0 });\n        setSelectedTemplate(best);\n        setEnrollmentStatus(\"Completed\");\n      }\n    }\n  };\n\n  const handleRetake = () => {\n    if (currentAttempt > 1) {\n      setCurrentAttempt(currentAttempt - 1);\n      setCapturedImages(capturedImages.slice(0, -1));\n    }\n  };\n\n  const handleConfirmEnrollment = () => {\n    setEnrollmentStatus(\"Active\");\n  };\n\n  const handleDeleteEnrollment = () => {\n    setShowDeleteConfirm(false);\n    setEnrollmentStatus(\"Deleted\");\n    setCapturedImages([]);\n    setSelectedTemplate(null);\n    setCurrentAttempt(1);\n  };\n\n  return (\n    <div className=\"flex flex-col min-h-screen bg-gray-50\">\n      {/* Header */}\n      <header className=\"bg-white shadow-sm py-4 px-6 border-b border-gray-200\">\n        <div classNamen=\"flex justify-between items-center\">\n          <h1 className=\"text-xl font-semibold text-gray-800\">Facial Enrollment</h1>\n          <div className=\"text-sm text-gray-600\">\n            <span className=\"font-medium\">{employee.first_name} {employee.last_name}</span> | {employee.department}\n          </div>\n        </div>\n      </header>\n\n      <div className=\"flex flex-1 overflow-hidden\">\n        {/* Main Content */}\n        <main className=\"flex-1 overflow-y-auto p-6\">\n          <div className=\"max-w-4xl mx-auto space-y-8\">\n            {/* Consent Agreement */}\n            <section className=\"bg-white rounded-lg shadow p-6\">\n              <h2 className=\"text-lg font-medium text-gray-800 mb-4\">Jurisdiction-Specific Consent</h2>\n              <div className=\"border border-gray-200 rounded p-4 bg-blue-50\">\n                <p className=\"text-gray-700 mb-4\">{consentAgreement.content}</p>\n                <div className=\"flex justify-between text-sm text-gray-600\">\n                  <span>Jurisdiction: {consentAgreement.jurisdiction}</span>\n                  <span>Consent Type: {consentAgreement.consent_type}</span>\n                  <span>Expiry: {consentAgreement.expiry_date}</span>\n                </div>\n              </div>\n            </section>\n\n            {/* Camera Feed */}\n            <section className=\"bg-white rounded-lg shadow p-6\">\n              <h2 className=\"text-lg font-medium text-gray-800 mb-4\">Capture Facial Template</h2>\n              \n              <div className=\"grid grid-cols-1 md:grid-cols-2 gap-6\">\n                {/* Camera Preview */}\n                <div className=\"border border-gray-300 rounded-lg bg-gray-100 h-80 flex items-center justify-center relative\">\n                  <div className=\"absolute inset-0 flex items-center justify-center\">\n                    <div className=\"w-48 h-48 rounded-full border-4 border-blue-400 border-dashed\"></div>\n                  </div>\n                  <div className=\"text-center p-4 bg-white bg-opacity-80 rounded-lg\">\n                    <p className=\"font-medium text-gray-700\">Camera Feed</p>\n                    <p className=\"text-sm text-gray-500 mt-1\">Attempt {currentAttempt} of 3</p>\n                  </div>\n                </div>\n                \n                {/* Instructions */}\n                <div>\n                  <h3 className=\"font-medium text-gray-700 mb-2\">Capture Instructions</h3>\n                  <ul className=\"space-y-2\">\n                    {captureInstructions.map((instruction, i) => (\n                      <li key={i} className=\"flex items-start\">\n                        <span className=\"text-blue-500 mr-2\">\u2022</span>\n                        <span className=\"text-gray-600 text-sm\">{instruction}</span>\n                      </li>\n                    ))}\n                  </ul>\n                  \n                  <div className=\"mt-6 flex space-x-3\">\n                    <button \n                      onClick={handleCapture}\n                      className=\"px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50\"\n                      disabled={currentAttempt > 3}\n                    >\n                      Capture Image\n                    </button>\n                    {currentAttempt > 1 && (\n                      <button \n                        onClick={handleRetake}\n                        className=\"px-4 py-2 border border-gray-300 rounded hover:bg-gray-50\"\n                      >\n                        Retake\n                      </button>\n                    )}\n                  </div>\n                </div>\n              </div>\n            </section>\n\n            {/* Captured Images */}\n            {capturedImages.length > 0 && (\n              <section className=\"bg-white rounded-lg shadow p-6\">\n                <h2 className=\"text-lg font-medium text-gray-800 mb-4\">Captured Templates</h2>\n                <div className=\"grid grid-cols-3 gap-4\">\n                  {capturedImages.map((img) => (\n                    <div \n                      key={img.id} \n                      className={`border rounded-lg p-3 text-center ${selectedTemplate?.id === img.id ? 'border-blue-500 bg-blue-50' : 'border-gray-200'}`}\n                    >\n                      <div className=\"bg-gray-200 border-2 border-dashed rounded-xl w-16 h-16 mx-auto mb-2\" />\n                      <p className=\"text-sm text-gray-600\">Quality: {img.quality}%</p>\n                      <p className=\"text-xs text-gray-500\">{img.timestamp}</p>\n                      {selectedTemplate?.id === img.id && (\n                        <span className=\"inline-block mt-2 px-2 py-1 text-xs bg-blue-100 text-blue-800 rounded-full\">Selected</span>\n                      )}\n                    </div>\n                  ))}\n                </div>\n                \n                {selectedTemplate && (\n                  <div className=\"mt-6 flex justify-end\">\n                    <button \n                      onClick={handleConfirmEnrollment}\n                      className=\"px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700\"\n                    >\n                      Confirm Enrollment\n                    </button>\n                  </div>\n                )}\n              </section>\n            )}\n\n            {/* Compliance & Status */}\n            <div className=\"grid grid-cols-1 md:grid-cols-2 gap-6\">\n              {/* Compliance */}\n              <section className=\"bg-white rounded-lg shadow p-6\">\n                <h2 className=\"text-lg font-medium text-gray-800 mb-4\">Compliance Status</h2>\n                <div className=\"space-y-3\">\n                  {complianceFlags.map((flag, index) => (\n                    <div key={index} className=\"flex justify-between items-center py-2 border-b border-gray-100\">\n                      <span className=\"text-gray-600\">{flag.regulation}</span>\n                      <span className={`px-2 py-1 rounded-full text-xs ${flag.status === 'Compliant' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}`}>\n                        {flag.status}\n                      </span>\n                    </div>\n                  ))}\n                </div>\n              </section>\n              \n              {/* Enrollment Status */}\n              <section className=\"bg-white rounded-lg shadow p-6\">\n                <h2 className=\"text-lg font-medium text-gray-800 mb-4\">Enrollment Details</h2>\n                <div className=\"space-y-4\">\n                  <div className=\"flex justify-between items-center\">\n                    <span className=\"text-gray-600\">Status</span>\n                    <span className={`px-2 py-1 rounded-full text-sm ${enrollmentStatus === 'Active' ? 'bg-green-100 text-green-800' : enrollmentStatus === 'Deleted' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'}`}>\n                      {enrollmentStatus}\n                    </span>\n                  </div>\n                  \n                  <div className=\"flex justify-between items-center\">\n                    <span className=\"text-gray-600\">Enrollment Date</span>\n                    <span className=\"text-gray-800\">June 15, 2023</span>\n                  </div>\n                  \n                  <div className=\"flex justify-between items-center\">\n                    <span className=\"text-gray-600\">Consent Expiry</span>\n                    <span className=\"text-gray-800\">{consentAgreement.expiry_date}</span>\n                  </div>\n                  \n                  <div className=\"pt-4\">\n                    <button \n                      onClick={() => setShowDeleteConfirm(true)}\n                      disabled={enrollmentStatus !== 'Active'}\n                      className=\"w-full py-2 px-4 border border-red-300 text-red-600 rounded hover:bg-red-50 disabled:opacity-50 disabled:cursor-not-allowed\"\n                    >\n                      Delete Enrollment\n                    </button>\n                  </div>\n                </div>\n              </section>\n            </div>\n\n            {/* Consent History */}\n            <section className=\"bg-white rounded-lg shadow p-6\">\n              <h2 className=\"text-lg font-medium text-gray-800 mb-4\">Consent History & Renewals</h2>\n              <div className=\"overflow-x-auto\">\n                <table className=\"min-w-full divide-y divide-gray-200\">\n                  <thead className=\"bg-gray-50\">\n                    <tr>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Date Given</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Consent Type</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Expiry Date</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Status</th>\n                    </tr>\n                  </thead>\n                  <tbody className=\"bg-white divide-y divide-gray-200\">\n                    <tr>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">June 15, 2023</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-900\">BIPA Compliant</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{consentAgreement.expiry_date}</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap\">\n                        <span className=\"px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800\">\n                          Active\n                        </span>\n                      </td>\n                    </tr>\n                    <tr className=\"bg-gray-50\">\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">June 10, 2021</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-900\">Initial Consent</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">June 15, 2023</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap\">\n                        <span className=\"px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800\">\n                          Expired\n                        </span>\n                      </td>\n                    </tr>\n                  </tbody>\n                </table>\n              </div>\n              <div className=\"mt-4 text-sm text-gray-600\">\n                <p>Next renewal reminder: May 15, 2025</p>\n              </div>\n            </section>\n          </div>\n        </main>\n      </div>\n\n      {/* Delete Confirmation Modal */}\n      {showDeleteConfirm && (\n        <div className=\"fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50\">\n          <div className=\"bg-white rounded-lg shadow-xl max-w-md w-full p-6\">\n            <h3 className=\"text-lg font-medium text-gray-900 mb-2\">Confirm Deletion</h3>\n            <p className=\"text-gray-600 mb-6\">Are you sure you want to delete this facial enrollment? This action cannot be undone.</p>\n            <div className=\"flex justify-end space-x-3\">\n              <button \n                onClick={() => setShowDeleteConfirm(false)}\n                className=\"px-4 py-2 border border-gray-300 rounded hover:bg-gray-50\"\n              >\n                Cancel\n              </button>\n              <button \n                onClick={handleDeleteEnrollment}\n                className=\"px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700\"\n              >\n                Delete\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}"}, {"name": "ProfileSettings", "source": "function ProfileSettings() {\n  // Mock data\n  const employeeData = {\n    id: \"EMP00123\",\n    first_name: \"Alex\",\n    last_name: \"Morgan\",\n    email: \"alex.morgan@starkdigital.com\",\n    timezone: \"Asia/Kolkata\",\n    shift_type: \"Fixed (9:00 AM - 6:00 PM)\",\n    joining_date: \"2021-03-15\",\n    employment_status: \"Active\"\n  };\n\n  const [timezone, setTimezone] = React.useState(employeeData.timezone);\n  const [notifications, setNotifications] = React.useState({\n    email: true,\n    sms: false\n  });\n  const [facialEnrollmentStatus, setFacialEnrollmentStatus] = React.useState(\"Enrolled\");\n  const [deviceSyncStatus, setDeviceSyncStatus] = React.useState(\"Synced\");\n  const [passwordLastChanged, setPasswordLastChanged] = React.useState(\"2023-11-15\");\n  const [attendancePolicyAware, setAttendancePolicyAware] = React.useState(true);\n\n  const timezones = [\n    \"Asia/Kolkata\",\n    \"America/New_York\",\n    \"Europe/London\",\n    \"Australia/Sydney\",\n    \"Asia/Tokyo\"\n  ];\n\n  const handleNotificationChange = (type) => {\n    setNotifications(prev => ({\n      ...prev,\n      [type]: !prev[type]\n    }));\n  };\n\n  const handleTimezoneChange = (e) => {\n    setTimezone(e.target.value);\n  };\n\n  const handleFacialEnrollment = () => {\n    setFacialEnrollmentStatus(facialEnrollmentStatus === \"Enrolled\" ? \"Pending\" : \"Enrolled\");\n  };\n\n  const handleDeviceSync = () => {\n    setDeviceSyncStatus(\"Syncing...\");\n    setTimeout(() => setDeviceSyncStatus(\"Synced\"), 2000);\n  };\n\n  const handleChangePassword = () => {\n    alert(\"Redirecting to password change page...\");\n  };\n\n  const handleExportData = () => {\n    alert(\"Data export request submitted. You will receive an email when ready.\");\n  };\n\n  const togglePolicyAwareness = () => {\n    setAttendancePolicyAware(!attendancePolicyAware);\n  };\n\n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Sidebar */}\n      <div className=\"w-64 bg-white shadow-md p-6 flex flex-col\">\n        <div className=\"mb-10\">\n          <h1 className=\"text-2xl font-bold text-blue-700\">WorkPulse</h1>\n          <p className=\"text-gray-500 text-sm\">Attendance & Leave Management</p>\n        </div>\n        <nav className=\"flex-1\">\n          <a href=\"/dashboard\" className=\"block py-3 px-4 text-gray-600 hover:bg-blue-50 rounded-lg mb-2\">Dashboard</a>\n          <a href=\"/clock\" className=\"block py-3 px-4 text-gray-600 hover:bg-blue-50 rounded-lg mb-2\">Clock In/Out</a>\n          <a href=\"/attendance\" className=\"block py-3 px-4 text-gray-600 hover:bg-blue-50 rounded-lg mb-2\">Attendance</a>\n          <a href=\"/leave/request\" className=\"block py-3 px-4 text-gray-600 hover:bg-blue-50 rounded-lg mb-2\">Leave Request</a>\n          <a href=\"/team\" className=\"block py-3 px-4 text-gray-600 hover:bg-blue-50 rounded-lg mb-2\">Team</a>\n          <a href=\"/shifts\" className=\"block py-3 px-4 text-gray-600 hover:bg-blue-50 rounded-lg mb-2\">Shift Roster</a>\n          <a href=\"/policies\" className=\"block py-3 px-4 text-gray-600 hover:bg-blue-50 rounded-lg mb-2\">Policies</a>\n          <a href=\"/payroll\" className=\"block py-3 px-4 text-gray-600 hover:bg-blue-50 rounded-lg mb-2\">Payroll</a>\n          <a href=\"/profile\" className=\"block py-3 px-4 bg-blue-100 text-blue-700 font-medium rounded-lg mb-2\">Profile Settings</a>\n        </nav>\n        <div className=\"pt-4 border-t border-gray-200\">\n          <p className=\"text-gray-500 text-sm\">\u00a9 2023 Stark Digital</p>\n        </div>\n      </div>\n\n      {/* Main Content */}\n      <div className=\"flex-1 overflow-auto p-8\">\n        <div className=\"max-w-4xl mx-auto\">\n          <div className=\"mb-8\">\n            <h2 className=\"text-3xl font-bold text-gray-800 mb-2\">Profile Settings</h2>\n            <p className=\"text-gray-600\">Manage your personal information and preferences</p>\n          </div>\n\n          <div className=\"bg-white rounded-xl shadow-sm p-6 mb-8\">\n            <h3 className=\"text-xl font-semibold text-gray-800 mb-4\">Personal Information</h3>\n            <div className=\"grid grid-cols-1 md:grid-cols-2 gap-6\">\n              <div>\n                <p className=\"text-gray-500 text-sm mb-1\">Employee ID</p>\n                <p className=\"font-medium\">{employeeData.id}</p>\n              </div>\n              <div>\n                <p className=\"text-gray-500 text-sm mb-1\">Email</p>\n                <p className=\"font-medium\">{employeeData.email}</p>\n              </div>\n              <div>\n                <p className=\"text-gray-500 text-sm mb-1\">Name</p>\n                <p className=\"font-medium\">{employeeData.first_name} {employeeData.last_name}</p>\n              </div>\n              <div>\n                <p className=\"text-gray-500 text-sm mb-1\">Employment Status</p>\n                <p className=\"font-medium\">{employeeData.employment_status}</p>\n              </div>\n              <div>\n                <p className=\"text-gray-500 text-sm mb-1\">Joining Date</p>\n                <p className=\"font-medium\">{new Date(employeeData.joining_date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</p>\n              </div>\n              <div>\n                <p className=\"text-gray-500 text-sm mb-1\">Shift Type</p>\n                <p className=\"font-medium\">{employeeData.shift_type}</p>\n              </div>\n            </div>\n          </div>\n\n          <div className=\"bg-white rounded-xl shadow-sm p-6 mb-8\">\n            <h3 className=\"text-xl font-semibold text-gray-800 mb-4\">Timezone Preference</h3>\n            <div className=\"max-w-xs\">\n              <label className=\"block text-gray-700 text-sm font-medium mb-2\" htmlFor=\"timezone\">\n                Select Timezone\n              </label>\n              <select\n                id=\"timezone\"\n                value={timezone}\n                onChange={handleTimezoneChange}\n                className=\"w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500\"\n              >\n                {timezones.map(tz => (\n                  <option key={tz} value={tz}>{tz}</option>\n                ))}\n              </select>\n              <p className=\"mt-2 text-sm text-gray-500\">Current timezone: {timezone}</p>\n            </div>\n          </div>\n\n          <div className=\"bg-white rounded-xl shadow-sm p-6 mb-8\">\n            <h3 className=\"text-xl font-semibold text-gray-800 mb-4\">Facial Enrollment</h3>\n            <div className=\"flex items-center justify-between mb-4\">\n              <div>\n                <p className=\"font-medium\">Status: <span className={facialEnrollmentStatus === \"Enrolled\" ? \"text-green-600\" : \"text-orange-500\"}>{facialEnrollmentStatus}</span></p>\n                <p className=\"text-gray-500 text-sm mt-1\">Facial verification for clock-ins</p>\n              </div>\n              <button\n                onClick={handleFacialEnrollment}\n                className=\"px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors\"\n              >\n                {facialEnrollmentStatus === \"Enrolled\" ? \"Manage\" : \"Enroll Now\"}\n              </button>\n            </div>\n          </div>\n\n          <div className=\"bg-white rounded-xl shadow-sm p-6 mb-8\">\n            <h3 className=\"text-xl font-semibold text-gray-800 mb-4\">Notification Preferences</h3>\n            <div className=\"space-y-4\">\n              <div className=\"flex items-center justify-between\">\n                <div>\n                  <p className=\"font-medium\">Email Notifications</p>\n                  <p className=\"text-gray-500 text-sm\">Receive updates via email</p>\n                </div>\n                <label className=\"relative inline-flex items-center cursor-pointer\">\n                  <input\n                    type=\"checkbox\"\n                    checked={notifications.email}\n                    onChange={() => handleNotificationChange('email')}\n                    className=\"sr-only peer\"\n                  />\n                  <div className=\"w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600\"></div>\n                </label>\n              </div>\n              <div className=\"flex items-center justify-between\">\n                <div>\n                  <p className=\"font-medium\">SMS Notifications</p>\n                  <p className=\"text-gray-500 text-sm\">Receive updates via text message</p>\n                </div>\n                <label className=\"relative inline-flex items-center cursor-pointer\">\n                  <input\n                    type=\"checkbox\"\n                    checked={notifications.sms}\n                    onChange={() => handleNotificationChange('sms')}\n                    className=\"sr-only peer\"\n                  />\n                  <div className=\"w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600\"></div>\n                </label>\n              </div>\n            </div>\n          </div>\n\n          <div className=\"bg-white rounded-xl shadow-sm p-6 mb-8\">\n            <h3 className=\"text-xl font-semibold text-gray-800 mb-4\">Device Sync</h3>\n            <div className=\"flex items-center justify-between\">\n              <div>\n                <p className=\"font-medium\">Status: <span className={deviceSyncStatus === \"Synced\" ? \"text-green-600\" : \"text-orange-500\"}>{deviceSyncStatus}</span></p>\n                <p className=\"text-gray-500 text-sm mt-1\">Synchronize attendance data across devices</p>\n              </div>\n              <button\n                onClick={handleDeviceSync}\n                disabled={deviceSyncStatus === \"Syncing...\"}\n                className={`px-4 py-2 rounded-lg transition-colors ${deviceSyncStatus === \"Syncing...\" ? \"bg-gray-300 cursor-not-allowed\" : \"bg-blue-600 text-white hover:bg-blue-700\"}`}\n              >\n                {deviceSyncStatus === \"Syncing...\" ? \"Syncing...\" : \"Sync Now\"}\n              </button>\n            </div>\n          </div>\n\n          <div className=\"bg-white rounded-xl shadow-sm p-6 mb-8\">\n            <h3 className=\"text-xl font-semibold text-gray-800 mb-4\">Authentication</h3>\n            <div className=\"flex items-center justify-between\">\n              <div>\n                <p className=\"font-medium\">Password</p>\n                <p className=\"text-gray-500 text-sm mt-1\">Last changed: {new Date(passwordLastChanged).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</p>\n              </div>\n              <button\n                onClick={handleChangePassword}\n                className=\"px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors\"\n              >\n                Change Password\n              </button>\n            </div>\n          </div>\n\n          <div className=\"bg-white rounded-xl shadow-sm p-6 mb-8\">\n            <h3 className=\"text-xl font-semibold text-gray-800 mb-4\">Attendance Policy</h3>\n            <div className=\"flex items-center justify-between\">\n              <div>\n                <p className=\"font-medium\">Policy Awareness</p>\n                <p className=\"text-gray-500 text-sm mt-1\">I acknowledge I have read and understood company attendance policies</p>\n              </div>\n              <label className=\"relative inline-flex items-center cursor-pointer\">\n                <input\n                  type=\"checkbox\"\n                  checked={attendancePolicyAware}\n                  onChange={togglePolicyAwareness}\n                  className=\"sr-only peer\"\n                />\n                <div className=\"w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600\"></div>\n              </label>\n            </div>\n          </div>\n\n          <div className=\"bg-white rounded-xl shadow-sm p-6\">\n            <h3 className=\"text-xl font-semibold text-gray-800 mb-4\">Data Export</h3>\n            <div className=\"flex items-center justify-between\">\n              <div>\n                <p className=\"font-medium\">Request Data Export</p>\n                <p className=\"text-gray-500 text-sm mt-1\">Download your personal attendance and leave data</p>\n              </div>\n              <button\n                onClick={handleExportData}\n                className=\"px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors\"\n              >\n                Request Export\n              </button>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "AdminAudit", "source": "function AdminAudit() {\n  // Mock data for audit logs\n  const mockAuditLogs = [\n    {\n      id: 1,\n      entity_type: 'attendance',\n      entity_id: 101,\n      action: 'update',\n      old_value: { clock_in_time: '09:15:00', status: 'late' },\n      new_value: { clock_in_time: '09:00:00', status: 'present' },\n      actor_id: 501,\n      actor_name: 'HR Manager',\n      actor_role: 'admin',\n      reason: 'Manual correction for system error',\n      ip_address: '192.168.1.105',\n      created_at: '2023-06-15T14:30:00Z'\n    },\n    {\n      id: 2,\n      entity_type: 'leave',\n      entity_id: 205,\n      action: 'approve',\n      old_value: { status: 'pending' },\n      new_value: { status: 'approved', current_approver_id: 501 },\n      actor_id: 502,\n      actor_name: 'Department Head',\n      actor_role: 'manager',\n      reason: 'Annual leave request approved',\n      ip_address: '203.0.113.5',\n      created_at: '2023-06-14T11:45:00Z'\n    },\n    {\n      id: 3,\n      entity_type: 'shift_assignment',\n      entity_id: 301,\n      action: 'create',\n      old_value: {},\n      new_value: { employee_id: 120, shift_id: 15, effective_from: '2023-07-01' },\n      actor_id: 501,\n      actor_name: 'HR Manager',\n      actor_role: 'admin',\n      reason: 'New shift assignment for July rotation',\n      ip_address: '192.168.1.105',\n      created_at: '2023-06-10T09:20:00Z'\n    },\n    {\n      id
