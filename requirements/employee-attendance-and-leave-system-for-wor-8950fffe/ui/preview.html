e={{ backgroundColor: '#f7fafc', textAlign: 'left' }}>\n            <th style={{ padding: '12px 15px', fontWeight: '600', color: '#4a5568', borderBottom: '1px solid #e2e8f0' }}>Type</th>\n            <th style={{ padding: '12px 15px', fontWeight: '600', color: '#4a5568', borderBottom: '1px solid #e2e8f0' }}>Recipient</th>\n            <th style={{ padding: '12px 15px', fontWeight: '600', color: '#4a5568', borderBottom: '1px solid #e2e8f0' }}>Subject</th>\n            <th style={{ padding: '12px 15px', fontWeight: '600', color: '#4a5568', borderBottom: '1px solid #e2e8f0' }}>Status</th>\n            <th style={{ padding: '12px 15px', fontWeight: '600', color: '#4a5568', borderBottom: '1px solid #e2e8f0' }}>Date</th>\n          </tr>\n        </thead>\n        <tbody>\n          {history.map(item => (\n            <tr key={item.id} style={{ borderBottom: '1px solid #e2e8f0' }}>\n              <td style={{ padding: '12px 15px', color: '#4a5568' }}>\n                <span style={{\n                  padding: '3px 8px',\n                  borderRadius: '4px',\n                  fontSize: '12px',\n                  fontWeight: '500',\n                  backgroundColor: item.type === 'email' ? '#ebf8ff' : '#f0fff4',\n                  color: item.type === 'email' ? '#3182ce' : '#38a169'\n                }}>\n                  {item.type.toUpperCase()}\n                </span>\n              </td>\n              <td style={{ padding: '12px 15px', color: '#2d3748' }}>{item.recipient}</td>\n              <td style={{ padding: '12px 15px', color: '#4a5568' }}>{item.subject}</td>\n              <td style={{ padding: '12px 15px' }}>\n                <span style={{\n                  padding: '3px 8px',\n                  borderRadius: '4px',\n                  fontSize: '12px',\n                  fontWeight: '500',\n                  backgroundColor: item.status === 'sent' ? '#ebf8ff' : '#f0fff4',\n                  color: item.status === 'sent' ? '#3182ce' : '#38a169'\n                }}>\n                  {item.status}\n                </span>\n              </td>\n              <td style={{ padding: '12px 15px', color: '#4a5568' }}>{formatDate(item.timestamp)}</td>\n            </tr>\n          ))}\n        </tbody>\n      </table>\n    </div>\n  );\n}"}, {"name": "SettingsProfile", "component": "SettingsProfile", "source": "function SettingsProfile() {\n  // Mock data\n  const employee = {\n    id: \"EMP00123\",\n    first_name: \"Alex\",\n    last_name: \"Morgan\",\n    email: \"alex.morgan@starkdigital.com\",\n    timezone: \"Asia/Kolkata\",\n    notification_preferences: {\n      email_attendance_reminder: true,\n      sms_late_arrival: false,\n      email_leave_approval: true,\n      push_missing_clock_out: true\n    }\n  };\n\n  const devices = [\n    { id: 1, name: \"iPhone 13 Pro\", last_active: \"2023-10-15 09:30:00\", current: true },\n    { id: 2, name: \"MacBook Pro 16\", last_active: \"2023-10-14 17:45:00\", current: false },\n    { id: 3, name: \"iPad Air\", last_active: \"2023-09-22 11:15:00\", current: false }\n  ];\n\n  const sessions = [\n    { id: 1, ip: \"192.168.1.105\", location: \"Mumbai Office\", device: \"Chrome on Windows 11\", active: true, last_activity: \"2023-10-15 10:15:00\" },\n    { id: 2, ip: \"203.197.85.42\", location: \"Bangalore Cafe\", device: \"Safari on iPhone\", active: false, last_activity: \"2023-10-13 14:20:00\" },\n    { id: 3, ip: \"103.21.59.12\", location: \"Delhi Home\", device: \"Firefox on Ubuntu\", active: false, last_activity: \"2023-10-10 19:30:00\" }\n  ];\n\n  // Handlers\n  const handleTimezoneChange = (e) => {\n    console.log(\"Timezone changed to:\", e.target.value);\n  };\n\n  const handleNotificationChange = (key) => {\n    console.log(\"Notification preference toggled:\", key);\n  };\n\n  const handleChangePassword = (e) => {\n    e.preventDefault();\n    alert(\"Password change initiated\");\n  };\n\n  const handleRevokeDevice = (deviceId) => {\n    console.log(\"Revoking    padding: 12px 16px;\n          border: 1px solid #cbd5e1;\n          border-radius: 6px;\n          font-size: 16px;\n        }\n        \n        .primary-btn, .secondary-btn {\n          padding: 12px 20px;\n          border-radius: 6px;\n          font-weight: 500;\n          cursor: pointer;\n          border: none;\n        }\n        \n        .primary-btn {\n          background: #3b82f6;\n          color: white;\n        }\n        \n        .primary-btn:hover {\n          background: #2563eb;\n        }\n        \n        .secondary-btn {\n          background: #f1f5f9;\n          color: #0f172a;\n        }\n        \n        .secondary-btn:hover {\n          background: #e2e8f0;\n        }\n        \n        .privacy-item {\n          display: flex;\n          justify-content: space-between;\n          align-items: center;\n          padding: 16px 0;\n          border-bottom: 1px solid #f1f5f9;\n        }\n        \n        .privacy-item:last-child {\n          border-bottom: none;\n        }\n        \n        .privacy-item h4 {\n          margin-bottom: 4px;\n          color: #0f172a;\n        }\n        \n        .privacy-item p {\n          color: #64748b;\n          margin: 0;\n          font-size: 14px;\n        }\n      `}</style>\n    </div>\n  );\n}"}];
