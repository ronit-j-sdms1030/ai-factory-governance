     {/* API Key Management */}\n            <div className=\"bg-white shadow rounded-lg p-6\">\n              <h3 className=\"text-lg font-medium text-gray-900 mb-4\">API Access</h3>\n              <div className=\"mb-4\">\n                <label className=\"block text-sm font-medium text-gray-700 mb-1\">\n                  REST API Key\n                </label>\n                <div className=\"flex\">\n                  <input\n                    type={showApiKey ? \"text\" : \"password\"}\n                    value={apiKey}\n                    readOnly\n                    className=\"flex-1 min-w-0 block w-full px-3 py-2 rounded-l-md border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm\"\n                  />\n                  <button\n                    onClick={() => setShowApiKey(!showApiKey)}\n                    className=\"inline-flex items-center px-3 rounded-r-md border border-l-0 border-gray-300 bg-gray-50 text-gray-500 sm:text-sm\"\n                  >\n                    {showApiKey ? 'Hide' : 'Show'}\n                  </button>\n                </div>\n              </div>\n              <button\n                onClick={regenerateApiKey}\n                className=\"w-full inline-flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none\"\n              >\n                Regenerate Key\n              </button>\n            </div>\n\n            {/* Audit Trail */}\n            <div className=\"bg-white shadow rounded-lg p-6\">\n              <h3 className=\"text-lg font-medium text-gray-900 mb-4\">Recent Activity</h3>\n              <ul className=\"space-y-3\">\n                <li className=\"text-sm\">\n                  <div className=\"font-medium text-gray-900\">Report Generated</div>\n                  <div className=\"text-gray-500\">by HR Manager \u2022 Today, 09:30 AM</div>\n                </li>\n                <li className=\"text-sm\">\n                  <div className=\"font-medium text-gray-900\">Period Locked</div>\n                  <div className=\"text-gray-500\">by System Admin \u2022 Mar 1, 2024</div>\n                </li>\n                <li className=\"text-sm\">\n                  <div className=\"font-medium text-gray-900\">Column Configuration Updated</div>\n                  <div className=\"text-gray-500\">by Finance Lead \u2022 Feb 28, 2024</div>\n                </li>\n                <li className=\"text-sm\">\n                  <div className=\"font-medium text-gray-900\">API Key Regenerated</div>\n                  <div className=\"text-gray-500\">by IT Admin \u2022 Feb 25, 2024</div>\n                </li>\n              </ul>\n            </div>\n\n            {/* Export History */}\n            <div className=\"bg-white shadow rounded-lg p-6\">\n              <h3 className=\"text-lg font-medium text-gray-900 mb-4\">Export History</h3>\n              <ul className=\"space-y-3\">\n                <li className=\"text-sm\">\n                  <div className=\"font-medium text-gray-900\">March 2024 Report</div>\n                  <div className=\"text-gray-500\">Generated: Mar 5, 2024 \u2022 12.4MB</div>\n                </li>\n                <li className=\"text-sm\">\n                  <div className=\"font-medium text-gray-900\">February 2024 Report</div>\n                  <div className=\"text-gray-500\">Generated: Feb 5, 2024 \u2022 11.8MB</div>\n                </li>\n                <li className=\"text-sm\">\n                  <div className=\"font-medium text-gray-900\">January 2024 Report</div>\n                  <div className=\"text-gray-500\">Generated: Jan 7, 2024 \u2022 13.2MB</div>\n                </li>\n              </ul>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "FacialEnrollment", "source": "function FacialEnrollment() {\n  // Mock data\n  const employee = {\n    id: \"EMP001\",\n    first_name: \"Alex\",\n    last_name: \"Johnson\",\n    department: \"Engineering\",\n    location: \"New York, USA\"\n  };\n\n  const jurisdiction = {\n    name: \"United States\",\n    regulations: [\n      \"Biometric Information Privacy Act (BIPA)\",\n      \"General Data Protection Regulation (GDPR) Article 9\",\n      \"State privacy laws apply\"\n    ],\n    consentExpiry: \"2025-12-31\"\n  };\n\n  const [consentAgreed, setConsentAgreed] = React.useState(false);\n  const [cameraActive, setCameraActive] = React.useState(false);\n  const [attempts, setAttempts] = React.useState(0);\n  const [bestTemplate, setBestTemplate] = React.useState(null);\n  const [complianceFlags, setComplianceFlags] = React.useState({\n    bipa: true,\n    gdpr: false,\n    statePrivacy: true\n  });\n  const [enrolled, setEnrolled] = React.useState(false);\n  const [showDeleteConfirm, setShowDeleteConfirm] = React.useState(false);\n\n  const startEnrollment = () => {\n    setCameraActive(true);\n  };\n\n  const captureImage = () => {\n    if (attempts < 3) {\n      const newAttempt = attempts + 1;\n      setAttempts(newAttempt);\n      \n      // Simulate template quality scoring\n      const qualityScore = Math.floor(Math.random() * 40) + 60; // 60-99\n      \n      if (!bestTemplate || qualityScore > bestTemplate.quality) {\n        setBestTemplate({\n          attempt: newAttempt,\n          quality: qualityScore\n        });\n      }\n    }\n    \n    if (attempts === 2) {\n      setTimeout(() => setEnrolled(true), 1000);\n    }\n  };\n\n  const deleteEnrollment = () => {\n    setEnrolled(false);\n    setAttempts(0);\n    setBestTemplate(null);\n    setShowDeleteConfirm(false);\n  };\n\n  return (\n    <div style={{display: 'flex', minHeight: '100vh', backgroundColor: '#f5f7fa'}}>\n      {/* Sidebar */}\n      <div style={{width: 240, backgroundColor: '#2c3e50', color: 'white', padding: '20px 0'}}>\n        <div style={{padding: '0 20px 20px', borderBottom: '1px solid #34495e'}}>\n          <h1 style={{color: '#3498db', fontSize: 20, margin: 0}}>WorkPulse</h1>\n          <p style={{color: '#bdc3c7', fontSize: 12, marginTop: 5}}>Attendance Management</p>\n        </div>\n        <nav>\n          {['Dashboard', 'Clock In/Out', 'Attendance Calendar', 'Leave Request', 'Team Attendance', 'Shift Roster', 'Payroll Export'].map((item) => (\n            <div key={item} style={{padding: '12px 20px', cursor: 'pointer'}}>{item}</div>\n          ))}\n          <div style={{backgroundColor: '#3498db', padding: '12px 20px', cursor: 'pointer'}}>Facial Enrollment</div>\n          {['Settings', 'Admin Policy Manager', 'Audit Trail'].map((item) => (\n            <div key={item} style={{padding: '12px 20px', cursor: 'pointer'}}>{item}</div>\n          ))}\n        </nav>\n      </div>\n\n      {/* Main Content */}\n      <div style={{flex: 1, padding: 30}}>\n        <div style={{maxWidth: 1000, margin: '0 auto'}}>\n          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 30}}>\n            <div>\n              <h1 style={{margin: 0, color: '#2c3e50', fontSize: 28}}>Facial Enrollment</h1>\n              <p style={{color: '#7f8c8d', marginTop: 5}}>Manage biometric identification for secure clock-ins</p>\n            </div>\n            <div style={{textAlign: 'right'}}>\n              <p style={{margin: 0, fontWeight: 500}}>{employee.first_name} {employee.last_name}</p>\n              <p style={{margin: 0, color: '#7f8c8d', fontSize: 14}}>{employee.department} \u2022 {employee.location}</p>\n            </div>\n          </div>\n\n          <div style={{backgroundColor: 'white', borderRadius: 10, boxShadow: '0 4px 12px rgba(0,0,0,0.05)', padding: 30}}>\n            {!enrolled ? (\n              <>\n                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 25}}>\n                  <h2 style={{margin: 0, color: '#2c3e50'}}>Biometric Consent</h2>\n                  <div style={{display: 'flex', alignItems: 'center', gap: 10}}>\n                    <span style={{fontSize: 14, color: '#7f8c8d'}}>Status:</span>\n                    <span style={{padding: '4px 12px', backgroundColor: '#f1c40f', color: 'white', borderRadius: 20, fontSize: 12}}>\n                      Not Enrolled\n                    </span>\n                  </div>\n                </div>\n\n                <div style={{borderBottom: '1px solid #ecf0f1', paddingBottom: 20, marginBottom: 25}}>\n                  <h3 style={{color: '#2c3e50', marginBottom: 15}}>Jurisdiction-Specific Regulations</h3>\n                  <div style={{backgroundColor: '#f8f9fa', padding: 15, borderRadius: 8, borderLeft: '4px solid #3498db'}}>\n                    <p style={{fontWeight: 600, margin: '0 0 10px'}}>{jurisdiction.name} Compliance Requirements:</p>\n                    <ul style={{margin: 0, paddingLeft: 20}}>\n                      {jurisdiction.regulations.map((reg, i) => (\n                        <li key={i} style={{marginBottom: 8}}>{reg}</li>\n                      ))}\n                    </ul>\n                  </div>\n                </div>\n\n                <div style={{marginBottom: 25}}>\n                  <h3 style={{color: '#2c3e50', marginBottom: 15}}>Consent Agreement</h3>\n                  <div style={{backgroundColor: '#f8f9fa', padding: 20, borderRadius: 8, maxHeight: 150, overflowY: 'auto', border: '1px solid #ddd'}}>\n                    <p style={{fontSize: 14, lineHeight: 1.6}}>\n                      I understand that my facial biometric data will be collected, processed, and stored securely for \n                      authentication purposes only. This data will be encrypted and retained in compliance with applicable \n                      privacy laws including {jurisdiction.regulations[0]} and GDPR. My consent expires on {jurisdiction.consentExpiry}.\n                    </p>\n                  </div>\n                  \n                  <label style={{display: 'flex', alignItems: 'center', marginTop: 15, cursor: 'pointer'}}>\n                    <input \n                      type=\"checkbox\" \n                      checked={consentAgreed}\n                      onChange={(e) => setConsentAgreed(e.target.checked)}\n                      style={{marginRight: 10, transform: 'scale(1.2)'}}\n                    />\n                    <span style={{fontSize: 14}}>I agree to the terms and consent to biometric enrollment</span>\n                  </label>\n                </div>\n\n                {consentAgreed && (\n                  <div>\n                    <h3 style={{color: '#2c3e50', marginBottom: 15}}>Facial Capture Process</h3>\n                    \n                    {!cameraActive ? (\n                      <div style={{textAlign: 'center', padding: 30}}>\n                        <button \n                          onClick={startEnrollment}\n                          style={{\n                            backgroundColor: '#27ae60',\n                            color: 'white',\n                            border: 'none',\n                            padding: '12px 25px',\n                            borderRadius: 6,\n                            fontSize: 16,\n                            cursor: 'pointer',\n                            fontWeight: 600\n                          }}\n                        >\n                          Start Camera\n                        </button>\n                        <p style={{marginTop: 15, color: '#7f8c8d', fontSize: 14}}>\n                          Please ensure good lighting and position yourself directly in front of the camera\n                        </p>\n                      </div>\n                    ) : (\n                      <div>\n                        <div style={{display: 'flex', gap: 30, marginBottom: 25}}>\n                          <div style={{flex: 1}}>\n                            <div style={{backgroundColor: '#34495e', height: 300, borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', marginBottom: 10}}>\n                              Camera Feed Placeholder\n                            </div>\n                            <p style={{textAlign: 'center', color: '#7f8c8d', fontSize: 14, margin: 0}}>\n                              Neutral expression \u2022 Directly facing camera \u2022 Good lighting\n                            </p>\n                          </div>\n                          \n                          <div style={{flex: 1}}>\n                            <div style={{backgroundColor: '#ecf0f1', height: 300, borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#7f8c8d'}}>\n                              Capture Preview\n                            </div>\n                            <div style={{display: 'flex', justifyContent: 'center', marginTop: 15}}>\n                              <button \n                                onClick={captureImage}\n                                disabled={attempts >= 3}\n                                style={{\n                                  backgroundColor: attempts < 3 ? '#3498db' : '#95a5a6',\n                                  color: 'white',\n                                  border: 'none',\n                                  padding: '10px 20px',\n                                  borderRadius: 6,\n                                  cursor: attempts < 3 ? 'pointer' : 'not-allowed',\n                                  fontWeight: 600\n                                }}\n                              >\n                                Capture Attempt {attempts + 1}/3\n                              </button>\n                            </div>\n                          </div>\n                        </div>\n                        \n                        <div>\n                          <h4 style={{color: '#2c3e50', marginBottom: 10}}>Capture Progress</h4>\n                          <div style={{display: 'flex', gap: 10, alignItems: 'center'}}>\n                            {[1, 2, 3].map(i => (\n                              <div key={i} style={{display: 'flex', alignItems: 'center'}}>\n                                <div style={{\n                                  width: 30,\n                                  height: 30,\n                                  borderRadius: '50%',\n                                  backgroundColor: i <= attempts ? '#27ae60' : '#ecf0f1',\n                                  display: 'flex',\n                                  alignItems: 'center',\n                                  justifyContent: 'center',\n                                  color: 'white',\n                                  fontWeight: 'bold'\n                                }}>\n                                  {i}\n                                </div>\n                                {i < 3 && <div style={{height: 2, width: 30, backgroundColor: '#ecf0f1'}}></div>}\n                              </div>\n                            ))}\n                          </div>\n                        </div>\n                      </div>\n                    )}\n                  </div>\n                )}\n              </>\n            ) : (\n              <div>\n                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 25}}>\n                  <h2 style={{margin: 0, color: '#2c3e50'}}>Enrollment Complete</h2>\n                  <div style={{display: 'flex', alignItems: 'center', gap: 10}}>\n                    <span style={{fontSize: 14, color: '#7f8c8d'}}>Status:</span>\n                    <span style={{padding: '4px 12px', backgroundColor: '#27ae60', color: 'white', borderRadius: 20, fontSize: 12}}>\n                      Enrolled\n                    </span>\n                  </div>\n                </div>\n                \n                <div style={{backgroundColor: '#f8f9fa', padding: 20, borderRadius: 8, marginBottom: 25}}>\n                  <h3 style={{color: '#2c3e50', marginTop: 0}}>Selected Template</h3>\n                  <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>\n                    <div>\n                      <p style={{margin: '0 0 10px'}}>Best Quality Template: Attempt #{bestTemplate.attempt}</p>\n                      <p style={{margin: 0}}>Quality Score: {bestTemplate.quality}%</p>\n                    </div>\n                    <div style={{textAlign: 'right'}}>\n                      <p style={{margin: 0, fontSize: 14, color: '#7f8c8d'}}>Enrollment Date</p>\n                      <p style={{margin: 0, fontWeight: 600}}>June 15, 2023</p>\n                    </div>\n                  </div>\n                </div>\n                \n                <div style={{marginBottom: 25}}>\n                  <h3 style={{color: '#2c3e50', marginBottom: 15}}>Compliance Status</h3>\n                  <div style={{display: 'flex', gap: 15}}>\n                    {Object.entries(complianceFlags).map(([key, value]) => (\n                      <div key={key} style={{\n                        flex: 1,\n                        padding: 15,\n                        backgroundColor: value ? '#d5f5e3' : '#fadbd8',\n                        borderRadius: 6,\n                        textAlign: 'center'\n                      }}>\n                        <div style={{fontWeight: 600, marginBottom: 5}}>\n                          {key.toUpperCase()}\n                        </div>\n                        <div style={{fontSize: 14}}>\n                          {value ? 'Compliant' : 'Not Compliant'}\n                        </div>\n                      </div>\n                    ))}\n                  </div>\n                </div>\n                \n                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 25}}>\n                  <div>\n                    <h3 style={{color: '#2c3e50', marginBottom: 5}}>Consent Expiration</h3>\n                    <p style={{margin: 0, fontSize: 14, color: '#7f8c8d'}}>\n                      Your consent expires on December 31, 2025 (in 847 days)\n                    </p>\n                  </div>\n                  <button \n                    onClick={() => setShowDeleteConfirm(true)}\n                    style={{\n                      backgroundColor: '#e74c3c',\n                      color: 'white',\n                      border: 'none',\n                      padding: '10px 20px',\n                      borderRadius: 6,\n                      cursor: 'pointer',\n                      fontWeight: 600\n                    }}\n                  >\n                    Delete Enrollment\n                  </button>\n                </div>\n                \n                {showDeleteConfirm && (\n                  <div style={{\n                    position: 'fixed',\n                    top: 0,\n                    left: 0,\n                    right: 0,\n                    bottom: 0,\n                    backgroundColor: 'rgba(0,0,0,0.5)',\n                    display: 'flex',\n                    alignItems: 'center',\n                    justifyContent: 'center',\n                    zIndex: 1000\n                  }}>\n                    <div style={{\n                      backgroundColor: 'white',\n                      padding: 30,\n                      borderRadius: 10,\n                      maxWidth: 400,\n                      textAlign: 'center'\n                    }}>\n                      <h3 style={{margin: '0 0 15px', color: '#2c3e50'}}>Confirm Deletion</h3>\n                      <p style={{margin: '0 0 20px', color: '#7f8c8d'}}>\n                        Are you sure you want to delete your facial enrollment? This action cannot be undone.\n                      </p>\n                      <div style={{display: 'flex', justifyContent: 'center', gap: 10}}>\n                        <button \n                          onClick={() => setShowDeleteConfirm(false)}\n                          style={{\n                            backgroundColor: '#95a5a6',\n                            color: 'white',\n                            border: 'none',\n                            padding: '10px 20px',\n                            borderRadius: 6,\n                            cursor: 'pointer'\n                          }}\n                        >\n                          Cancel\n                        </button>\n                        <button \n                          onClick={deleteEnrollment}\n                          style={{\n                            backgroundColor: '#e74c3c',\n                            color: 'white',\n                            border: 'none',\n                            padding: '10px 20px',\n                            borderRadius: 6,\n                            cursor: 'pointer'\n                          }}\n                        >\n                          Delete\n                        </button>\n                      </div>\n                    </div>\n                  </div>\n                )}\n              </div>\n            )}\n          </div>\n          \n          <div style={{textAlign: 'center', marginTop: 20, color: '#7f8c8d', fontSize: 14}}>\n            <p>All biometric data is encrypted and stored in compliance with regional regulations</p>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "Settings", "source": "function Settings() {\n  // Mock data\n  const employee = {\n    id: 1,\n    employee_id: \"EMP001234\",\n    first_name: \"Alex\",\n    last_name: \"Morgan\",\n    email: \"alex.morgan@starkdigital.com\",\n    department: \"Engineering\",\n    timezone: \"Asia/Kolkata\",\n    joining_date: \"2020-05-15\",\n    employment_status: \"Full-time\"\n  };\n\n  const deviceInfo = {\n    userAgent: \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36\",\n    platform: \"Win32\",\n    language: \"en-US\",\n    screenWidth: \"1920x1080\"\n  };\n\n  // State for settings\n  const [timezone, setTimezone] = React.useState(employee.timezone);\n  const [notifications, setNotifications] = React.useState({\n    email: true,\n    sms: false,\n    push: true\n  });\n  const [offlineSync, setOfflineSync] = React.useState(true);\n  const [manualLocation, setManualLocation] = React.useState(false);\n  const [facialVerification, setFacialVerification] = React.useState(true);\n  \n  // Handlers\n  const handleTimezoneChange = (e) => {\n    setTimezone(e.target.value);\n  };\n\n  const handleNotificationChange = (type) => {\n    setNotifications(prev => ({\n      ...prev,\n      [type]: !prev[type]\n    }));\n  };\n\n  const handleOfflineSyncToggle = () => {\n    setOfflineSync(!offlineSync);\n  };\n\n  const handleManualLocationToggle = () => {\n    setManualLocation(!manualLocation);\n  };\n\n  const handleFacialVerificationToggle = () => {\n    setFacialVerification(!facialVerification);\n  };\n\n  const handleExportData = () => {\n    alert(\"Data export request submitted. You'll receive an email when ready.\");\n  };\n\n  const handlePrivacyUpdate = () => {\n    alert(\"Privacy settings updated successfully\");\n  };\n\n  const handleChangePassword = () => {\n    alert(\"Redirecting to password change page...\");\n  };\n\n  // Timezone options\n  const timezones = [\n    \"Asia/Kolkata\",\n    \"America/New_York\",\n    \"Europe/London\",\n    \"Asia/Tokyo\",\n    \"Australia/Sydney\"\n  ];\n\n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Sidebar */}\n      <div className=\"w-64 bg-indigo-800 text-white p-6 flex flex-col\">\n        <div className=\"mb-10\">\n          <h1 className=\"text-2xl font-bold\">WorkPulse</h1>\n          <p className=\"text-indigo-200 text-sm\">Attendance Management</p>\n        </div>\n        <nav className=\"flex-1\">\n          <a href=\"/\" className=\"block py-3 px-4 text-indigo-200 hover:bg-indigo-700 rounded-lg mb-2\">Dashboard</a>\n          <a href=\"/clock\" className=\"block py-3 px-4 text-indigo-200 hover:bg-indigo-700 rounded-lg mb-2\">Clock In/Out</a>\n          <a href=\"/attendance\" className=\"block py-3 px-4 text-indigo-200 hover:bg-indigo-700 rounded-lg mb-2\">Attendance</a>\n          <a href=\"/leave/request\" className=\"block py-3 px-4 text-indigo-200 hover:bg-indigo-700 rounded-lg mb-2\">Leave Request</a>\n          <a href=\"/team\" className=\"block py-3 px-4 text-indigo-200 hover:bg-indigo-700 rounded-lg mb-2\">Team Attendance</a>\n          <a href=\"/shifts\" className=\"block py-3 px-4 text-indigo-200 hover:bg-indigo-700 rounded-lg mb-2\">Shift Roster</a>\n          <a href=\"/payroll\" className=\"block py-3 px-4 text-indigo-200 hover:bg-indigo-700 rounded-lg mb-2\">Payroll Export</a>\n          <a href=\"/profile/face\" className=\"block py-3 px-4 text-indigo-200 hover:bg-indigo-700 rounded-lg mb-2\">Facial Enrollment</a>\n          <a href=\"/settings\" className=\"block py-3 px-4 bg-indigo-900 rounded-lg mb-2 font-medium\">Settings</a>\n          <a href=\"/admin/policies\" className=\"block py-3 px-4 text-indigo-200 hover:bg-indigo-700 rounded-lg mb-2\">Admin Policies</a>\n          <a href=\"/admin/audit\" className=\"block py-3 px-4 text-indigo-200 hover:bg-indigo-700 rounded-lg mb-2\">Audit Trail</a>\n        </nav>\n        <div className=\"pt-4 border-t border-indigo-700\">\n          <p className=\"text-xs text-indigo-300\">{employee.email}</p>\n        </div>\n      </div>\n\n      {/* Main Content */}\n      <div className=\"flex-1 overflow-auto p-8\">\n        <div className=\"max-w-4xl mx-auto\">\n          <h1 className=\"text-3xl font-bold text-gray-800 mb-2\">Settings</h1>\n          <p className=\"text-gray-600 mb-8\">Manage your personal and device settings</p>\n\n          <div className=\"grid grid-cols-1 md:grid-cols-2 gap-8\">\n            {/* Profile Information */}\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <h2 className=\"text-xl font-semibold text-gray-800 mb-4\">Profile Information</h2>\n              <div className=\"space-y-4\">\n                <div>\n                  <p className=\"text-sm text-gray-500\">Name</p>\n                  <p className=\"font-medium\">{employee.first_name} {employee.last_name}</p>\n                </div>\n                <div>\n                  <p className=\"text-sm text-gray-500\">Employee ID</p>\n                  <p className=\"font-medium\">{employee.employee_id}</p>\n                </div>\n                <div>\n                  <p className=\"text-sm text-gray-500\">Email</p>\n                  <p className=\"font-medium\">{employee.email}</p>\n                </div>\n                <div>\n                  <p className=\"text-sm text-gray-500\">Department</p>\n                  <p className=\"font-medium\">{employee.department}</p>\n                </div>\n                <div>\n                  <p className=\"text-sm text-gray-500\">Joining Date</p>\n                  <p className=\"font-medium\">{new Date(employee.joining_date).toLocaleDateString()}</p>\n                </div>\n                <div>\n                  <p className=\"text-sm text-gray-500\">Employment Status</p>\n                  <p className=\"font-medium\">{employee.employment_status}</p>\n                </div>\n                <button \n                  onClick={handleChangePassword}\n                  className=\"mt-4 w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition\"\n                >\n                  Change Password\n                </button>\n              </div>\n            </div>\n\n            {/* Device Information */}\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <h2 className=\"text-xl font-semibold text-gray-800 mb-4\">Device Information</h2>\n              <div className=\"space-y-4\">\n                <div>\n                  <p className=\"text-sm text-gray-500\">User Agent</p>\n                  <p className=\"font-medium text-sm truncate\">{deviceInfo.userAgent}</p>\n                </div>\n                <div>\n                  <p className=\"text-sm text-gray-500\">Platform</p>\n                  <p className=\"font-medium\">{deviceInfo.platform}</p>\n                </div>\n                <div>\n                  <p className=\"text-sm text-gray-500\">Language</p>\n                  <p className=\"font-medium\">{deviceInfo.language}</p>\n                </div>\n                <div>\n                  <p className=\"text-sm text-gray-500\">Screen Resolution</p>\n                  <p className=\"font-medium\">{deviceInfo.screenWidth}</p>\n                </div>\n              </div>\n            </div>\n\n            {/* Timezone Selection */}\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <h2 className=\"text-xl font-semibold text-gray-800 mb-4\">Timezone</h2>\n              <div>\n                <label className=\"block text-sm font-medium text-gray-700 mb-2\">Select your timezone</label>\n                <select \n                  value={timezone} \n                  onChange={handleTimezoneChange}\n                  className=\"w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500\"\n                >\n                  {timezones.map(tz => (\n                    <option key={tz} value={tz}>{tz}</option>\n                  ))}\n                </select>\n                <p className=\"mt-2 text-sm text-gray-500\">This will affect how your attendance records are displayed</p>\n              </div>\n            </div>\n\n            {/* Notification Preferences */}\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <h2 className=\"text-xl font-semibold text-gray-800 mb-4\">Notification Preferences</h2>\n              <div className=\"space-y-4\">\n                <div className=\"flex items-center justify-between\">\n                  <div>\n                    <p className=\"font-medium\">Email Notifications</p>\n                    <p className=\"text-sm text-gray-500\">Receive updates via email</p>\n                  </div>\n                  <label className=\"relative inline-flex items-center cursor-pointer\">\n                    <input \n                      type=\"checkbox\" \n                      checked={notifications.email}\n                      onChange={() => handleNotificationChange('email')}\n                      className=\"sr-only peer\"\n                    />\n                    <div className=\"w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600\"></div>\n                  </label>\n                </div>\n                <div className=\"flex items-center justify-between\">\n                  <div>\n                    <p className=\"font-medium\">SMS Notifications</p>\n                    <p className=\"text-sm text-gray-500\">Receive text messages</p>\n                  </div>\n                  <label className=\"relative inline-flex items-center cursor-pointer\">\n                    <input \n                      type=\"checkbox\" \n                      checked={notifications.sms}\n                      onChange={() => handleNotificationChange('sms')}\n                      className=\"sr-only peer\"\n                    />\n                    <div className=\"w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600\"></div>\n                  </label>\n                </div>\n                <div className=\"flex items-center justify-between\">\n                  <div>\n                    <p className=\"font-medium\">Push Notifications</p>\n                    <p className=\"text-sm text-gray-500\">Browser/app notifications</p>\n                  </div>\n                  <label className=\"relative inline-flex items-center cursor-pointer\">\n                    <input \n                      type=\"checkbox\" \n                      checked={notifications.push}\n                      onChange={() => handleNotificationChange('push')}\n                      className=\"sr-only peer\"\n                    />\n                    <div className=\"w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600\"></div>\n                  </label>\n                </div>\n              </div>\n            </div>\n\n            {/* Offline Sync Management */}\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <h2 className=\"text-xl font-semibold text-gray-800 mb-4\">Offline Sync</h2>\n              <div className=\"flex items-center justify-between\">\n                <div>\n                  <p className=\"font-medium\">Enable Offline Sync</p>\n                  <p className=\"text-sm text-gray-500\">Sync data when connection is restored</p>\n                </div>\n                <label className=\"relative inline-flex items-center cursor-pointer\">\n                  <input \n                    type=\"checkbox\" \n                    checked={offlineSync}\n                    onChange={handleOfflineSyncToggle}\n                    className=\"sr-only peer\"\n                  />\n                  <div className=\"w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600\"></div>\n                </label>\n              </div>\n            </div>\n\n            {/* Manual Location Override */}\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <h2 className=\"text-xl font-semibold text-gray-800 mb-4\">Location Settings</h2>\n              <div className=\"flex items-center justify-between\">\n                <div>\n                  <p className=\"font-medium\">Manual Location Override</p>\n                  <p className=\"text-sm text-gray-500\">Use custom location for attendance</p>\n                </div>\n                <label className=\"relative inline-flex items-center cursor-pointer\">\n                  <input \n                    type=\"checkbox\" \n                    checked={manualLocation}\n                    onChange={handleManualLocationToggle}\n                    className=\"sr-only peer\"\n                  />\n                  <div className=\"w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600\"></div>\n                </label>\n              </div>\n            </div>\n\n            {/* Facial Verification */}\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <h2 className=\"text-xl font-semibold text-gray-800 mb-4\">Security</h2>\n              <div className=\"flex items-center justify-between mb-4\">\n                <div>\n                  <p className=\"font-medium\">Facial Verification</p>\n                  <p className=\"text-sm text-gray-500\">Require facial recognition for clock-in</p>\n                </div>\n                <label className=\"relative inline-flex items-center cursor-pointer\">\n                  <input \n                    type=\"checkbox\" \n                    checked={facialVerification}\n                    onChange={handleFacialVerificationToggle}\n                    className=\"sr-only peer\"\n                  />\n                  <div className=\"w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600\"></div>\n                </label>\n              </div>\n              <button \n                onClick={handleChangePassword}\n                className=\"w-full bg-gray-100 text-gray-800 py-2 px-4 rounded-lg hover:bg-gray-200 transition mb-4\"\n              >\n                Update Security Settings\n              </button>\n            </div>\n\n            {/* Data Export */}\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <h2 className=\"text-xl font-semibold text-gray-800 mb-4\">Data Export</h2>\n              <p className=\"text-gray-600 mb-4\">Request a copy of your personal data</p>\n              <button \n                onClick={handleExportData}\n                className=\"w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition\"\n              >\n                Request Data Export\n              </button>\n            </div>\n\n            {/* Privacy Controls */}\n            <div className=\"bg-white rounded-xl shadow-sm p-6\">\n              <h2 className=\"text-xl font-semibold text-gray-800 mb-4\">Privacy Controls</h2>\n              <p className=\"text-gray-600 mb-4\">Manage your privacy preferences</p>\n              <button \n                onClick={handlePrivacyUpdate}\n                className=\"w-full bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition\"\n              >\n                Update Privacy Settings\n              </button>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "AdminPolicyManager", "source": "function AdminPolicyManager() {\n  const [activeTab, setActiveTab] = React.useState('policies');\n  const [policies, setPolicies] = React.useState([\n    { id: 1, version: '2.1', name: 'Global Office Policy', effectiveFrom: '2023-01-01', effectiveTo: null, gracePeriod: 15, overtimeThreshold: 8, location: 'All Offices' },\n    { id: 2, version: '1.5', name: 'Field Worker Policy', effectiveFrom: '2022-06-01', effectiveTo: '2023-12-31', gracePeriod: 30, overtimeThreshold: 9, location: 'Field Locations' }\n  ]);\n  \n  const [holidays, setHolidays] = React.useState([\n    { id: 1, name: 'New Year\\'s Day', date: '2024-01-01', recurring: true, location: 'All' },\n    { id: 2, name: 'Independence Day', date: '2024-07-04', recurring: true, location: 'US' },\n    { id: 3, name: 'Christmas', date: '2024-12-25', recurring: true, location: 'All' }\n  ]);\n  \n  const [showPolicyForm, setShowPolicyForm] = React.useState(false);\n  const [showHolidayForm, setShowHolidayForm] = React.useState(false);\n  \n  const locations = ['All Offices', 'US Headquarters', 'UK Office', 'Field Locations'];\n  \n  const handleCreatePolicy = (policyData) => {\n    const newPolicy = {\n      id: policies.length + 1,\n      ...policyData,\n      effectiveTo: null\n    };\n    setPolicies([newPolicy, ...policies]);\n    setShowPolicyForm(false);\n  };\n  \n  const handleCreateHoliday = (holidayData) => {\n    const newHoliday = {\n      id: holidays.length + 1,\n      ...holidayData\n    };\n    setHolidays([newHoliday, ...holidays]);\n    setShowHolidayForm(false);\n  };\n  \n  const handleRecalculate = (policyId) => {\n    alert(`Recalculation triggered for policy ${policyId}`);\n  };\n  \n  const handleRollback = (policyId) => {\n    alert(`Rollback initiated for policy ${policyId}`);\n  };\n  \n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Sidebar */}\n      <div className=\"w-64 bg-white shadow-md p-6 flex flex-col\">\n        <h1 className=\"text-2xl font-bold text-indigo-700 mb-8\">WorkPulse Admin</h1>\n        <nav className=\"flex-1\">\n          <ul className=\"space-y-2\">\n            {['Dashboard', 'Clock In/Out', 'Attendance', 'Leave', 'Team', 'Shifts', 'Payroll', 'Profile', 'Settings', 'Policies', 'Audit'].map((item, index) => (\n              <li key={item}>\n                <a \n                  href={`/${item.toLowerCase().replace(' ', '')}`} \n                  className={`flex items-center p-3 rounded-lg ${item === 'Policies' ? 'bg-indigo-100 text-indigo-700 font-medium' : 'text-gray-600 hover:bg-gray-100'}`}\n                >\n                  <span>{item}</span>\n                </a>\n              </li>\n            ))}\n          </ul>\n        </nav>\n        <div className=\"pt-4 border-t border-gray-200\">\n          <p className=\"text-sm text-gray-500\">HR Administrator</p>\n        </div>\n      </div>\n      \n      {/* Main Content */}\n      <div className=\"flex-1 flex flex-col overflow-hidden\">\n        {/* Header */}\n        <header className=\"bg-white shadow-sm p-4\">\n          <div className=\"flex justify-between items-center\">\n            <h2 className=\"text-xl font-semibold text-gray-800\">Policy Management</h2>\n            <div className=\"flex items-center space-x-4\">\n              <button className=\"bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors\">\n                Export Policy Report\n              </button>\n            </div>\n          </div>\n        </header>\n        \n        {/* Tabs */}\n        <div className=\"border-b border-gray-200 bg-white\">\n          <nav className=\"flex px-6\">\n            {['policies', 'holidays', 'history', 'comparison'].map((tab) => (\n              <button\n                key={tab}\n                className={`px-4 py-3 font-medium text-sm capitalize ${activeTab === tab ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-500 hover:text-gray-700'}`}\n                onClick={() => setActiveTab(tab)}\n              >\n                {tab}\n              </button>\n            ))}\n          </nav>\n        </div>\n        \n        {/* Tab Content */}\n        <div className=\"flex-1 overflow-y-auto p-6 bg-gray-50\">\n          {activeTab === 'policies' && (\n            <div className=\"space-y-6\">\n              <div className=\"flex justify-between items-center\">\n                <h3 className=\"text-lg font-medium text-gray-900\">Attendance Policies</h3>\n                <button \n                  onClick={() => setShowPolicyForm(true)}\n                  className=\"bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors flex items-center\"\n                >\n                  <svg className=\"w-4 h-4 mr-2\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                    <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M12 6v6m0 0v6m0-6h6m-6 0H6\"></path>\n                  </svg>\n                  New Policy\n                </button>\n              </div>\n              \n              <div className=\"bg-white shadow rounded-lg overflow-hidden\">\n                <table className=\"min-w-full divide-y divide-gray-200\">\n                  <thead className=\"bg-gray-50\">\n                    <tr>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Policy</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Version</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Effective From</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Grace Period</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Overtime Threshold</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Location</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Actions</th>\n                    </tr>\n                  </thead>\n                  <tbody className=\"bg-white divide-y divide-gray-200\">\n                    {policies.map((policy) => (\n                      <tr key={policy.id}>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">{policy.name}</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{policy.version}</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{policy.effectiveFrom}</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{policy.gracePeriod} minutes</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{policy.overtimeThreshold} hours</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{policy.location}</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                          <button \n                            onClick={() => handleRecalculate(policy.id)}\n                            className=\"text-indigo-600 hover:text-indigo-900 mr-3\"\n                          >\n                            Recalculate\n                          </button>\n                          <button \n                            onClick={() => handleRollback(policy.id)}\n                            className=\"text-red-600 hover:text-red-900\"\n                          >\n                            Rollback\n                          </button>\n                        </td>\n                      </tr>\n                    ))}\n                  </tbody>\n                </table>\n              </div>\n            </div>\n          )}\n          \n          {activeTab === 'holidays' && (\n            <div className=\"space-y-6\">\n              <div className=\"flex justify-between items-center\">\n                <h3 className=\"text-lg font-medium text-gray-900\">Holiday Calendar</h3>\n                <div className=\"flex space-x-3\">\n                  <button className=\"border border-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 transition-colors flex items-center\">\n                    <svg className=\"w-4 h-4 mr-2\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                      <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4\"></path>\n                    </svg>\n                    Import Holidays\n                  </button>\n                  <button \n                    onClick={() => setShowHolidayForm(true)}\n                    className=\"bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors flex items-center\"\n                  >\n                    <svg className=\"w-4 h-4 mr-2\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                      <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M12 6v6m0 0v6m0-6h6m-6 0H6\"></path>\n                    </svg>\n                    Add Holiday\n                  </button>\n                </div>\n              </div>\n              \n              <div className=\"bg-white shadow rounded-lg overflow-hidden\">\n                <table className=\"min-w-full divide-y divide-gray-200\">\n                  <thead className=\"bg-gray-50\">\n                    <tr>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Holiday Name</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Date</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Recurring</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Location</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Actions</th>\n                    </tr>\n                  </thead>\n                  <tbody className=\"bg-white divide-y divide-gray-200\">\n                    {holidays.map((holiday) => (\n                      <tr key={holiday.id}>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">{holiday.name}</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{holiday.date}</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{holiday.recurring ? 'Yes' : 'No'}</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{holiday.location}</td>\n                        <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">\n                          <button className=\"text-indigo-600 hover:text-indigo-900 mr-3\">Edit</button>\n                          <button className=\"text-red-600 hover:text-red-900\">Delete</button>\n                        </td>\n                      </tr>\n                    ))}\n                  </tbody>\n                </table>\n              </div>\n            </div>\n          )}\n          \n          {activeTab === 'history' && (\n            <div className=\"space-y-6\">\n              <h3 className=\"text-lg font-medium text-gray-900\">Policy History</h3>\n              <div className=\"bg-white shadow rounded-lg p-6\">\n                <div className=\"border-l-4 border-indigo-500 pl-4 py-1 mb-4\">\n                  <h4 className=\"font-medium text-gray-900\">Global Office Policy v2.1</h4>\n                  <p className=\"text-sm text-gray-500\">Effective: Jan 1, 2023 - Current</p>\n                </div>\n                <div className=\"border-l-4 border-gray-300 pl-4 py-1 mb-4\">\n                  <h4 className=\"font-medium text-gray-900\">Global Office Policy v2.0</h4>\n                  <p className=\"text-sm text-gray-500\">Effective: Jun 1, 2022 - Dec 31, 2022</p>\n                </div>\n                <div className=\"border-l-4 border-gray-300 pl-4 py-1\">\n                  <h4 className=\"font-medium text-gray-900\">Global Office Policy v1.9</h4>\n                  <p className=\"text-sm text-gray-500\">Effective: Jan 1, 2022 - May 31, 2022</p>\n                </div>\n                <div className=\"mt-6\">\n                  <button className=\"text-indigo-600 hover:text-indigo-800 font-medium flex items-center\">\n                    <svg className=\"w-4 h-4 mr-2\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                      <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15\"></path>\n                    </svg>\n                    Rollback to v2.0\n                  </button>\n                </div>\n              </div>\n            </div>\n          )}\n          \n          {activeTab === 'comparison' && (\n            <div className=\"space-y-6\">\n              <h3 className=\"text-lg font-medium text-gray-900\">Policy Comparison</h3>\n              <div className=\"bg-white shadow rounded-lg overflow-hidden\">\n                <table className=\"min-w-full divide-y divide-gray-200\">\n                  <thead className=\"bg-gray-50\">\n                    <tr>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Policy Setting</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Global Office Policy v2.1</th>\n                      <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Field Worker Policy v1.5</th>\n                    </tr>\n                  </thead>\n                  <tbody className=\"bg-white divide-y divide-gray-200\">\n                    <tr>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">Grace Period</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">15 minutes</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">30 minutes</td>\n                    </tr>\n                    <tr>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">Overtime Threshold</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">8 hours</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">9 hours</td>\n                    </tr>\n                    <tr>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">Half-day Threshold</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">4 hours</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">5 hours</td>\n                    </tr>\n                    <tr>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">Location</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">All Offices</td>\n                      <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">Field Locations</td>\n                    </tr>\n                  </tbody>\n                </table>\n              </div>\n            </div>\n          )}\n        </div>\n      </div>\n      \n      {/* Policy Creation Modal */}\n      {showPolicyForm && (\n        <div className=\"fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50\">\n          <div className=\"bg-white rounded-lg shadow-xl w-full max-w-2xl\">\n            <div className=\"px-6 py-4 border-b border-gray-200\">\n              <h3 className=\"text-lg font-medium text-gray-900\">Create New Policy</h3>\n            </div>\n            <div className=\"p-6 space-y-4\">\n              <div className=\"grid grid-cols-2 gap-4\">\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">Policy Name</label>\n                  <input type=\"text\" className=\"w-full border border-gray-300 rounded-lg px-3 py-2\" placeholder=\"e.g., Global Office Policy\" />\n                </div>\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">Version</label>\n                  <input type=\"text\" className=\"w-full border border-gray-300 rounded-lg px-3 py-2\" placeholder=\"e.g., 2.2\" />\n                </div>\n              </div>\n              <div className=\"grid grid-cols-2 gap-4\">\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">Effective From</label>\n                  <input type=\"date\" className=\"w-full border border-gray-300 rounded-lg px-3 py-2\" />\n                </div>\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">Location</label>\n                  <select className=\"w-full border border-gray-300 rounded-lg px-3 py-2\">\n                    {locations.map(location => (\n                      <option key={location} value={location}>{location}</option>\n                    ))}\n                  </select>\n                </div>\n              </div>\n              <div className=\"grid grid-cols-3 gap-4\">\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">Grace Period (minutes)</label>\n                  <input type=\"number\" className=\"w-full border border-gray-300 rounded-lg px-3 py-2\" placeholder=\"15\" />\n                </div>\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">Overtime Threshold (hours)</label>\n                  <input type=\"number\" className=\"w-full border border-gray-300 rounded-lg px-3 py-2\" placeholder=\"8\" />\n                </div>\n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">Half-day Threshold (hours)</label>\n                  <input type=\"number\" className=\"w-full border border-gray-300 rounded-lg px-3 py-2\" placeholder=\"4\" />\n                </div>\n              </div>\n              <div>\n                <label className=\"block text-sm font-medium text-gray-700 mb-1\">Description</label>\n                <textarea className=\"w-full border border-gray-300 rounded-lg px-3 py-2\" rows=\"3\" placeholder=\"Policy description...\"></textarea>\n              </div>\n            </div>\n            <div className=\"px-6 py-4 border-t border-gray-200 flex justify-end space-x-3\">\n              <button \n                onClick={() => setShowPolicyForm(false)}\n                className=\"px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50\"\n              >\n                Cancel\n              </button>\n              <button \n                onClick={() => handleCreatePolicy({})}\n                className=\"px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700\"\n              >\n                Create Policy\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n      \n      {/* Holiday Creation Modal */}\n      {showHolidayForm && (\n        <div className=\"fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50\">\n          <div className=\"bg-white rounded-lg shadow-xl w-full max-w-md\">\n            <div className=\"px-6 py-4 border-b border-gray-200\">\n              <h3 className=\"text-lg font-medium text-gray-900\">Add New Holiday</h3>\n            </div>\n            <div className=\"p-6 space-y-4\">\n              <div>\n                <label className=\"block text-sm font-medium text-gray-700 mb-1\">Holiday Name</label>\n                <input type=\"text\" className=\"w-full border border-gray-300 rounded-lg px-3 py-2\" placeholder=\"e.g., New Year's Day\" />\n              </div>\n              <div>\n                <label className=\"block text-sm font-medium text-gray-700 mb-1\">Date</label>\n                <input type=\"date\" className=\"w-full border border-gray-300 rounded-lg px-3 py-2\" />\n              </div>\n              <div>\n                <label className=\"block text-sm font-medium text-gray-700 mb-1\">Location</label>\n                <select className=\"w-full border border-gray-300 rounded-lg px-3 py-2\">\n                  {locations.map(location => (\n                    <option key={location} value={location}>{location}</option>\n                  ))}\n                </select>\n              </div>\n              <div className=\"flex items-center\">\n                <input type=\"checkbox\" id=\"recurring\" className=\"h-4 w-4 text-indigo-600 border-gray-300 rounded\" />\n                <label htmlFor=\"recurring\" className=\"ml-2 block text-sm text-gray-700\">Recurring Holiday</label>\n              </div>\n            </div>\n            <div className=\"px-6 py-4 border-t border-gray-200 flex justify-end space-x-3\">\n              <button \n                onClick={() => setShowHolidayForm(false)}\n                className=\"px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50\"\n              >\n                Cancel\n              </button>\n              <button \n                onClick={() => handleCreateHoliday({})}\n                className=\"px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700\"\n              >\n                Add Holiday\n              </button>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}\n"}, {"name": "AuditTrail", "source": "function AuditTrail() {\n  // Mock data\n  const mockAuditLogs = [\n    {\n      id: 1,\n      entity_type: 'attendance',\n      entity_id: 1001,\n      action: 'manual_correction',\n      old_value: { clock_in_time: '09:15:00', status: 'late' },\n      new_value: { clock_in_time: '09:00:00', status: 'present' },\n      actor_id: 2001,\n      actor_name: 'HR Manager',\n      actor_role: 'HR',\n      reason: 'Employee forgot to clock in',\n      ip_address: '192.168.1.105',\n      created_at: '2023-06-15T09:30:00Z'\n    },\n    {\n      id: 2,\n      entity_type: 'leave',\n      entity_id: 3002,\n      action: 'status_change',\n      old_value: { status: 'pending' },\n      new_value: { status: 'approved' },\n      actor_id: 2002,\n      actor_name: 'Department Head',\n      actor_role: 'Manager',\n      reason: 'Annual leave approved',\n      ip_address: '203.0.113.42',\n      created_at: '2023-06-14T14:22:00Z'\n    },\n    {\n      id: 3,\n      entity_type: 'shift',\n      entity_id: 4003,\n      action: 'assignment_change',\n      old_value: { shift_id: 5 },\n      new_value: { shift_id: 7 },\n      actor_id: 2003,\n      actor_name: 'Shift Coordinator',\n      actor_role: 'Admin',\n      reason: 'Employee requested schedule change',\n      ip_address: '198.51.100.78',\n      created_at: '2023-06-13T11:45:00Z'\n    }\n  ];\n\n  const [logs, setLogs] = React.useState(mockAuditLogs);\n  const [dateRange, setDateRange] = React.useState({ start: '2023-06-01', end: '2023-06-30' });\n  const [entityType, setEntityType] = React.useState('all');\n  const [actorSearch, setActorSearch] = React.useState('');\n  const [selectedLog, setSelectedLog] = React.useState(null);\n  const [showDiff, setShowDiff] = React.useState(false);\n\n  const handleDateChange = (e) => {\n    const { name, value } = e.target;\n    setDateRange(prev => ({ ...prev, [name]: value }));\n  };\n\n  const handleFilter = () => {\n    // In a real app, this would filter the data\n    console.log('Filtering with:', { dateRange, entityType, actorSearch });\n  };\n\n  const handleExport = () => {\n    alert('Audit logs exported successfully!');\n  };\n\n  const handleLogSelect = (log) => {\n    setSelectedLog(log);\n    setShowDiff(true);\n  };\n\n  const filteredLogs = logs.filter(log => {\n    const matchesEntityType = entityType === 'all' || log.entity_type === entityType;\n    const matchesActor = actorSearch === '' || \n      log.actor_name.toLowerCase().includes(actorSearch.toLowerCase()) ||\n      log.actor_role.toLowerCase().includes(actorSearch.toLowerCase());\n    return matchesEntityType && matchesActor;\n  });\n\n  return (\n    <div style={{ display: 'flex', minHeight: '100vh', backgroundColor: '#f5f7fa' }}>\n      {/* Sidebar */}\n      <div style={{ width: '240px', backgroundColor: '#2c3e50', color: 'white', padding: '20px 0' }}>\n        <h2 style={{ padding: '0 20px 20px', borderBottom: '1px solid #34495e' }}>WorkPulse Admin</h2>\n        <nav>\n          <a href=\"/\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Dashboard</a>\n          <a href=\"/clock\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Clock In/Out</a>\n          <a href=\"/attendance\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Attendance</a>\n          <a href=\"/leave/request\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Leave Requests</a>\n          <a href=\"/team\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Team Attendance</a>\n          <a href=\"/shifts\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Shift Roster</a>\n          <a href=\"/payroll\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Payroll Export</a>\n          <a href=\"/profile/face\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Facial Enrollment</a>\n          <a href=\"/settings\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Settings</a>\n          <a href=\"/admin/policies\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Policies</a>\n          <a href=\"/admin/audit\" style={{ display: 'block', padding: '12px 20px', color: '#3498db', backgroundColor: '#34495e', textDecoration: 'none' }}>A x solid #eee', \n                    cursor: 'pointer',\n                    backgroundColor: selectedLog?.id === log.id ? '#e3f2fd' : 'transparent'\n                  }}\n                >\n                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '5px' }}>\n                    <span style={{ fontWeight: '600', color: '#2c3e50' }}>\n                      {log.entity_type.charAt(0).toUpperCase() + log.entity_type.slice(1)} {log.action.replace('_', ' ')}\n                    </span>\n                    <span style={{ color: '#7f8c8d', fontSize: '14px' }}>\n                      {new Date(log.created_at).toLocaleString()}\n                    </span>\n                  </div>\n                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '14px' }}>\n                    <span style={{ color: '#3498db' }}>{log.actor_name} ({log.actor_role})</span>\n                    <span style={{ color: '#95a5a6' }}>{log.ip_address}</span>\n                  </div>\n                  <div style={{ marginTop: '5px', fontSize: '13px', color: '#7f8c8d' }}>\n                    {log.reason}\n                  </div>\n                </div>\n              ))}\n            </div>\n          </div>\n\n          {/* Diff View */}\n          {showDiff && selectedLog && (\n            <div style={{ flex: 1, backgroundColor: 'white', borderRadius: '8px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)', padding: '20px' }}>\n              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>\n                <h2 style={{ color: '#2c3e50' }}>Change Details</h2>\n                <button \n                  onClick={() => setShowDiff(false)}\n                  style={{ background: 'none', border: 'none', color: '#95a5a6', cursor: 'pointer', fontSize: '20px' }}\n                >\n                  &times;\n                </button>\n              </div>\n              \n              <div style={{ marginBottom: '20px' }}>\n                <h3 style={{ color: '#34495e', marginBottom: '10px' }}>Entity Information</h3>\n                <div style={{ display: 'flex', gap: '15px' }}>\n                  <div>\n                    <p style={{ margin: '5px 0', color: '#7f8c8d' }}><strong>ID:</strong> {selectedLog.entity_id}</p>\n                    <p style={{ margin: '5px 0', color: '#7f8c8d' }}><strong>Type:</strong> {selectedLog.entity_type}</p>\n                  </div>\n                  <div>\n                    <p style={{ margin: '5px 0', color: '#7f8c8d' }}><strong>Action:</strong> {selectedLog.action.replace('_', ' ')}</p>\n                    <p style={{ margin: '5px 0', color: '#7f8c8d' }}><strong>Date:</strong> {new Date(selectedLog.created_at).toLocaleString()}</p>\n                  </div>\n                </div>\n              </div>\n              \n              <div style={{ marginBottom: '20px' }}>\n                <h3 style={{ color: '#34495e', marginBottom: '10px' }}>Actor Information</h3>\n                <p style={{ margin: '5px 0', color: '#7f8c8d' }}><strong>Name:</strong> {selectedLog.actor_name}</p>\n                <p style={{ margin: '5px 0', color: '#7f8c8d' }}><strong>Role:</strong> {selectedLog.actor_role}</p>\n                <p style={{ margin: '5px 0', color: '#7f8c8d' }}><strong>IP Address:</strong> {selectedLog.ip_address}</p>\n              </div>\n              \n              <div>\n                <h3 style={{ color: '#34495e', marginBottom: '10px' }}>Changes</h3>\n                <div style={{ display: 'flex', gap: '20px' }}>\n                  <div style={{ flex: 1 }}>\n                    <h4 style={{ color: '#e74c3c', marginBottom: '10px' }}>Before</h4>\n                    <pre style={{ backgroundColor: '#fdf6f6', padding: '15px', borderRadius: '4px', fontSize: '14px', overflowX: 'auto' }}>\n                      {JSON.stringify(selectedLog.old_value, null, 2)}\n                    </pre>\n                  </div>\n                  <div style={{ flex: 1 }}>\n                    <h4 style={{ color: '#27ae60', marginBottom: '10px' }}>After</h4>\n                    <pre style={{ backgroundColor: '#f6fdf6', padding: '15px', borderRadius: '4px', fontSize: '14px', overflowX: 'auto' }}>\n                      {JSON.stringify(selectedLog.new_value, null, 2)}\n                    </pre>\n                  </div>\n                </div>\n              </div>\n              \n              <div style={{ marginTop: '20px' }}>\n                <h3 style={{ color: '#34495e', marginBottom: '10px' }}>Reason</h3>\n                <p style={{ padding: '15px', backgroundColor: '#f8f9fa', borderRadius: '4px', borderLeft: '4px solid #3498db' }}>\n                  {selectedLog.reason}\n                </p>\n              </div>\n            </div>\n          )}\n        </div>\n\n        {/* Compliance Actions */}\n        <div style={{ backgroundColor: 'white', borderRadius: '8px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)', padding: '20px', marginTop: '20px' }}>\n          <h2 style={{ color: '#2c3e50', marginBottom: '15px' }}>Compliance Actions</h2>\n          <div style={{ display: 'flex', gap: '15px' }}>\n            <button style={{ padding: '10px 20px', backgroundColor: '#9b59b6', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer' }}>\n              Generate Compliance Report\n            </button>\n            <button style={{ padding: '10px 20px', backgroundColor: '#e67e22', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer' }}>\n              Review Manual Corrections\n            </button>\n            <button style={{ padding: '10px 20px', backgroundColor: '#34495e', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer' }}>\n              View Offline Sync Logs\n            </button>\n            <button style={{ padding: '10px 20px', backgroundColor: '#16a085', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer' }}>\n              View Activity Timeline\n            </button>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}\n"}];
  var __COMPONENTS = {};
