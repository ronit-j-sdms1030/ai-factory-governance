             </div>\n                <div style={{ padding: '15px', backgroundColor: '#ebf5fb', borderRadius: '6px', textAlign: 'center' }}>\n                  <p style={{ margin: '0 0 5px', fontSize: '24px', fontWeight: '600', color: '#3498db' }}>{orgMetrics.on_leave}</p>\n                  <p style={{ margin: '0', color: '#2c3e50' }}>On Leave</p>\n                </div>\n                <div style={{ padding: '15px', backgroundColor: '#fadbd8', borderRadius: '6px', textAlign: 'center' }}>\n                  <p style={{ margin: '0 0 5px', fontSize: '24px', fontWeight: '600', color: '#e74c3c' }}>{orgMetrics.absent}</p>\n                  <p style={{ margin: '0', color: '#2c3e50' }}>Absent</p>\n                </div>\n              </div>\n            </div>\n          )}\n        </div>\n        \n        {/* Real-time Notifications */}\n        <div style={{ marginTop: '20px', backgroundColor: 'white', borderRadius: '8px', padding: '20px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)' }}>\n          <h3 style={{ margin: '0 0 15px', color: '#2c3e50' }}>Recent Activity</h3>\n          {notifications.length > 0 ? (\n            <div>\n              {notifications.map(notification => (\n                <div key={notification.id} style={{ padding: '12px 0', borderBottom: '1px solid #ecf0f1', display: 'flex', alignItems: 'center' }}>\n                  <div style={{\n                    width: '8px',\n                    height: '8px',\n                    borderRadius: '50%',\n                    backgroundColor: notification.type === 'clock_in' ? '#2ecc71' : '#3498db',\n                    marginRight: '12px'\n                  }}></div>\n                  <p style={{ margin: '0', color: '#2c3e50' }}>{notification.message}</p>\n                </div>\n              ))}\n            </div>\n          ) : (\n            <p style={{ margin: '0', color: '#7f8c8d' }}>No recent activity</p>\n          )}\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "ClockInOut", "source": "function ClockInOut() {\n  const [currentTime, setCurrentTime] = React.useState(new Date());\n  const [isOnline, setIsOnline] = React.useState(navigator.onLine);\n  const [isSubmitting, setIsSubmitting] = React.useState(false);\n  const [showToast, setShowToast] = React.useState(false);\n  const [toastMessage, setToastMessage] = React.useState('');\n  const [showCamera, setShowCamera] = React.useState(false);\n  const [showGPSInput, setShowGPSInput] = React.useState(false);\n  const [manualGPS, setManualGPS] = React.useState({ lat: '', lng: '' });\n  const [syncStatus, setSyncStatus] = React.useState('synced'); // synced, pending, conflict\n  const [deviceInfo, setDeviceInfo] = React.useState({\n    userAgent: navigator.userAgent,\n    platform: navigator.platform,\n    language: navigator.language\n  });\n\n  React.useEffect(() => {\n    const timer = setInterval(() => {\n      setCurrentTime(new Date());\n    }, 1000);\n\n    const handleOnline = () => setIsOnline(true);\n    const handleOffline = () => setIsOnline(false);\n\n    window.addEventListener('online', handleOnline);\n    window.addEventListener('offline', handleOffline);\n\n    return () => {\n      clearInterval(timer);\n      window.removeEventListener('online', handleOnline);\n      window.removeEventListener('offline', handleOffline);\n    };\n  }, []);\n\n  const formatTime = (date) => {\n    return date.toLocaleTimeString([], { \n      hour: '2-digit', \n      minute: '2-digit',\n      second: '2-digit',\n      hour12: true \n    });\n  };\n\n  const formatDate = (date) => {\n    return date.toLocaleDateString([], { \n      weekday: 'long',\n      year: 'numeric',\n      month: 'long',\n      day: 'numeric'\n    });\n  };\n\n  const handleClockIn = async () => {\n    setIsSubmitting(true);\n    \n    // Simulate API call delay\n    await new Promise(resolve => setTimeout(resolve, 3000));\n    \n    setIsSubmitting(false);\n    setToastMessage(`Clocked in at ${formatTime(new Date())}`);\n    setShowToast(true);\n    \n    // Auto-hide toast after 3 seconds\n    setTimeout(() => setShowToast(false), 3000);\n  };\n\n  const handleClockOut = async () => {\n    setIsSubmitting(true);\n    \n    // Simulate API call delay\n    await new Promise(resolve => setTimeout(resolve, 3000));\n    \n    setIsSubmitting(false);\n    setToastMessage(`Clocked out at ${formatTime(new Date())}`);\n    setShowToast(true);\n    \n    // Auto-hide toast after 3 seconds\n    setTimeout(() => setShowToast(false), 3000);\n  };\n\n  const toggleCamera = () => {\n    setShowCamera(!showCamera);\n  };\n\n  const toggleGPSInput = () => {\n    setShowGPSInput(!showGPSInput);\n  };\n\n  const handleGPSChange = (e) => {\n    const { name, value } = e.target;\n    setManualGPS(prev => ({\n      ...prev,\n      [name]: value\n    }));\n  };\n\n  const submitGPS = () => {\n    console.log('Manual GPS submitted:', manualGPS);\n    setShowGPSInput(false);\n  };\n\n  return (\n    <div style={styles.container}>\n      {/* Header */}\n      <div style={styles.header}>\n        <h1 style={styles.title}>WorkPulse Attendance</h1>\n        <div style={styles.statusBar}>\n          <div style={{...styles.badge, backgroundColor: isOnline ? '#4CAF50' : '#F44336'}}>\n            {isOnline ? 'Online' : 'Offline'}\n          </div>\n          <div style={{...styles.badge, backgroundColor: \n            syncStatus === 'synced' ? '#4CAF50' : \n            syncStatus === 'pending' ? '#FF9800' : '#F44336'\n          }}>\n            {syncStatus === 'synced' ? 'Synced' : \n             syncStatus === 'pending' ? 'Pending Sync' : 'Conflict'}\n          </div>\n        </div>\n      </div>\n\n      {/* Main Content */}\n      <div style={styles.content}>\n        {/* Time Display */}\n        <div style={styles.timeSection}>\n          <div style={styles.dateDisplay}>{formatDate(currentTime)}</div>\n          <div style={styles.timeDisplay}>{formatTime(currentTime)}</div>\n          <div style={styles.timezone}>IST (UTC+5:30)</div>\n        </div>\n\n        {/* Clock Buttons */}\n        <div style={styles.buttonContainer}>\n          <button \n            onClick={handleClockIn}\n            disabled={isSubmitting}\n            style={{\n              ...styles.clockButton,\n              backgroundColor: '#4CAF50',\n              marginRight: '20px'\n            }}\n          >\n            {isSubmitting ? (\n              <div style={styles.spinner}></div>\n            ) : (\n              'CLOCK IN'\n            )}\n          </button>\n          \n          <button \n            onClick={handleClockOut}\n            disabled={isSubmitting}\n            style={{\n              ...styles.clockButton,\n              backgroundColor: '#F44336'\n            }}\n          >\n            {isSubmitting ? (\n              <div style={styles.spinner}></div>\n            ) : (\n              'CLOCK OUT'\n            )}\n          </button>\n        </div>\n\n        {/* Additional Options */}\n        <div style={styles.optionsSection}>\n          <button onClick={toggleCamera} style={styles.optionButton}>\n            \ud83d\udcf7 Facial Verification\n          </button>\n          <button onClick={toggleGPSInput} style={styles.optionButton}>\n            \ud83d\udccd Location Override\n          </button>\n        </div>\n\n        {/* Camera Feed (if enabled) */}\n        {showCamera && (\n          <div style={styles.cameraSection}>\n            <div style={styles.cameraPlaceholder}>\n              Camera Feed\n            </div>\n            <button style={styles.captureButton}>Capture Photo</button>\n          </div>\n        )}\n\n        {/* Manual GPS Input */}\n        {showGPSInput && (\n          <div style={styles.gpsSection}>\n            <h3>Manual Location Entry</h3>\n            <div style={styles.gpsInputRow}>\n              <input\n                type=\"text\"\n                name=\"lat\"\n                placeholder=\"Latitude\"\n                value={manualGPS.lat}\n                onChange={handleGPSChange}\n                style={styles.gpsInput}\n              />\n              <input\n                type=\"text\"\n                name=\"lng\"\n                placeholder=\"Longitude\"\n                value={manualGPS.lng}\n                onChange={handleGPSChange}\n                style={styles.gpsInput}\n              />\n            </div>\n            <button onClick={submitGPS} style={styles.submitGPSButton}>\n              Submit Location\n            </button>\n          </div>\n        )}\n\n        {/* Device Info */}\n        <div style={styles.deviceInfo}>\n          <strong>Device:</strong> {deviceInfo.platform} | \n          <strong> Browser:</strong> {deviceInfo.userAgent.substring(0, 30)}...\n        </div>\n      </div>\n\n      {/* Toast Notification */}\n      {showToast && (\n        <div style={styles.toast}>\n          {toastMessage}\n        </div>\n      )}\n    </div>\n  );\n}\n\n// Styles\nconst styles = {\n  container: {\n    minHeight: '100vh',\n    backgroundColor: '#f5f7fa',\n    fontFamily: '\"Segoe UI\", Roboto, sans-serif',\n    padding: '20px'\n  },\n  header: {\n    marginBottom: '30px'\n  },\n  title: {\n    color: '#2c3e50',\n    fontSize: '28px',\n    fontWeight: '600',\n    margin: '0 0 15px 0'\n  },\n  statusBar: {\n    display: 'flex',\n    gap: '10px'\n  },\n  badge: {\n    padding: '5px 12px',\n    borderRadius: '20px',\n    color: 'white',\n    fontSize: '12px',\n    fontWeight: '500'\n  },\n  content: {\n    maxWidth: '600px',\n    margin: '0 auto',\n    backgroundColor: 'white',\n    borderRadius: '12px',\n    padding: '30px',\n    boxShadow: '0 4px 12px rgba(0,0,0,0.05)'\n  },\n  timeSection: {\n    textAlign: 'center',\n    marginBottom: '40px'\n  },\n  dateDisplay: {\n    fontSize: '18px',\n    color: '#7f8c8d',\n    marginBottom: '5px'\n  },\n  timeDisplay: {\n    fontSize: '48px',\n    fontWeight: '700',\n    color: '#2c3e50',\n    margin: '10px 0'\n  },\n  timezone: {\n    fontSize: '14px',\n    color: '#95a5a6'\n  },\n  buttonContainer: {\n    display: 'flex',\n    justifyContent: 'center',\n    marginBottom: '30px'\n  },\n  clockButton: {\n    width: '200px',\n    height: '70px',\n    fontSize: '20px',\n    fontWeight: '600',\n    color: 'white',\n    border: 'none',\n    borderRadius: '12px',\n    cursor: 'pointer',\n    display: 'flex',\n    alignItems: 'center',\n    justifyContent: 'center',\n    boxShadow: '0 4px 6px rgba(0,0,0,0.1)'\n  },\n  spinner: {\n    width: '24px',\n    height: '24px',\n    border: '3px solid rgba(255,255,255,0.3)',\n    borderTop: '3px solid white',\n    borderRadius: '50%',\n    animation: 'spin 1s linear infinite'\n  },\n  optionsSection: {\n    display: 'flex',\n    justifyContent: 'center',\n    gap: '15px',\n    marginBottom: '30px'\n  },\n  optionButton: {\n    backgroundColor: '#3498db',\n    color: 'white',\n    border: 'none',\n    padding: '12px 20px',\n    borderRadius: '8px',\n    cursor: 'pointer',\n    fontSize: '14px',\n    fontWeight: '500'\n  },\n  cameraSection: {\n    textAlign: 'center',\n    marginBottom: '30px'\n  },\n  cameraPlaceholder: {\n    height: '200px',\n    backgroundColor: '#ecf0f1',\n    borderRadius: '8px',\n    display: 'flex',\n    alignItems: 'center',\n    justifyContent: 'center',\n    color: '#7f8c8d',\n    fontSize: '18px',\n    marginBottom: '15px'\n  },\n  captureButton: {\n    backgroundColor: '#9b59b6',\n    color: 'white',\n    border: 'none',\n    padding: '10px 20px',\n    borderRadius: '8px',\n    cursor: 'pointer',\n    fontSize: '16px'\n  },\n  gpsSection: {\n    backgroundColor: '#f8f9fa',\n    padding: '20px',\n    borderRadius: '8px',\n    marginBottom: '20px'\n  },\n  gpsInputRow: {\n    display: 'flex',\n    gap: '10px',\n    marginBottom: '15px'\n  },\n  gpsInput: {\n    flex: 1,\n    padding: '10px',\n    border: '1px solid #ddd',\n    borderRadius: '4px',\n    fontSize: '16px'\n  },\n  submitGPSButton: {\n    backgroundColor: '#27ae60',\n    color: 'white',\n    border: 'none',\n    padding: '10px 20px',\n    borderRadius: '4px',\n    cursor: 'pointer',\n    fontSize: '16px'\n  },\n  deviceInfo: {\n    fontSize: '12px',\n    color: '#7f8c8d',\n    textAlign: 'center',\n    paddingTop: '20px',\n    borderTop: '1px solid #eee'\n  },\n  toast: {\n    position: 'fixed',\n    bottom: '20px',\n    left: '50%',\n    transform: 'translateX(-50%)',\n    backgroundColor: '#27ae60',\n    color: 'white',\n    padding: '15px 30px',\n    borderRadius: '8px',\n    boxShadow: '0 4px 12px rgba(0,0,0,0.15)',\n    zIndex: 1000\n  }\n};\n\n// Add keyframes for spinner animation\nconst styleSheet = document.createElement(\"style\");\nstyleSheet.innerText = `\n  @keyframes spin {\n    0% { transform: rotate(0deg); }\n    100% { transform: rotate(360deg); }\n  }\n`;\ndocument.head.appendChild(styleSheet);\n"}, {"name": "AttendanceCalendar", "source": "function AttendanceCalendar() {\n  const [currentDate, setCurrentDate] = React.useState(new Date());\n  const [selectedDate, setSelectedDate] = React.useState(null);\n  const [filterStatus, setFilterStatus] = React.useState('all');\n  const [timezone, setTimezone] = React.useState('Asia/Kolkata');\n  const [showModal, setShowModal] = React.useState(false);\n  const [modalData, setModalData] = React.useState(null);\n\n  // Mock attendance data\n  const mockAttendanceData = [\n    { date: '2024-06-01', status: 'present', clockIn: '09:05', clockOut: '18:10', lateMinutes: 5, device: 'Web App', verified: true, sync: 'synced' },\n    { date: '2024-06-02', status: 'late', clockIn: '10:30', clockOut: '19:00', lateMinutes: 90, device: 'Mobile App', verified: true, sync: 'synced' },\n    { date: '2024-06-03', status: 'absent', clockIn: null, clockOut: null, lateMinutes: 0, device: null, verified: false, sync: 'synced' },\n    { date: '2024-06-04', status: 'present', clockIn: '08:55', clockOut: '17:58', lateMinutes: 0, device: 'Desktop Client', verified: true, sync: 'synced' },\n    { date: '2024-06-05', status: 'leave', clockIn: null, clockOut: null, lateMinutes: 0, device: null, verified: false, sync: 'synced' },\n    { date: '2024-06-06', status: 'present', clockIn: '09:02', clockOut: '18:05', lateMinutes: 2, device: 'Web App', verified: true, sync: 'synced' },\n    { date: '2024-06-07', status: 'present', clockIn: '08:58', clockOut: '18:15', lateMinutes: 0, device: 'Mobile App', verified: false, sync: 'pending' },\n    { date: '2024-06-08', status: 'present', clockIn: '09:15', clockOut: '18:20', lateMinutes: 15, device: 'Web App', verified: true, sync: 'synced' },\n    { date: '2024-06-09', status: 'absent', clockIn: null, clockOut: null, lateMinutes: 0, device: null, verified: false, sync: 'synced' },\n    { date: '2024-06-10', status: 'late', clockIn: '09:45', clockOut: '18:30', lateMinutes: 45, device: 'Mobile App', verified: true, sync: 'synced' },\n    { date: '2024-06-11', status: 'present', clockIn: '09:00', clockOut: '18:00', lateMinutes: 0, device: 'Desktop Client', verified: true, sync: 'synced' },\n    { date: '2024-06-12', status: 'present', clockIn: '08:55', clockOut: '17:55', lateMinutes: 0, device: 'Web App', verified: true, sync: 'synced' },\n    { date: '2024-06-13', status: 'present', clockIn: '09:05', clockOut: '18:10', lateMinutes: 5, device: 'Mobile App', verified: false, sync: 'synced' },\n    { date: '2024-06-14', status: 'leave', clockIn: null, clockOut: null, lateMinutes: 0, device: null, verified: false, sync: 'synced' },\n    { date: '2024-06-15', status: 'present', clockIn: '09:00', clockOut: '18:05', lateMinutes: 0, device: 'Web App', verified: true, sync: 'synced' },\n  ];\n\n  const getStatusColor = (status) => {\n    switch(status) {\n      case 'present': return 'bg-green-500';\n      case 'late': return 'bg-orange-500';\n      case 'absent': return 'bg-red-500';\n      case 'leave': return 'bg-blue-500';\n      default: return 'bg-gray-300';\n    }\n  };\n\n  const getDaysInMonth = (date) => {\n    const year = date.getFullYear();\n    const month = date.getMonth();\n    const firstDay = new Date(year, month, 1);\n    const lastDay = new Date(year, month + 1, 0);\n    const daysInMonth = lastDay.getDate();\n    const startingDayOfWeek = firstDay.getDay();\n\n    const days = [];\n    \n    // Add empty cells for days before the first day of the month\n    for (let i = 0; i < startingDayOfWeek; i++) {\n      days.push(null);\n    }\n    \n    // Add days of the month\n    for (let i = 1; i <= daysInMonth; i++) {\n      const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;\n      const attendance = mockAttendanceData.find(d => d.date === dateString);\n      days.push({\n        date: i,\n        dateString,\n        attendance\n      });\n    }\n    \n    return days;\n  };\n\n  const days = getDaysInMonth(currentDate);\n  const monthNames = [\"January\", \"February\", \"March\", \"April\", \"May\", \"June\", \n                      \"July\", \"August\", \"September\", \"October\", \"November\", \"December\"];\n  \n  const filteredDays = filterStatus === 'all' \n    ? days \n    : days.filter(day => day && day.attendance && day.attendance.status === filterStatus);\n\n  const handlePrevMonth = () => {\n    setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));\n  };\n\n  const handleNextMonth = () => {\n    setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));\n  };\n\n  const handleToday = () => {\n    setCurrentDate(new Date());\n  };\n\n  const openDayDetail = (day) => {\n    if (day && day.attendance) {\n      setModalData(day.attendance);\n      setShowModal(true);\n    }\n  };\n\n  const closeModal = () => {\n    setShowModal(false);\n    setModalData(null);\n  };\n\n  const exportToCSV = () => {\n    alert('Attendance data exported to CSV successfully!');\n  };\n\n  const getStatusCount = (status) => {\n    return mockAttendanceData.filter(d => d.status === status).length;\n  };\n\n  return (\n    <div className=\"min-h-screen bg-gray-50 p-6\">\n      <div className=\"max-w-6xl mx-auto\">\n        <div className=\"flex justify-between items-center mb-6\">\n          <h1 className=\"text-2xl font-bold text-gray-800\">Attendance Calendar</h1>\n          <button \n            onClick={exportToCSV}\n            className=\"bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md flex items-center\"\n          >\n            <svg className=\"w-4 h-4 mr-2\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n              <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4\"></path>\n            </svg>\n            Export to CSV\n          </button>\n        </div>\n\n        {/* Summary Statistics */}\n        <div className=\"grid grid-cols-1 md:grid-cols-4 gap-4 mb-6\">\n          <div className=\"bg-white p-4 rounded-lg shadow\">\n            <div className=\"text-sm text-gray-500\">Present Days</div>\n            <div className=\"text-2xl font-bold text-green-600\">{getStatusCount('present')}</div>\n          </div>\n          <div className=\"bg-white p-4 rounded-lg shadow\">\n            <div className=\"text-sm text-gray-500\">Late Arrivals</div>\n            <div className=\"text-2xl font-bold text-orange-600\">{getStatusCount('late')}</div>\n          </div>\n          <div className=\"bg-white p-4 rounded-lg shadow\">\n            <div className=\"text-sm text-gray-500\">Absent Days</div>\n            <div className=\"text-2xl font-bold text-red-600\">{getStatusCount('absent')}</div>\n          </div>\n          <div className=\"bg-white p-4 rounded-lg shadow\">\n            <div className=\"text-sm text-gray-500\">Leave Days</div>\n            <div className=\"text-2xl font-bold text-blue-600\">{getStatusCount('leave')}</div>\n          </div>\n        </div>\n\n        {/* Filters */}\n        <div className=\"bg-white p-4 rounded-lg shadow mb-6\">\n          <div className=\"flex flex-wrap items-center justify-between gap-4\">\n            <div className=\"flex items-center space-x-4\">\n              <div>\n                <label className=\"block text-sm font-medium text-gray-700 mb-1\">Filter by Status</label>\n                <select \n                  value={filterStatus} \n                  onChange={(e) => setFilterStatus(e.target.value)}\n                  className=\"border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500\"\n                >\n                  <option value=\"all\">All Statuses</option>\n                  <option value=\"present\">Present</option>\n                  <option value=\"late\">Late</option>\n                  <option value=\"absent\">Absent</option>\n                  <option value=\"leave\">On Leave</option>\n                </select>\n              </div>\n              \n              <div>\n                <label className=\"block text-sm font-medium text-gray-700 mb-1\">Timezone</label>\n                <select \n                  value={timezone} \n                  onChange={(e) => setTimezone(e.target.value)}\n                  className=\"border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500\"\n                >\n                  <option value=\"Asia/Kolkata\">Asia/Kolkata (IST)</option>\n                  <option value=\"America/New_York\">America/New York (EST)</option>\n                  <option value=\"Europe/London\">Europe/London (GMT)</option>\n                  <option value=\"Australia/Sydney\">Australia/Sydney (AEDT)</option>\n                </select>\n              </div>\n            </div>\n            \n            <div className=\"flex items-center space-x-2\">\n              <button \n                onClick={handlePrevMonth}\n                className=\"p-2 rounded-full hover:bg-gray-100\"\n              >\n                <svg className=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M15 19l-7-7 7-7\"></path>\n                </svg>\n              </button>\n              \n              <button \n                onClick={handleToday}\n                className=\"px-4 py-2 text-sm font-medium text-blue-600 hover:text-blue-800\"\n              >\n                Today\n              </button>\n              \n              <button \n                onClick={handleNextMonth}\n                className=\"p-2 rounded-full hover:bg-gray-100\"\n              >\n                <svg className=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M9 5l7 7-7 7\"></path>\n                </svg>\n              </button>\n              \n              <div className=\"text-lg font-semibold text-gray-800\">\n                {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}\n              </div>\n            </div>\n          </div>\n        </div>\n\n        {/* Calendar */}\n        <div className=\"bg-white rounded-lg shadow overflow-hidden\">\n          <div className=\"grid grid-cols-7 gap-px bg-gray-200 border-b\">\n            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((day) => (\n              <div key={day} className=\"bg-white p-3 text-center text-sm font-medium text-gray-500\">\n                {day}\n              </div>\n            ))}\n          </div>\n          \n          <div className=\"grid grid-cols-7 gap-px bg-gray-200\">\n            {filteredDays.map((day, index) => (\n              <div \n                key={index} \n                className={`min-h-24 bg-white p-2 cursor-pointer hover:bg-gray-50 transition-colors ${\n                  day?.attendance?.sync === 'pending' ? 'border-l-4 border-yellow-400' : ''\n                }`}\n                onClick={() => openDayDetail(day)}\n              >\n                {day ? (\n                  <>\n                    <div className=\"text-right text-sm font-medium text-gray-700\">\n                      {day.date}\n                    </div>\n                    {day.attendance ? (\n                      <div className=\"mt-1\">\n                        <div className={`w-3 h-3 rounded-full ${getStatusColor(day.attendance.status)} inline-block mr-1`}></div>\n                        <span className=\"text-xs capitalize\">\n                          {day.attendance.status}\n                        </span>\n                        {day.attendance.sync === 'pending' && (\n                          <span className=\"ml-1 text-xs text-yellow-600\">Offline</span>\n                        )}\n                      </div>\n                    ) : (\n                      <div className=\"text-xs text-gray-400 mt-1\">No record</div>\n                    )}\n                  </>\n                ) : (\n                  <div className=\"h-full\"></div>\n                )}\n              </div>\n            ))}\n          </div>\n        </div>\n\n        {/* Legend */}\n        <div className=\"mt-6 bg-white p-4 rounded-lg shadow\">\n          <div className=\"flex flex-wrap items-center justify-between\">\n            <div className=\"flex items-center space-x-6\">\n              <div className=\"flex items-center\">\n                <div className=\"w-3 h-3 rounded-full bg-green-500 mr-2\"></div>\n                <span className=\"text-sm\">Present</span>\n              </div>\n              <div className=\"flex items-center\">\n                <div className=\"w-3 h-3 rounded-full bg-orange-500 mr-2\"></div>\n                <span className=\"text-sm\">Late Arrival</span>\n              </div>\n              <div className=\"flex items-center\">\n                <div className=\"w-3 h-3 rounded-full bg-red-500 mr-2\"></div>\n                <span className=\"text-sm\">Absent</span>\n              </div>\n              <div className=\"flex items-center\">\n                <div className=\"w-3 h-3 rounded-full bg-blue-500 mr-2\"></div>\n                <span className=\"text-sm\">On Leave</span>\n              </div>\n            </div>\n            <div className=\"flex items-center\">\n              <div className=\"w-3 h-3 border-l-4 border-yellow-400 mr-2\"></div>\n              <span className=\"text-sm\">Offline Record</span>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      {/* Day Detail Modal */}\n      {showModal && modalData && (\n        <div className=\"fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50\">\n          <div className=\"bg-white rounded-lg shadow-xl w-full max-w-md\">\n            <div className=\"p-6\">\n              <div className=\"flex justify-between items-start\">\n                <h3 className=\"text-lg font-semibold text-gray-900\">\n                  Attendance Details\n                </h3>\n                <button \n                  onClick={closeModal}\n                  className=\"text-gray-400 hover:text-gray-500\"\n                >\n                  <svg className=\"w-6 h-6\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                    <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth=\"2\" d=\"M6 18L18 6M6 6l12 12\"></path>\n                  </svg>\n                </button>\n              </div>\n              \n              <div className=\"mt-4 space-y-4\">\n                <div className=\"flex justify-between border-b pb-2\">\n                  <span className=\"text-gray-600\">Date:</span>\n                  <span className=\"font-medium\">{modalData.date}</span>\n                </div>\n                \n                <div className=\"flex justify-between border-b pb-2\">\n                  <span className=\"text-gray-600\">Status:</span>\n                  <span className={`font-medium capitalize ${\n                    modalData.status === 'present' ? 'text-green-600' :\n                    modalData.status === 'late' ? 'text-orange-600' :\n                    modalData.status === 'absent' ? 'text-red-600' : 'text-blue-600'\n                  }`}>\n                    {modalData.status}\n                  </span>\n                </div>\n                \n                {modalData.clockIn && (\n                  <div className=\"flex justify-between border-b pb-2\">\n                    <span className=\"text-gray-600\">Clock In:</span>\n                    <span className=\"font-medium\">{modalData.clockIn}</span>\n                  </div>\n                )}\n                \n                {modalData.clockOut && (\n                  <div className=\"flex justify-between border-b pb-2\">\n                    <span className=\"text-gray-600\">Clock Out:</span>\n                    <span className=\"font-medium\">{modalData.clockOut}</span>\n                  </div>\n                )}\n                \n                {modalData.lateMinutes > 0 && (\n                  <div className=\"flex justify-between border-b pb-2\">\n                    <span className=\"text-gray-600\">Late By:</span>\n                    <span className=\"font-medium text-orange-600\">{modalData.lateMinutes} minutes</span>\n                  </div>\n                )}\n                \n                <div className=\"flex justify-between border-b pb-2\">\n                  <span className=\"text-gray-600\">Device:</span>\n                  <span className=\"font-medium\">{modalData.device || 'N/A'}</span>\n                </div>\n                \n                <div className=\"flex justify-between border-b pb-2\">\n                  <span className=\"text-gray-600\">Verification:</span>\n                  <span className={`font-medium ${modalData.verified ? 'text-green-600' : 'text-gray-500'}`}>\n                    {modalData.verified ? 'Verified' : 'Not Verified'}\n                  </span>\n                </div>\n                \n                <div className=\"flex justify-between border-b pb-2\">\n                  <span className=\"text-gray-600\">Sync Status:</span>\n                  <span className={`font-medium ${\n                    modalData.sync === 'synced' ? 'text-green-600' : 'text-yellow-600'\n                  }`}>\n                    {modalData.sync.charAt(0).toUpperCase() + modalData.sync.slice(1)}\n                  </span>\n                </div>\n              </div>\n              \n              <div className=\"mt-6 flex justify-end\">\n                <button\n                  onClick={closeModal}\n                  className=\"px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500\"\n                >\n                  Close\n                </button>\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n}"}, {"name": "LeaveRequest", "source": "function LeaveRequest() {\n  // Mock data\n  const employee = {\n    id: 1,\n    first_name: \"Alex\",\n    last_name: \"Johnson\",\n    department: \"Engineering\",\n    location: \"New York\"\n  };\n\n  const leaveTypes = [\n    { id: 1, name: \"Annual Leave\", code: \"AL\", balance: 15, maxDays: 20, requiresMedical: false },\n    { id: 2, name: \"Sick Leave\", code: \"SL\", balance: 8, maxDays: 12, requiresMedical: true },\n    { id: 3, name: \"Personal Leave\", code: \"PL\", balance: 5, maxDays: 5, requiresMedical: false }\n  ];\n\n  const holidays = [\n    new Date('2023-12-25'),\n    new Date('2024-01-01'),\n    new Date('2024-07-04')\n  ];\n\n  const pendingRequests = [\n    { id: 101, type: \"Annual Leave\", start: \"2024-06-15\", end: \"2024-06-17\", status: \"Pending\" },\n    { id: 102, type: \"Sick Leave\", start: \"2024-05-20\", end: \"2024-05-22\", status: \"Approved\" }\n  ];\n\n  // State\n  const [selectedLeaveType, setSelectedLeaveType] = React.useState(leaveTypes[0]);\n  const [startDate, setStartDate] = React.useState('');\n  const [endDate, setEndDate] = React.useState('');\n  const [reason, setReason] = React.useState('');\n  const [attachment, setAttachment] = React.useState(null);\n  const [daysRequested, setDaysRequested] = React.useState(0);\n  const [balanceAfter, setBalanceAfter] = React.useState(selectedLeaveType.balance);\n\n  // Calculate working days between dates (excluding weekends and holidays)\n  const calculateWorkingDays = (start, end) => {\n    if (!start || !end) return 0;\n    \n    const startDateObj = new Date(start);\n    const endDateObj = new Date(end);\n    let count = 0;\n    const currentDate = new Date(startDateObj);\n    \n    while (currentDate <= endDateObj) {\n      const dayOfWeek = currentDate.getDay();\n      const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);\n      const isHoliday = holidays.some(holiday => \n        holiday.getDate() === currentDate.getDate() && \n        holiday.getMonth() === currentDate.getMonth() && \n        holiday.getFullYear() === currentDate.getFullYear()\n      );\n      \n      if (!isWeekend && !isHoliday) {\n        count++;\n      }\n      \n      currentDate.setDate(currentDate.getDate() + 1);\n    }\n    \n    return count;\n  };\n\n  // Update days requested and balance when dates change\n  React.useEffect(() => {\n    const days = calculateWorkingDays(startDate, endDate);\n    setDaysRequested(days);\n    setBalanceAfter(selectedLeaveType.balance - days);\n  }, [startDate, endDate, selectedLeaveType]);\n\n  // Handle leave type change\n  const handleLeaveTypeChange = (e) => {\n    const type = leaveTypes.find(t => t.id === parseInt(e.target.value));\n    setSelectedLeaveType(type);\n  };\n\n  // Handle form submission\n  const handleSubmit = (e) => {\n    e.preventDefault();\n    alert(`Leave request submitted!\\nType: ${selectedLeaveType.name}\\nDays: ${daysRequested}\\nBalance after: ${balanceAfter}`);\n    // In a real app, this would trigger an API call\n  };\n\n  // Handle file upload\n  const handleFileUpload = (e) => {\n    setAttachment(e.target.files[0]);\n  };\n\n  return (\n    <div style={{ display: 'flex', minHeight: '100vh', backgroundColor: '#f5f7fa' }}>\n      {/* Sidebar */}\n      <div style={{ width: '240px', backgroundColor: '#2c3e50', color: 'white', padding: '20px 0' }}>\n        <div style={{ padding: '0 20px 20px', borderBottom: '1px solid #34495e' }}>\n          <h2 style={{ margin: '0', fontSize: '22px' }}>WorkPulse</h2>\n          <p style={{ opacity: 0.8, margin: '5px 0 0' }}>{employee.first_name} {employee.last_name}</p>\n        </div>\n        <nav>\n          <a href=\"/\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Dashboard</a>\n          <a href=\"/clock\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Clock In/Out</a>\n          <a href=\"/attendance\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Attendance</a>\n          <a href=\"/leave/request\" style={{ display: 'block', padding: '12px 20px', color: '#3498db', backgroundColor: '#34495e', textDecoration: 'none' }}>Request Leave</a>\n          <a href=\"/team\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Team</a>\n          <a href=\"/shifts\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Shifts</a>\n          <a href=\"/payroll\" style={{ display: 'block', padding: '12px 20px', color: '#bdc3c7', textDecoration: 'none' }}>Payroll</a>\n        </nav>\n      </div>\n\n      {/* Main Content */}\n      <div style={{ flex: 1, padding: '30px' }}>\n        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '30px' }}>\n          <h1 style={{ margin: 0, color: '#2c3e50', fontSize: '28px' }}>Request Time Off</h1>\n          <div style={{ backgroundColor: '#3498db', color: 'white', padding: '8px 16px', borderRadius: '4px' }}>\n            {employee.department} \u2022 {employee.location}\n          </div>\n        </div>\n\n        <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '30px' }}>\n          {/* Left Column - Form */}\n          <div style={{ backgroundColor: 'white', borderRadius: '8px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)', padding: '30px' }}>\n            <form onSubmit={handleSubmit}>\n              <div style={{ marginBottom: '25px' }}>\n                <label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', color: '#2c3e50' }}>Leave Type</label>\n                <select \n                  value={selectedLeaveType.id}\n                  onChange={handleLeaveTypeChange}\n                  style={{ width: '100%', padding: '12px', borderRadius: '4px', border: '1px solid #ddd', fontSize: '16px' }}\n                >\n                  {leaveTypes.map(type => (\n                    <option key={type.id} value={type.id}>\n                      {type.name} ({type.balance} days available)\n                    </option>\n                  ))}\n                </select>\n                <div style={{ marginTop: '10px', padding: '12px', backgroundColor: '#f8f9fa', borderRadius: '4px', fontSize: '14px' }}>\n                  <strong>Policy Details:</strong> {selectedLeaveType.maxDays} days maximum per year. {selectedLeaveType.requiresMedical ? 'Medical certificate required.' : 'No medical certificate needed.'}\n                </div>\n              </div>\n\n              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', marginBottom: '25px' }}>\n                <div>\n                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', color: '#2c3e50' }}>Start Date</label>\n                  <input \n                    type=\"date\" \n                    value={startDate}\n                    onChange={(e) => setStartDate(e.target.value)}\n                    style={{ width: '100%', padding: '12px', borderRadius: '4px', border: '1px solid #ddd', fontSize: '16px' }}\n                  />\n                </div>\n                <div>\n                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', color: '#2c3e50' }}>End Date</label>\n                  <input \n                    type=\"date\" \n                    value={endDate}\n                    onChange={(e) => setEndDate(e.target.value)}\n                    style={{ width: '100%', padding: '12px', borderRadius: '4px', border: '1px solid #ddd', fontSize: '16px' }}\n                  />\n                </div>\n              </div>\n\n              <div style={{ marginBottom: '25px' }}>\n                <label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', color: '#2c3e50' }}>Reason for Leave</label>\n                <textarea \n                  value={reason}\n                  onChange={(e) => setReason(e.target.value)}\n                  placeholder=\"Please provide details about your leave request...\"\n                  rows=\"4\"\n                  style={{ width: '100%', padding: '12px', borderRadius: '4px', border: '1px solid #ddd', fontSize: '16px', resize: 'vertical' }}\n                />\n                <div style={{ textAlign: 'right', marginTop: '5px', fontSize: '14px', color: '#7f8c8d' }}>\n                  {reason.length}/500 characters\n                </div>\n              </div>\n\n              {selectedLeaveType.requiresMedical && (\n                <div style={{ marginBottom: '25px' }}>\n                  <label style={{ display: 'block', marginBottom: '8px', fontWeight: '600', color: '#2c3e50' }}>Medical Certificate</label>\n                  <div style={{ padding: '20px', border: '2px dashed #3498db', borderRadius: '4px', textAlign: 'center', cursor: 'pointer' }}>\n                    <input \n                      type=\"file\" \n                      onChange={handleFileUpload}\n                      style={{ display: 'none' }} \n                      id=\"file-upload\"\n                    />\n                    <label htmlFor=\"file-upload\" style={{ cursor: 'pointer' }}>\n                      <div style={{ color: '#3498db', fontWeight: '600' }}>Click to upload</div>\n                      <div style={{ fontSize: '14px', color: '#7f8c8d', marginTop: '5px' }}>\n                        PDF, JPG, or PNG (max 5MB)\n                      </div>\n                    </label>\n                  </div>\n                  {attachment && (\n                    <div style={{ marginTop: '10px', fontSize: '14px', color: '#27ae60' }}>\n                      \u2713 {attachment.name} uploaded\n                    </div>\n                  )}\n                </div>\n              )}\n\n              <div style={{ display: 'flex', justifyContent: 'flex-end' }}>\n                <button \n                  type=\"submit\" \n                  style={{ \n                    backgroundColor: '#3498db', \n                    color: 'white', \n                    border: 'none', \n                    padding: '12px 30px', \n                    borderRadius: '4px', \n                    fontSize: '16px', \n                    fontWeight: '600', \n                    cursor: 'pointer' \n                  }}\n                >\n                  Submit Request\n                </button>\n              </div>\n            </form>\n          </div>\n\n          {/* Right Column - Summary */}\n          <div>\n            {/* Balance Summary */}\n            <div style={{ backgroundColor: 'white', borderRadius: '8px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)', padding: '25px', marginBottom: '30px' }}>\n              <h3 style={{ margin: '0 0 20px 0', color: '#2c3e50', fontSize: '20px' }}>Leave Balance</h3>\n              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '15px' }}>\n                <div>\n                  <div style={{ fontSize: '14px', color: '#7f8c8d' }}>Current Balance</div>\n                  <div style={{ fontSize: '24px', fontWeight: '600', color: '#2c3e50' }}>{selectedLeaveType.balance} days</div>\n                </div>\n                <div>\n                  <div style={{ fontSize: '14px', color: '#7f8c8d' }}>After Request</div>\n                  <div style={{ fontSize: '24px', fontWeight: '600', color: balanceAfter < 0 ? '#e74c3c' : '#27ae60' }}>{balanceAfter} days</div>\n                </div>\n              </div>\n              <div style={{ height: '8px', backgroundColor: '#ecf0f1', borderRadius: '4px', overflow: 'hidden' }}>\n                <div \n                  style={{ \n                    height: '100%', \n                    width: `${Math.min(100, (daysRequested/selectedLeaveType.maxDays)*100)}%`, \n                    backgroundColor: balanceAfter < 0 ? '#e74c3c' : '#3498db' \n                  }}\n                ></div>\n              </div>\n              <div style={{ marginTop: '15px', fontSize: '14px', color: '#7f8c8d' }}>\n                Requesting {daysRequested} days of {selectedLeaveType.name}\n              </div>\n            </div>\n\n            {/* Policy Summary */}\n            <div style={{ backgroundColor: 'white', borderRadius: '8px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)', padding: '25px', marginBottom: '30px' }}>\n              <h3 style={{ margin: '0 0 20px 0', color: '#2c3e50', fontSize: '20px' }}>Policy Summary</h3>\n              <ul style={{ paddingLeft: '20px', margin: 0 }}>\n                <li style={{ marginBottom: '10px' }}>Maximum {selectedLeaveType.maxDays} days per year</li>\n                <li style={{ marginBottom: '10px' }}>Requests must be submitted at least 3 days in advance</li>\n                <li style={{ marginBottom: '10px' }}>Manager approval required for all requests</li>\n                <li>Holidays and weekends are not counted</li>\n              </ul>\n            </div>\n\n            {/* Pending Requests */}\n            <div style={{ backgroundColor: 'white', borderRadius: '8px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)', padding: '25px' }}>\n              <h3 style={{ margin: '0 0 20px 0', color: '#2c3e50', fontSize: '20px' }}>Pending Requests</h3>\n              {pendingRequests.length > 0 ? (\n                <div>\n                  {pendingRequests.map(request => (\n                    <div key={request.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '12px 0', borderBottom: '1px solid #ecf0f1' }}>\n                      <div>\n                        <div style={{ fontWeight: '600' }}>{request.type}</div>\n                        <div style={{ fontSize: '14px', color: '#7f8c8d' }}>{request.start} to {request.end}</div>\n                      </div>\n                      <div style={{ \n                        padding: '4px 10px', \n                        borderRadius: '4px', \n                        fontSize: '12px', \n                        fontWeight: '600',\n                        backgroundColor: request.status === 'Pending' ? '#f39c12' : '#27ae60',\n                        color: 'white'\n                      }}>\n                        {request.status}\n                      </div>\n                    </div>\n                  ))}\n                </div>\n              ) : (\n                <div style={{ textAlign: 'center', padding: '20px', color: '#7f8c8d' }}>\n                  No pending requests\n                </div>\n              )}\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "TeamAttendance", "source": "function TeamAttendance() {\n  // Mock data\n  const teamMembers = [\n    { id: 1, name: 'Alex Morgan', department: 'Engineering', status: 'present', lateMinutes: 0 },\n    { id: 2, name: 'Taylor Swift', department: 'Marketing', status: 'late', lateMinutes: 15 },\n    { id: 3, name: 'Jamie Lee', department: 'Sales', status: 'absent', lateMinutes: 0 },\n    { id: 4, name: 'Jordan Kim', department: 'HR', status: 'on_leave', lateMinutes: 0 },\n    { id: 5, name: 'Casey Smith', department: 'Finance', status: 'present', lateMinutes: 0 },\n  ];\n\n  const leaveRequests = [\n    { id: 101, employeeName: 'Jamie Lee', startDate: '2023-06-15', endDate: '2023-06-16', reason: 'Medical appointment', status: 'pending' },\n    { id: 102, employeeName: 'Jordan Kim', startDate: '2023-06-20', endDate: '2023-06-22', reason: 'Family vacation', status: 'pending' },\n  ];\n\n  const attendanceSummary = {\n    present: 124,\n    late: 8,\n    absent: 3,\n    onLeave: 5,\n    total: 140\n  };\n\n  const getStatusColor = (status) => {\n    switch(status) {\n      case 'present': return '#4CAF50';\n      case 'late': return '#FF9800';\n      case 'absent': return '#F44336';\n      case 'on_leave': return '#2196F3';\n      default: return '#9E9E9E';\n    }\n  };\n\n  const handleApprove = (requestId) => {\n    console.log(`Approved request ${requestId}`);\n    // In a real app, this would update the state and make an API call\n  };\n\n  const handleReject = (requestId) => {\n    console.log(`Rejected request ${requestId}`);\n    // In a real app, this would update the state and make an API call\n  };\n\n  const handleBulkApprove = () => {\n    console.log('Bulk approved selected requests');\n    // In a real app, this would process multiple requests\n  };\n\n  return (\n    <div className=\"team-attendance\" style={{ padding: '20px', fontFamily: 'Segoe UI, sans-serif' }}>\n      <div className=\"header\" style={{ marginBottom: '30px' }}>\n        <h1 style={{ color: '#333', fontSize: '28px', fontWeight: '600' }}>Team Attendance</h1>\n        <p style={{ color: '#666', marginTop: '5px' }}>Manage your team's attendance and leave requests</p>\n      </div>\n\n      <div className=\"summary-cards\" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '20px', marginBottom: '30px' }}>\n        <div className=\"card\" style={{ backgroundColor: '#fff', borderRadius: '8px', padding: '20px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)' }}>\n          <h3 style={{ margin: '0 0 10px 0', color: '#666', fontSize: '16px' }}>Present</h3>\n          <p style={{ margin: '0', fontSize: '24px', fontWeight: '600', color: '#4CAF50' }}>{attendanceSummary.present}</p>\n        </div>\n        <div className=\"card\" style={{ backgroundColor: '#fff', borderRadius: '8px', padding: '20px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)' }}>\n          <h3 style={{ margin: '0 0 10px 0', color: '#666', fontSize: '16px' }}>Late Arrivals</h3>\n          <p style={{ margin: '0', fontSize: '24px', fontWeight: '600', color: '#FF9800' }}>{attendanceSummary.late}</p>\n        </div>\n        <div className=\"card\" style={{ backgroundColor: '#fff', borderRadius: '8px', padding: '20px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)' }}>\n          <h3 style={{ margin: '0 0 10px 0', color: '#666', fontSize: '16px' }}>Absent</h3>\n          <p style={{ margin: '0', fontSize: '24px', fontWeight: '600', color: '#F44336' }}>{attendanceSummary.absent}</p>\n        </div>\n        <div className=\"card\" style={{ backgroundColor: '#fff', borderRadius: '8px', padding: '20px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)' }}>\n          <h3 style={{ margin: '0 0 10px 0', color: '#666', fontSize: '16px' }}>On Leave</h3>\n          <p style={{ margin: '0', fontSize: '24px', fontWeight: '600', color: '#2196F3' }}>{attendanceSummary.onLeave}</p>\n        </div>\n      </div>\n\n      <div className=\"main-content\" style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '20px' }}>\n        <div className=\"attendance-grid\">\n          <div className=\"section-header\" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>\n            <h2 style={{ margin: '0', fontSize: '20px', color: '#333' }}>Team Attendance Grid</h2>\n            <div>\n              <select style={{ padding: '8px', borderRadius: '4px', border: '1px solid #ddd', marginRight: '10px' }}>\n                <option>All Departments</option>\n                <option>Engineering</option>\n                <option>Marketing</option>\n                <option>Sales</option>\n                <option>HR</option>\n                <option>Finance</option>\n              </select>\n              <button style={{ padding: '8px 15px', backgroundColor: '#1976D2', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer' }}>Filter</button>\n            </div>\n          </div>\n          \n          <div className=\"grid-container\" style={{ backgroundColor: '#fff', borderRadius: '8px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)', overflow: 'hidden' }}>\n            <div className=\"grid-header\" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', backgroundColor: '#f5f5f5', padding: '15px' }}>\n              <div style={{ fontWeight: '600' }}>Employee</div>\n              <div style={{ fontWeight: '600' }}>Department</div>\n              <div style={{ fontWeight: '600' }}>Status</div>\n              <div style={{ fontWeight: '600' }}>Late Minutes</div>\n            </div>\n            \n            {teamMembers.map(member => (\n              <div key={member.id} className=\"grid-row\" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', padding: '15px', borderBottom: '1px solid #eee' }}>\n                <div>{member.name}</div>\n                <div>{member.department}</div>\n                <div>\n                  <span style={{\n                    padding: '4px 8px',\n                    borderRadius: '4px',\n                    backgroundColor: getStatusColor(member.status),\n                    color: 'white',\n                    fontSize: '12px'\n                  }}>\n                    {member.status.replace('_', ' ')}\n                  </span>\n                </div>\n                <div>{member.lateMinutes > 0 ? `${member.lateMinutes} min` : '-'}</div>\n              </div>\n            ))}\n          </div>\n          \n          <div className=\"patterns-section\" style={{ marginTop: '30px' }}>\n            <h3 style={{ fontSize: '18px', color: '#333', marginBottom: '15px' }}>Absence Patterns</h3>\n            <div className=\"pattern-card\" style={{ backgroundColor: '#fff', borderRadius: '8px', padding: '20px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)' }}>\n              <p><strong>Notable Pattern:</strong> Engineering department has 15% higher late arrivals compared to company average.</p>\n            </div>\n          </div>\n        </div>\n        \n        <div className=\"sidebar\">\n          <div className=\"pending-approvals\" style={{ backgroundColor: '#fff', borderRadius: '8px', padding: '20px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)', marginBottom: '20px' }}>\n            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>\n              <h2 style={{ margin: '0', fontSize: '20px', color: '#333' }}>Pending Approvals</h2>\n              <button \n                onClick={handleBulkApprove}\n                style={{ padding: '6px 12px', backgroundColor: '#4CAF50', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '14px' }}\n              >\n                Bulk Approve\n              </button>\n            </div>\n            \n            {leaveRequests.map(request => (\n              <div key={request.id} className=\"request-item\" style={{ padding: '15px', borderBottom: '1px solid #eee' }}>\n                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '10px' }}>\n                  <strong>{request.employeeName}</strong>\n                  <span style={{ backgroundColor: '#FF9800', color: 'white', padding: '2px 6px', borderRadius: '4px', fontSize: '12px' }}>\n                    {request.status}\n                  </span>\n                </div>\n                <p style={{ margin: '5px 0', fontSize: '14px' }}><strong>Dates:</strong> {request.startDate} to {request.endDate}</p>\n                <p style={{ margin: '5px 0', fontSize: '14px' }}><strong>Reason:</strong> {request.reason}</p>\n                <div style={{ display: 'flex', gap: '10px', marginTop: '10px' }}>\n                  <button \n                    onClick={() => handleApprove(request.id)}\n                    style={{ padding: '6px 12px', backgroundColor: '#4CAF50', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '14px' }}\n                  >\n                    Approve\n                  </button>\n                  <button \n                    onClick={() => handleReject(request.id)}\n                    style={{ padding: '6px 12px', backgroundColor: '#F44336', color: 'white', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '14px' }}\n                  >\n                    Reject\n                  </button>\n                </div>\n                <textarea \n                  placeholder=\"Add comment...\" \n                  style={{ width: '100%', marginTop: '10px', padding: '8px', borderRadius: '4px', border: '1px solid #ddd', minHeight: '60px' }}\n                ></textarea>\n              </div>\n            ))}\n          </div>\n          \n          <div className=\"alerts\" style={{ backgroundColor: '#fff', borderRadius: '8px', padding: '20px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)' }}>\n            <h3 style={{ margin: '0 0 15px 0', fontSize: '18px', color: '#333' }}>Late Arrival Alerts</h3>\n            <ul style={{ listStyle: 'none', padding: '0' }}>\n              <li style={{ padding: '10px 0', borderBottom: '1px solid #eee' }}>\n                <strong>Taylor Swift</strong> - 15 minutes late today\n              </li>\n              <li style={{ padding: '10px 0', borderBottom: '1px solid #eee' }}>\n                <strong>Jamie Lee</strong> - 30 minutes late yesterday\n              </li>\n              <li style={{ padding: '10px 0' }}>\n                <strong>Morgan Freeman</strong> - 20 minutes late (3 days ago)\n              </li>\n            </ul>\n          </div>\n          \n          <div className=\"policy-reminders\" style={{ backgroundColor: '#fff', borderRadius: '8px', padding: '20px', boxShadow: '0 2px 10px rgba(0,0,0,0.05)', marginTop: '20px' }}>\n            <h3 style={{ margin: '0 0 15px 0', fontSize: '18px', color: '#333' }}>Policy Reminders</h3>\n            <ul style={{ listStyle: 'none', padding: '0' }}>\n              <li style={{ padding: '10px 0', borderBottom: '1px solid #eee' }}>\n                Grace period for late arrivals: 10 minutes\n              </li>\n              <li style={{ padding: '10px 0' }}>\n                Overtime requires prior approval\n              </li>\n            </ul>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}"}, {"name": "ShiftRoster", "source": "const ShiftRoster = () => {\n  // Mock data\n  const employees = [\n    { id: 1, name: 'Alex Morgan', department: 'Engineering', timezone: 'America/New_York' },\n    { id: 2, name: 'Taylor Kim', department: 'Marketing', timezone: 'Asia/Seoul' },\n    { id: 3, name: 'Jordan Smith', department: 'Sales', timezone: 'Europe/London' },\n    { id: 4, name: 'Casey Brown', department: 'Support', timezone: 'America/Los_Angeles' },\n  ];\n\n  const shifts = [\n    { id: 1, name: 'Day Shift', startTime: '09:00', endTime: '17:00', isOvernight: false },\n    { id: 2, name: 'Night Shift', startTime: '22:00', endTime: '06:00', isOvernight: true },\n    { id: 3, name: 'Evening Shift', startTime: '16:00', endTime: '00:00', isOvernight: false },\n  ];\n\n  const assignments = [\n    { employeeId: 1, shiftId: 1, date: '2023-06-15' },\n    { employeeId: 2, shiftId: 2, date: '2023-06-15' },\n    { employeeId: 3, shiftId: 3, date: '2023-06-15' },\n  ];\n\n  const [selectedDate, setSelectedDate] = React.useState('2023-06-15');\n  const [selectedTimezone, setSelectedTimezone] = React.useState('UTC');\n  const [searchTerm, setSearchTerm] = React.useState('');\n  const [draggedEmployee, setDraggedEmployee] = React.useState(null);\n\n  const filteredEmployees = employees.filter(emp => \n    emp.name.toLowerCase().includes(searchTerm.toLowerCase()) ||\n    emp.department.toLowerCase().includes(searchTerm.toLowerCase())\n  );\n\n  const handleDragStart = (e, employee) => {\n    setDraggedEmployee(employee);\n    e.dataTransfer.effectAllowed = 'copy';\n  };\n\n  const handleDragOver = (e) => {\n    e.preventDefault();\n    e.dataTransfer.dropEffect = 'copy';\n  };\n\n  const handleDrop = (e, shiftId) => {\n    e.preventDefault();\n    // In a real app, this would update assignments\n    console.log(`Assigned ${draggedEmployee.name} to shift ${shiftId}`);\n    setDraggedEmployee(null);\n  };\n\n  const exportToCSV = () => {\n    alert('Exporting shift roster to CSV...');\n  };\n\n  const importFromCSV = () => {\n    alert('Importing shift roster from CSV...');\n  };\n\n  return (\n    <div className=\"flex h-screen bg-gray-50\">\n      {/* Sidebar */}\n      <div className=\"w-64 bg-white shadow-md p-4\">\n        <h2 className=\"text-xl font-bold text-gray-800 mb-6\">Shift Roster</h2>\n        \n        <div className=\"mb-6\">\n          <label className=\"block text-sm font-medium text-gray-700 mb-1\">Timezone</label>\n          <select \n            className=\"w-full p-2 border border-gray-300 rounded-md\"\n            value={selectedTimezone}\n            onChange={(e) => setSelectedTimezone(e.target.value)}\n          >\n            <option value=\"UTC\">UTC</option>\n            <option value=\"America/New_York\">Eastern Time</option>\n            <option value=\"Europe/London\">London</option>\n            <option value=\"Asia/Seoul\">Seoul</option>\n          </select>\n        </div>\n        \n        <div className=\"mb-6\">\n          <label className=\"block text-sm font-medium text-gray-700 mb-1\">Search Employees</label>\n          <input\n            type=\"text\"\n            className=\"w-full p-2 border border-gray-300 rounded-md\"\n            placeholder=\"Name or department\"\n            value={searchTerm}\n            onChange={(e) => setSearchTerm(e.target.value)}\n          />\n        </div>\n        \n        <div className=\"mb-6\">\n          <h3 className=\"font-medium text-gray-700 mb-2\">Shift Templates</h3>\n          <ul className=\"space-y-2\">\n            <li className=\"text-sm text-blue-600 cursor-pointer hover:underline\">Standard Day Shift</li>\n            <li className=\"text-sm text-blue-600 cursor-pointer hover:underline\">Night Rotation</li>\n            <li className=\"text-sm text-blue-600 cursor-pointer hover:underline\">Weekend Coverage</li>\n          </ul>\n        </div>\n        \n        <div className=\"flex space-x-2\">\n          <button \n            className=\"flex-1 bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition\"\n            onClick={exportToCSV}\n          >\n            Export\n          </button>\n          <button \n            className=\"flex-1 bg-gray-200 text-gray-800 py-2 px-4 rounded-md hover:bg-gray-300 transition\"\n            onClick={importFromCSV}\n          >\n            Import\n          </button>\n        </div>\n      </div>\n\n      {/* Main Content */}\n      <div className=\"flex-1 p-6 overflow-auto\">\n        <div className=\"bg-white rounded-lg shadow mb-6 p-4\">\n          <div className=\"flex justify-between items-center mb-4\">\n            <h1 className=\"text-2xl font-bold text-gray-800\">June 2023</h1>\n            <div className=\"flex space-x-2\">\n              <button className=\"p-2 rounded-md hover:bg-gray-100\">\n                <svg className=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M15 19l-7-7 7-7\" />\n                </svg>\n              </button>\n              <button className=\"p-2 rounded-md hover:bg-gray-100\">\n                <svg className=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M9 5l7 7-7 7\" />\n                </svg>\n              </button>\n            </div>\n          </div>\n          \n          <div className=\"grid grid-cols-7 gap-1 mb-2\">\n            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (\n              <div key={day} className=\"text-center font-medium text-gray-500 py-2\">{day}</div>\n            ))}\n          </div>\n          \n          <div className=\"grid grid-cols-7 gap-1\">\n            {Array.from({ length: 30 }, (_, i) => {\n              const date = `2023-06-${String(i + 1).padStart(2, '0')}`;\n              const isToday = date === selectedDate;\n              return (\n                <div \n                  key={date}\n                  className={`min-h-24 border rounded-md p-2 ${isToday ? 'bg-blue-50 border-blue-300' : 'border-gray-200'}`}\n                  onClick={() => setSelectedDate(date)}\n                >\n                  <div className=\"font-medium text-gray-700\">{i + 1}</div>\n                  <div className=\"text-xs text-gray-500 mt-1\">\n                    {assignments.filter(a => a.date === date).length} assigned\n                  </div>\n                </div>\n              );\n            })}\n          </div>\n        </div>\n        \n        <div className=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n          {/* Employee List */}\n          <div className=\"bg-white rounded-lg shadow p-4\">\n            <h2 className=\"text-lg font-semibold text-gray-800 mb-4\">Employees</h2>\n            <div className=\"space-y-3\">\n              {filteredEmployees.map(employee => (\n                <div \n                  key={employee.id}\n                  className=\"flex items-center p-3 border border-gray-200 rounded-md cursor-move hover:bg-gray-50\"\n                  draggable\n                  onDragStart={(e) => handleDragStart(e, employee)}\n                >\n                  <div className=\"bg-gray-200 border-2 border-dashed rounded-xl w-10 h-10\" />\n                  <div className=\"ml-3\">\n                    <div className=\"font-medium text-gray-800\">{employee.name}</div>\n                    <div className=\"text-sm text-gray-500\">{employee.department}</div>\n                  </div>\n                </div>\n              ))}\n            </div>\n          </div>\n          \n          {/* Shift Assignments */}\n          <div className=\"lg:col-span-2 bg-white rounded-lg shadow p-4\">\n            <h2 className=\"text-lg font-semibold text-gray-800 mb-4\">Shift Assignments - {selectedDate}</h2>\n            \n            <div className=\"space-y-4\">\n              {shifts.map(shift => (\n                <div \n                  key={shift.id}\n                  className=\"border border-gray-200 rounded-md p-4\"\n                  onDragOver={handleDragOver}\n                  onDrop={(e) => handleDrop(e, shift.id)}\n                >\n                  <div className=\"flex justify-between items-center mb-2\">\n                    <h3 className=\"font-medium text-gray-800\">{shift.name}</h3>\n                    {shift.isOvernight && (\n                      <span className=\"bg-purple-100 text-purple-800 text-xs px-2 py-1 rounded\">Overnight</span>\n                    )}\n                  </div>\n                  <div className=\"text-sm text-gray-600 mb-3\">\n                    {shift.startTime} - {shift.endTime} ({shift.isOvernight ? 'Next Day' : 'Same Day'})\n                  </div>\n                  \n                  <div className=\"space-y-2\">\n                    {assignments\n                      .filter(a => a.shiftId === shift.id && a.date === selectedDate)\n                      .map(assignment => {\n                        const employee = employees.find(e => e.id === assignment.employeeId);\n                        return (\n                          <div key={`${assignment.employeeId}-${assignment.date}`} className=\"flex items-center p-2 bg-gray-50 rounded\">\n                            <div className=\"bg-gray-200 border-2 border-dashed rounded-xl w-8 h-8\" />\n                            <div className=\"ml-2 text-sm text-gray-700\">{employee?.name}</div>\n                          </div>\n                        );\n                      })\n                    }\n                  </div>\n                </div>\n              ))}\n            </div>\n            \n            <div className=\"mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-md\">\n              <div className=\"flex\">\n                <svg className=\"w-5 h-5 text-yellow-500 mr-2 mt-0.5\" fill=\"currentColor\" viewBox=\"0 0 20 20\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <path fillRule=\"evenodd\" d=\"M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z\" clipRule=\"evenodd\" />\n                </svg>\n                <div>\n                  <h4 className=\"font-medium text-yellow-800\">Overlap Warning</h4>\n                  <p className=\"text-sm text-yellow-700 mt-1\">2 employees have overlapping shifts. Please review assignments.</p>\n                </div>\n              </div>\n            </div>\n          </div>\n        </div>\n        \n        <div className=\"mt-6 bg-white rounded-lg shadow p-4\">\n          <h2 className=\"text-lg font-semibold text-gray-800 mb-4\">Team Capacity</h2>\n          <div className=\"flex items-end h-32 space-x-2\">\n            {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((day, index) => (\n              <div key={day} className=\"flex-1 flex flex-col items-center\">\n                <div \n                  className=\"w-full bg-blue-500 rounded-t\" \n                  style={{ height: `${70 - index * 8}%` }}\n                ></div>\n                <div className=\"text-xs text-gray-600 mt-2\">{day}</div>\n              </div>\n            ))}\n          </div>\n          <div className=\"mt-4 text-sm text-gray-600\">\n            <p>Current capacity: 85% (42/50 scheduled)</p>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n};"}, {"name": "PayrollExport", "source": "function PayrollExport() {\n  const [selectedMonth, setSelectedMonth] = React.useState('2024-03');\n  const [isLocked, setIsLocked] = React.useState(true);\n  const [exportPreview, setExportPreview] = React.useState([]);\n  const [apiKey, setApiKey] = React.useState('sk_live_51J...');\n  const [showApiKey, setShowApiKey] = React.useState(false);\n  const [columnConfig, setColumnConfig] = React.useState({\n    employeeId: true,\n    fullName: true,\n    department: true,\n    workedHours: true,\n    overtime: true,\n    lateArrivals: true,\n    leavesTaken: true,\n    policyVersion: true\n  });\n  \n  // Mock data for export preview\n  React.useEffect(() => {\n    setExportPreview([\n      { id: 'EMP001', name: 'Sarah Johnson', department: 'Engineering', hours: 176, overtime: 8.5, late: 2, leaves: 1, policy: 'v2.1' },\n      { id: 'EMP002', name: 'Michael Chen', department: 'Marketing', hours: 160, overtime: 0, late: 0, leaves: 3, policy: 'v2.1' },\n      { id: 'EMP003', name: 'Priya Sharma', department: 'Sales', hours: 168, overtime: 4.2, late: 1, leaves: 0, policy: 'v2.1' },\n      { id: 'EMP004', name: 'James Wilson', department: 'Support', hours: 152, overtime: 0, late: 4, leaves: 2, policy: 'v2.1' },\n      { id: 'EMP005', name: 'Fatima Al-Mansoori', department: 'Operations', hours: 172, overtime: 6.8, late: 0, leaves: 1, policy: 'v2.1' }\n    ]);\n  }, [selectedMonth]);\n\n  const toggleColumn = (column) => {\n    setColumnConfig(prev => ({\n      ...prev,\n      [column]: !prev[column]\n    }));\n  };\n\n  const generateCSV = () => {\n    // In a real app, this would create and download a CSV file\n    alert('CSV file generated successfully!');\n  };\n\n  const regenerateReport = () => {\n    alert('Payroll report regenerated');\n  };\n\n  const togglePeriodLock = () => {\n    setIsLocked(!isLocked);\n  };\n\n  const regenerateApiKey = () => {\n    setApiKey('sk_live_' + Math.random().toString(36).substr(2, 10));\n  };\n\n  return (\n    <div className=\"min-h-screen bg-gray-50\">\n      {/* Header */}\n      <div className=\"bg-white shadow-sm border-b\">\n        <div className=\"max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8\">\n          <div className=\"flex justify-between items-center\">\n            <h1 className=\"text-2xl font-bold text-gray-900\">Payroll Export</h1>\n            <div className=\"flex space-x-3\">\n              <button \n                onClick={generateCSV}\n                className=\"inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none\"\n              >\n                <svg className=\"-ml-1 mr-2 h-5 w-5\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 20 20\" fill=\"currentColor\">\n                  <path fillRule=\"evenodd\" d=\"M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z\" clipRule=\"evenodd\" />\n                </svg>\n                Download CSV\n              </button>\n              <button \n                onClick={regenerateReport}\n                className=\"inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none\"\n              >\n                Regenerate Report\n              </button>\n            </div>\n          </div>\n        </div>\n      </div>\n\n      <div className=\"max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8\">\n        <div className=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n          {/* Main Content */}\n          <div className=\"lg:col-span-2 space-y-6\">\n            {/* Month Picker and Lock Status */}\n            <div className=\"bg-white shadow rounded-lg p-6\">\n              <div className=\"flex justify-between items-center mb-4\">\n                <h2 className=\"text-lg font-medium text-gray-900\">Payroll Period</h2>\n                <div className=\"flex items-center space-x-4\">\n                  <span className={`inline-flex items-center px-3 py-1 rounded-full text-sm font-medium ${isLocked ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}`}>\n                    <svg className=\"-ml-1 mr-1.5 h-2 w-2 text-current\" fill=\"currentColor\" viewBox=\"0 0 8 8\">\n                      <circle cx=\"4\" cy=\"4\" r=\"3\" />\n                    </svg>\n                    {isLocked ? 'Locked' : 'Unlocked'}\n                  </span>\n                  <button\n                    onClick={togglePeriodLock}\n                    className={`inline-flex items-center px-3 py-1 rounded-md text-sm font-medium ${\n                      isLocked \n                        ? 'text-orange-700 bg-orange-100 hover:bg-orange-200' \n                        : 'text-blue-700 bg-blue-100 hover:bg-blue-200'\n                    }`}\n                  >\n                    {isLocked ? 'Unlock Period' : 'Lock Period'}\n                  </button>\n                </div>\n              </div>\n              \n              <div className=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\n                <div>\n                  <label htmlFor=\"month-picker\" className=\"block text-sm font-medium text-gray-700 mb-1\">\n                    Select Month\n                  </label>\n                  <input\n                    type=\"month\"\n                    id=\"month-picker\"\n                    value={selectedMonth}\n                    onChange={(e) => setSelectedMonth(e.target.value)}\n                    className=\"block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm\"\n                  />\n                </div>\n                \n                <div>\n                  <label className=\"block text-sm font-medium text-gray-700 mb-1\">\n                    Policy Version\n                  </label>\n                  <div className=\"mt-1 flex items-center\">\n                    <span className=\"inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800\">\n                      v2.1 (Effective: Jan 2024)\n                    </span>\n                  </div>\n                </div>\n              </div>\n            </div>\n\n            {/* Export Preview */}\n            <div className=\"bg-white shadow rounded-lg overflow-hidden\">\n              <div className=\"px-6 py-4 border-b border-gray-200\">\n                <h2 className=\"text-lg font-medium text-gray-900\">Export Preview</h2>\n                <p className=\"mt-1 text-sm text-gray-500\">\n                  Showing first 5 records. {exportPreview.length} total records for this period.\n                </p>\n              </div>\n              <div className=\"overflow-x-auto\">\n                <table className=\"min-w-full divide-y divide-gray-200\">\n                  <thead className=\"bg-gray-50\">\n                    <tr>\n                      {columnConfig.employeeId && <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Employee ID</th>}\n                      {columnConfig.fullName && <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Full Name</th>}\n                      {columnConfig.department && <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Department</th>}\n                      {columnConfig.workedHours && <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Worked Hours</th>}\n                      {columnConfig.overtime && <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Overtime (hrs)</th>}\n                      {columnConfig.lateArrivals && <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Late Arrivals</th>}\n                      {columnConfig.leavesTaken && <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Leaves Taken</th>}\n                      {columnConfig.policyVersion && <th className=\"px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider\">Policy Version</th>}\n                    </tr>\n                  </thead>\n                  <tbody className=\"bg-white divide-y divide-gray-200\">\n                    {exportPreview.map((record) => (\n                      <tr key={record.id}>\n                        {columnConfig.employeeId && <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{record.id}</td>}\n                        {columnConfig.fullName && <td className=\"px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900\">{record.name}</td>}\n                        {columnConfig.department && <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{record.department}</td>}\n                        {columnConfig.workedHours && <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{record.hours}</td>}\n                        {columnConfig.overtime && <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{record.overtime}</td>}\n                        {columnConfig.lateArrivals && <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{record.late}</td>}\n                        {columnConfig.leavesTaken && <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{record.leaves}</td>}\n                        {columnConfig.policyVersion && <td className=\"px-6 py-4 whitespace-nowrap text-sm text-gray-500\">{record.policy}</td>}\n                      </tr>\n                    ))}\n                  </tbody>\n                </table>\n              </div>\n            </div>\n          </div>\n\n          {/* Sidebar */}\n          <div className=\"space-y-6\">\n            {/* Column Configuration */}\n            <div className=\"bg-white shadow rounded-lg p-6\">\n              <h3 className=\"text-lg font-medium text-gray-900 mb-4\">Column Configuration</h3>\n              <div className=\"space-y-3\">\n                {Object.entries(columnConfig).map(([key, enabled]) => (\n                  <div key={key} className=\"flex items-center\">\n                    <input\n                      id={`col-${key}`}\n                      name={`col-${key}`}\n                      type=\"checkbox\"\n                      checked={enabled}\n                      onChange={() => toggleColumn(key)}\n                      className=\"h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500\"\n                    />\n                    <label htmlFor={`col-${key}`} className=\"ml-3 text-sm text-gray-700 capitalize\">\n                      {key.replace(/([A-Z])/g, ' $1').trim()}\n                    </label>\n                  </div>\n                ))}\n              </div>\n            </div>\n\n
